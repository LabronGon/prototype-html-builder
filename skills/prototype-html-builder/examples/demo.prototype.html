<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype HTML 画布编辑器</title>
<style>
/* ============ 设计 Token（统一设计规范） ============ */
:root{
  --brand:#3670F7;
  --brand-ai:#3662EC;
  --bg-panel:#FAFAFA;
  --bg-canvas:#EFEFEF;
  --text-1:rgba(0,0,0,.85);
  --text-strong:rgba(0,0,0,.93);
  --text-2:rgba(0,0,0,.5);
  --text-3:rgba(0,0,0,.33);
  --text-dis:rgba(0,0,0,.25);
  --fill:rgba(0,0,0,.06);
  --hover:rgba(0,0,0,.08);
  --line-04:rgba(0,0,0,.04);
  --line-06:rgba(0,0,0,.06);
  --line-soft:#EFEFEF;
  --r-sm:6px;--r-md:8px;--r-lg:10px;
  --nav-h:48px;--tab-h:42px;--row-h:30px;
  --shadow-pop:0 2px 4px rgba(0,0,0,.16);
  --shadow-modal:0 10px 24px rgba(0,0,0,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:Inter,"Apple System","SF Pro SC","SF Pro Display","Helvetica Neue",Arial,
  "PingFang SC","Hiragino Sans GB",STHeiti,"Microsoft YaHei","Microsoft JhengHei",
  "Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  font-size:12px;line-height:1.8;color:var(--text-1);
  user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
svg{display:block;flex:none}
input,textarea{font:inherit;color:var(--text-1)}
input::placeholder,textarea::placeholder{color:var(--text-3)}

.app{display:flex;flex-direction:column;height:100vh}

/* ============ 通用图标按钮 ============ */
.icon-btn{
  width:30px;height:30px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-1);position:relative;flex:none;
}
.icon-btn:hover{background:var(--hover)}
.icon-btn:disabled{color:var(--text-dis)}

/* ============ 顶栏 48px ============ */
.nav{
  height:var(--nav-h);flex:none;background:var(--bg-panel);
  box-shadow:inset 0 -1px 0 var(--line-soft);
  display:flex;align-items:center;
  padding:0 16px 0 12px;position:relative;z-index:10;
}
.nav-left{display:flex;align-items:center;min-width:0}
.file-info{display:flex;align-items:center;height:40px;margin:0 16px 0 6px;min-width:0}
.file-info .team{font-size:13px;font-weight:600;color:var(--text-2);padding-right:3px;white-space:nowrap}
.file-info .sep-arrow{color:var(--text-1);margin:0 1px}
.file-info .slash{font-size:13px;color:var(--text-dis);margin:0 3px}
.file-info .file-name{font-size:13px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
/* P33：自动保存状态提示（顶栏文件名右侧） */
.auto-tip{font-size:11px;color:var(--text-3);white-space:nowrap;margin-left:10px;transition:color .2s;pointer-events:none;animation:autoTipIn .25s ease}
.auto-tip.err{color:#E5484D}
@keyframes autoTipIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.chev-btn{width:24px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text-2)}
.chev-btn:hover{background:var(--hover)}

/* 中间工具组：555px 居中，中心偏移 -2px */
.nav-tools{
  position:absolute;left:50%;top:8px;transform:translateX(-50%);margin-left:-2px;
  height:32px;display:flex;align-items:center;gap:4px;
}
.tool-btn{
  width:32px;height:32px;border-radius:var(--r-sm);flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-1);background:transparent;
  transition:background .12s ease;
}
.tool-btn:hover{background:var(--hover)}
.tool-btn.active{background:var(--brand);color:#fff}
.tool-btn.active:hover{background:var(--brand)}
.tool-btn.sm{width:30px;height:30px}
.tool-btn:disabled{color:var(--text-dis)}
.tool-btn:disabled:hover{background:transparent}
.tool-divider{width:1px;height:16px;background:rgba(0,0,0,.12);margin:0 8px;flex:none}
/* 矩形子工具角标 + 形状子菜单 */
.sub-chev{
  position:absolute;right:2px;bottom:2px;width:10px;height:10px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;color:var(--text-3);
  opacity:.75;pointer-events:none;transition:opacity .12s ease;
}
.tool-btn{position:relative}
.tool-btn:hover .sub-chev{opacity:1;color:var(--text-2)}
.tool-btn.active .sub-chev{color:#fff;opacity:.9}
#shapeMenu,#textMenu{
  position:absolute;z-index:60;background:#fff;border:1px solid var(--line-06);
  border-radius:10px;box-shadow:var(--shadow-modal);padding:4px;display:none;min-width:172px;
}
#shapeMenu.open,#textMenu.open{display:block}
#shapeMenu .smi,#textMenu .smi{
  display:flex;align-items:center;gap:9px;height:36px;padding:0 10px;
  border-radius:6px;cursor:pointer;color:var(--text-1);font-size:12px;font-weight:500;
}
#shapeMenu .smi:hover,#textMenu .smi:hover,#shapeMenu .smi.kbd,#textMenu .smi.kbd{background:var(--fill)}
#shapeMenu .smi.dis,#textMenu .smi.dis{color:var(--text-dis);cursor:default}
#shapeMenu .smi.dis:hover,#textMenu .smi.dis:hover{background:none}
#shapeMenu .smi .k,#textMenu .smi .k{margin-left:auto;color:var(--text-3)}
/* 自定义 tooltip（深色延迟气泡） */
#tip{
  position:fixed;z-index:99;background:rgba(0,0,0,.78);color:#fff;
  font-size:12px;line-height:1;padding:7px 10px;border-radius:6px;
  pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .1s ease;
}
#tip.show{opacity:1}
/* 评论 pin 与输入气泡（评论） */
#commentBox{
  position:absolute;z-index:30;width:240px;background:#fff;border-radius:10px;
  box-shadow:var(--shadow-modal);border:1px solid var(--line-06);padding:10px;display:none;
}
#commentBox .cb-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
#commentBox .cb-av{width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
#commentBox .cb-name{font-weight:600;color:var(--text-strong)}
#commentBox #cmtDel{margin-left:auto;color:var(--text-2);display:none;align-items:center;justify-content:center;width:24px;height:24px;border-radius:4px}
#commentBox #cmtDel:hover{background:var(--hover);color:var(--text-1)}
#commentBox textarea{width:100%;height:52px;border:0;outline:0;resize:none;font-size:12px;line-height:1.6;color:var(--text-1);background:none}
/* P16：评论线程（原评论 + 回复列表 + 回复输入） */
#commentBox .cb-thread{max-height:140px;overflow-y:auto;border-top:1px solid var(--line-04);margin-top:4px}
#commentBox .cb-item{padding:6px 0}
#commentBox .cb-item+.cb-item{border-top:1px solid var(--line-04)}
#commentBox .cb-meta{display:flex;align-items:center;gap:6px;font-size:11px;line-height:16px;color:var(--text-3);margin-bottom:2px}
#commentBox .cb-meta b{font-weight:600;color:var(--text-2)}
#commentBox .cb-txt{font-size:12px;line-height:1.6;color:var(--text-1);white-space:pre-wrap;word-break:break-word}
#commentBox .cb-reply{width:100%;height:30px;border:0;border-top:1px solid var(--line-04);outline:0;font-size:12px;padding:6px 0 0;background:none}
#commentBox .cb-empty{padding:6px 0;font-size:11px;color:var(--text-3)}
.tool-btn.ai{color:var(--brand-ai)}

/* 右侧组 */
.nav-right{margin-left:auto;display:flex;align-items:center;gap:0}
.btn-share{
  width:48px;height:30px;margin-left:38px;border-radius:var(--r-sm);
  background:var(--brand);color:#fff;font-size:12px;font-weight:600;flex:none;
}
.btn-share:hover{background:#2A5FE8}
.btn-play{width:32px;height:32px;margin-left:20px;color:var(--text-1)}
.zoom-btn{
  width:70px;height:32px;margin-left:8px;border-radius:var(--r-sm);
  background:rgba(0,0,0,.04); /* V3 ：浅灰胶囊底 */
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12px;font-weight:500;color:var(--text-1);flex:none;
}
.zoom-btn:hover{background:var(--hover)}
.zoom-btn .chev{color:var(--text-2)}

/* ============ 主体 ============ */
.body{flex:1;display:flex;min-height:0;position:relative}

/* ---- 左栏 282px ---- */
.left{
  width:282px;flex:none;background:var(--bg-panel);
  box-shadow:inset -1px 0 0 var(--line-soft);
  display:flex;flex-direction:column;min-height:0;
}
.tabbar{height:var(--tab-h);flex:none;display:flex;align-items:center;padding:0 6px}
.tabbar .tabs{display:flex;align-items:center;gap:12px;height:100%}
.tab{
  padding:0 6px;height:100%;font-size:12px;font-weight:500;
  color:var(--text-2);border-radius:0;flex:none;
}
.tab:hover{color:var(--text-1)}
.tab.on{font-weight:600;color:var(--text-strong)}
.tabbar .bell{margin-left:auto}
.bell .dot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:#F53F3F}
.tabbar.r{padding:0 12px 0 6px}

.pane{flex:1;min-height:0;display:flex;flex-direction:column}
.pane[hidden]{display:none}

/* 页面区头部 42px */
.page-head{
  height:var(--tab-h);flex:none;display:flex;align-items:center;
  padding:0 6px 0 12px;
}
.page-head .ph-title{font-size:12px;font-weight:500;color:var(--text-1)}
.page-head .ph-icons{margin-left:auto;display:flex}
.page-head .icon-btn{width:30px;height:30px}

/* 页面树：固定高，行 30px 缩进 18 */
.page-tree{height:484px;flex:none;overflow-y:auto;overflow-x:hidden}
.prow{
  height:var(--row-h);margin:0 6px;border-radius:var(--r-sm);
  display:flex;align-items:center;font-size:12px;line-height:18px;font-weight:500;
  color:var(--text-1);cursor:pointer;padding-right:6px;
}
.prow:hover{background:var(--fill)}
.prow.active{font-weight:600;color:var(--text-strong)}
.prow .caret{width:14px;height:14px;margin-left:17px;color:rgba(0,0,0,.57);transition:transform .12s ease;flex:none;transform:rotate(-90deg)}
.prow .caret.open{transform:rotate(0deg)}
.prow .caret.empty{visibility:hidden}
.prow .nm{margin-left:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}

/* 分拖条 6px */
.splitter{height:6px;flex:none;cursor:row-resize;position:relative}
.splitter::after{
  content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:transparent;
}
.splitter:hover::after{background:rgba(0,0,0,.12)}

/* 图层区 */
.layers-area{flex:1;min-height:0;display:flex;flex-direction:column}
.search-row{height:var(--tab-h);flex:none;display:flex;align-items:center}
.search-box{
  height:30px;margin:0 6px;flex:1;border-radius:var(--r-sm);
  background:var(--fill);display:flex;align-items:center;
}
.search-box:focus-within{background:#fff;box-shadow:inset 0 0 0 1px var(--brand)}
.search-box input{
  flex:1;min-width:0;height:30px;border:0;background:none;outline:0;
  padding:0 0 0 12px;font-size:12px;font-weight:500;
}
.search-box .sbtn{width:24px;height:24px;margin-right:3px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.search-box .sbtn:hover{color:var(--text-1)}
.layer-list{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}
.lrow{
  height:var(--row-h);margin:0 8px;border-radius:var(--r-sm);
  display:flex;align-items:center;font-size:12px;line-height:28px;font-weight:500;
  color:var(--text-strong);cursor:pointer;
}
.lrow:hover{background:var(--fill)}
.lrow.sel{background:var(--fill)}
.lrow .lc{width:18px;height:18px;margin-left:1px;color:rgba(0,0,0,.57);flex:none;display:flex;align-items:center;justify-content:center;transition:transform .12s ease;cursor:pointer;border-radius:4px;transform:rotate(-90deg)}
.lrow .lc:hover{background:var(--fill)}
.lrow .lc.open{transform:rotate(0deg)}
.lrow .lc.empty{visibility:hidden}
.lrow .ti{width:14px;height:14px;margin-left:12px;color:var(--text-2);flex:none}
.lrow .nm{margin-left:3px;padding-left:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.lrow .acts{margin-left:auto;display:none;align-items:center;gap:2px;padding-right:3px}
.lrow:hover .acts{display:flex}
.lrow .acts button{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.lrow .acts button:hover{color:var(--text-1);background:var(--hover)}
.lrow .acts button.on{color:var(--brand)}
/* P12-B：图层拖拽排序（三段落点：上/中/下） */
.lrow{user-select:none}
.lrow.dragging{opacity:.45}
.lrow.drop-before{box-shadow:inset 0 2px 0 var(--brand)}
.lrow.drop-after{box-shadow:inset 0 -2px 0 var(--brand)}
.lrow.drop-inside{background:rgba(54,112,247,.12);box-shadow:inset 0 0 0 1px var(--brand)}
body.lay-drag{cursor:grabbing!important;user-select:none}
.rename-input{
  flex:1;min-width:0;height:22px;border:0;outline:0;background:#fff;
  box-shadow:inset 0 0 0 1px var(--brand);border-radius:4px;
  padding:0 4px;font-size:12px;font-weight:500;margin-right:6px;
}
/* ---- 画布区 ---- */
.canvas-wrap{flex:1;min-width:0;position:relative;background:var(--bg-canvas);overflow:hidden}
#stage{position:absolute;inset:0;display:block;width:100%;height:100%}
#textEditor{
  position:absolute;display:none;background:transparent;border:0;outline:0;
  padding:0;margin:0;resize:none;overflow:hidden;z-index:6;
  transform-origin:0 0;white-space:pre;
}
/* P6 多选对齐/分布工具条 */
#ctxBar{
  position:absolute;z-index:20;display:flex;align-items:center;gap:1px;
  background:#fff;border:1px solid var(--line-06);border-radius:var(--r-md);
  box-shadow:var(--shadow-pop);padding:3px;
}
#ctxBar[hidden]{display:none}
#ctxBar .tool-btn{width:28px;height:28px;border-radius:var(--r-sm)}
#ctxBar .tool-btn:disabled{color:var(--text-dis)}
#ctxBar i{width:1px;height:16px;background:rgba(0,0,0,.12);margin:0 3px;flex:none}

/* 帮助按钮：视口右下内缩 18px */
.help-btn{
  position:fixed;right:18px;bottom:18px;width:32px;height:32px;z-index:20;
  border-radius:50%;background:#fff;border:1px solid var(--line-06);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:center;color:var(--text-1);
}

/* 缩放菜单 */
.zoom-menu{
  position:fixed;z-index:30;background:#fff;border-radius:var(--r-sm);
  box-shadow:var(--shadow-pop);padding:4px;min-width:112px;
}
.zoom-menu button{
  display:flex;width:100%;height:30px;align-items:center;border-radius:4px;
  padding:0 12px;font-size:12px;font-weight:500;color:var(--text-1);
}
.zoom-menu button:hover{background:var(--fill)}
.zoom-menu i{display:block;height:1px;background:#EDEDED;margin:4px 6px}
.zoom-menu .chk{margin-left:auto;color:var(--brand);font-size:12px}
.zoom-menu .zinfo{padding:4px 10px 2px;color:var(--text-3);font-size:11px;line-height:16px}

/* 文件菜单（P1：打开/保存 .prototype.html） */
.file-menu{position:fixed;z-index:30;background:#fff;border-radius:var(--r-sm);box-shadow:var(--shadow-pop);padding:4px;min-width:196px}
.file-menu button{display:flex;width:100%;height:32px;align-items:center;border-radius:4px;padding:0 12px;font-size:12px;font-weight:500;color:var(--text-1)}
.file-menu button:hover{background:var(--fill)}
.file-menu button i{margin-left:auto;font-style:normal;font-size:11px;color:var(--text-3);padding-left:24px}
.file-menu hr{border:0;border-top:1px solid var(--line-06);margin:4px 8px}
/* 主菜单（分组导航 + 二级子面板） */
.file-menu.mmain{width:234px;padding:6px}
.file-menu.mmain .mback{gap:8px;margin-bottom:2px}
.file-menu .arr{margin-left:auto;color:var(--text-3);display:flex;align-items:center;flex:none}
.file-menu.mmain .mrow.on{background:var(--brand);color:#fff}
.file-menu.mmain .mrow.on:hover{background:var(--brand)}
.file-menu.mmain .mrow.on .arr{color:rgba(255,255,255,.75)}
.file-menu.mmain .msep{border:0;border-top:1px solid var(--line-06);margin:6px 8px}
.file-menu .kbds{margin-left:auto;display:flex;gap:4px;align-items:center}
.file-menu .kchip{font-size:11px;line-height:1;color:var(--text-2);background:var(--fill);border-radius:4px;padding:3px 5px;font-weight:400}
.file-menu .mrow.on .kchip{background:rgba(255,255,255,.22);color:#fff}
.file-menu .chk{margin-left:auto;color:var(--brand);font-size:12px;padding-left:12px}
.file-menu .mrow.on .chk{color:#fff}
.file-menu .mrow.dis{color:var(--text-dis);cursor:default}
/* 右键菜单（复用 file-menu 行样式） */
.file-menu.cmenu{min-width:206px;z-index:85}
/* P16：右键菜单分组标题 / 危险项（分区） */
.file-menu.cmenu .mhead{padding:6px 12px 2px;font-size:11px;line-height:16px;font-weight:600;color:var(--text-3);letter-spacing:.02em}
.file-menu.cmenu .mrow.danger{color:#F53F3F}
.file-menu.cmenu .mrow.danger:hover{background:rgba(245,63,63,.08)}
/* 左栏宽度拖拽（边缘拖拽调宽） */
.left{position:relative}
.vsplitter{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:6}
.vsplitter::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:transparent;transition:background .12s ease}
.vsplitter:hover::after,.vsplitter.drag::after{background:rgba(0,0,0,.12)}

/* ============ P21：隐藏 UI / 查找替换 ============ */
body.hide-ui .nav,body.hide-ui .left,body.hide-ui .right,
body.hide-ui .help-btn{display:none}
#findBar{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:34;
  display:flex;flex-direction:column;align-items:stretch;gap:4px;
  width:306px;max-width:calc(100% - 24px);
  background:#fff;border:1px solid var(--line-06);
  border-radius:8px;box-shadow:var(--shadow-pop);padding:6px 8px;
}
#findBar[hidden]{display:none}
#findBar .fr{display:flex;align-items:center;gap:6px}
#findBar input{flex:1;min-width:0;height:26px;border:0;outline:0;border-radius:5px;background:var(--fill);padding:0 8px;font-size:12px}
#findBar input:focus{background:#fff;box-shadow:inset 0 0 0 1px var(--brand)}
#findBar .fcount{font-size:11px;color:var(--text-3);min-width:42px;text-align:center;font-variant-numeric:tabular-nums;flex:none}
#findBar button{flex:none;white-space:nowrap;height:26px;padding:0 8px;border-radius:5px;font-size:12px;color:var(--text-1)}
#findBar button:hover{background:var(--hover)}
#findBar button:disabled{color:var(--text-dis);cursor:default}
#findBar button:disabled:hover{background:none}
#findBar .fclose{color:var(--text-2);padding:0 5px;font-size:14px;line-height:1}

/* ============ P2 演示模式 ============ */
body.demo-mode .nav,body.demo-mode .left,body.demo-mode .right,
body.demo-mode .help-btn{display:none}
/* P20：演示顶栏（返回 / 面包屑 / sitemap / 缩放 / 全屏 / 翻页） */
#demoTop{display:none;position:fixed;top:0;left:0;right:0;height:48px;z-index:42;
  background:rgba(255,255,255,.96);box-shadow:0 1px 0 rgba(0,0,0,.08);
  align-items:center;gap:8px;padding:0 12px;backdrop-filter:blur(10px)}
body.demo-mode #demoTop{display:flex}
#demoTop .dt-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
#demoTop .dt-crumb{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#demoTop .dt-sep{width:1px;height:18px;background:rgba(0,0,0,.1);flex:none}
.dbtn{width:30px;height:30px;border-radius:6px;color:var(--text-1);display:flex;align-items:center;justify-content:center;flex:none}
.dbtn:hover{background:rgba(0,0,0,.06)}
.dbtn.flip{transform:rotate(180deg)}
.dbtn.on{background:rgba(54,112,247,.12);color:var(--brand)}
.dbtn:disabled{color:var(--text-dis);background:none;cursor:default}
.dt-sitemap{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:600;max-width:280px}

.dt-sitemap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#demoTop .dt-right{display:flex;align-items:center;gap:2px;flex:1;justify-content:flex-end}
.dt-zoom{height:30px;min-width:52px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
#demoSitemap{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:43;

#demoSitemap .ds-page{padding:6px 10px 2px;font-size:10.5px;font-weight:700;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase}
#demoSitemap .ds-item{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap;text-align:left}
#demoSitemap .ds-item:hover{background:var(--fill)}
#demoSitemap .ds-item.on{color:var(--brand);font-weight:600}
/* 底部缩略图条 */
#demoThumbsBar{display:none;position:fixed;left:0;right:0;bottom:0;height:82px;z-index:41;
  background:rgba(255,255,255,.96);box-shadow:0 -1px 0 rgba(0,0,0,.08);align-items:center;gap:8px;padding:0 12px}
body.demo-mode #demoThumbsBar.open{display:flex}
#demoThumbsBar .dth-nav{width:26px;height:60px;border-radius:6px;color:var(--text-2);font-size:16px}
#demoThumbsBar .dth-nav:hover{background:rgba(0,0,0,.06)}
#demoThumbsBar .dth-strip{flex:1;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:6px 0}
.dth-item{flex:none;width:104px;height:58px;border-radius:6px;overflow:hidden;border:2px solid transparent;background:#E9EBEF;cursor:pointer;position:relative;padding:0}
.dth-item.on{border-color:var(--brand)}
.dth-item img{width:100%;height:100%;object-fit:contain;display:block}
.dth-item .n{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;line-height:14px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#demoPageIdx{
  display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:40;
  background:rgba(20,20,24,.62);color:#fff;border-radius:14px;
  padding:2px 14px;font-size:12px;white-space:nowrap;
}
body.demo-mode #demoPageIdx{display:block}
body.demo-mode.thumbs-open #demoPageIdx{bottom:98px}
#demoThumbsBar .dth-count{font-size:11px;font-weight:600;color:var(--text-3);font-variant-numeric:tabular-nums;flex:none;padding:0 2px;min-width:38px;text-align:center}
#demoTop .dt-share{height:30px;padding:0 12px;border-radius:6px;background:var(--brand);color:#fff;font-size:12px;font-weight:600;flex:none;margin:0 4px}
#demoTop .dt-share:hover{background:#2A5FE8}
#demoTop .dt-user{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:700;margin-left:2px}
#demoUserPop{position:fixed;top:52px;right:12px;z-index:43;width:240px;background:#fff;border:1px solid var(--line-06);border-radius:10px;box-shadow:var(--shadow-modal);padding:12px}
#demoUserPop .du-title{font-size:12px;font-weight:600;color:var(--text-strong)}
#demoUserPop .du-sub{font-size:11.5px;line-height:1.6;color:var(--text-3);margin:2px 0 10px}
#demoUserPop .du-login{width:100%;height:30px;border-radius:6px;background:var(--brand);color:#fff;font-size:12px;font-weight:600}
#demoUserPop .du-login:hover{background:#2A5FE8}

/* P21-C：统一导出对话框（预览 / 进度 / per-object / PDF） */
#exportDlg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center}
#exportDlg[hidden]{display:none}
.edlg-card{width:720px;max-width:calc(100vw - 48px);max-height:calc(100vh - 64px);background:#fff;border-radius:12px;box-shadow:var(--shadow-modal);display:flex;flex-direction:column;overflow:hidden}
.edlg-head{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line-06)}
.edlg-head b{font-size:13px;font-weight:600}
.edlg-head .edlg-count{font-size:11.5px;color:var(--text-3)}
.edlg-x{margin-left:auto;width:28px;height:28px;border-radius:6px;color:var(--text-2);font-size:16px}
.edlg-x:hover{background:var(--hover);color:var(--text-1)}
.edlg-body{flex:1;min-height:0;display:flex;gap:16px;padding:16px}
.edlg-prev{flex:1;min-width:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;align-content:start;background:#F7F8FA;border-radius:8px;padding:12px}
.edlg-cell{border:1px solid var(--line-06);border-radius:8px;background:#fff;padding:6px;display:flex;flex-direction:column;gap:5px}
.edlg-cell img{width:100%;height:78px;object-fit:contain;background:#F2F3F5;border-radius:4px;display:block}
.edlg-cell b{font-size:11px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edlg-cell span{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.edlg-empty{grid-column:1/-1;color:var(--text-3);font-size:12px;text-align:center;padding:36px 0}
.edlg-opts{width:248px;flex:none;display:flex;flex-direction:column;gap:10px}
.edlg-fld>b{display:block;font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.edlg-fld select,.edlg-fld input{width:100%;height:30px;border:0;border-radius:6px;background:var(--fill);padding:0 8px;font-size:12px;outline:none}
.edlg-fld select:focus,.edlg-fld input:focus{box-shadow:inset 0 0 0 1px var(--brand);background:#fff}
.edlg-fmt{display:flex;gap:3px;flex-wrap:wrap}
.edlg-fmt button{height:28px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--fill);color:var(--text-2)}
.edlg-fmt button:hover{background:var(--hover);color:var(--text-1)}
.edlg-fmt button.on{background:var(--brand);color:#fff}
.edlg-note{font-size:11px;line-height:1.55;color:var(--text-3);margin-top:auto;background:#F7F8FA;border-radius:6px;padding:8px}
.edlg-bar{height:2px;flex:none;background:var(--line-06);overflow:hidden}
.edlg-bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .12s linear}
.edlg-foot{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-top:1px solid var(--line-06)}
.edlg-foot span{font-size:11.5px;color:var(--text-3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edlg-foot .btn{height:30px;padding:0 14px;border-radius:6px;font-size:12px;font-weight:600}
.edlg-foot .btn-ghost{color:var(--text-2)}
.edlg-foot .btn-ghost:hover{background:var(--hover);color:var(--text-1)}
.edlg-foot .btn-primary{background:var(--brand);color:#fff}
.edlg-foot .btn-primary:hover{background:#2A5FE8}
.edlg-foot .btn-primary:disabled{background:rgba(54,112,247,.45);cursor:default}

/* ---- 右栏 252px ---- */
.right{
  width:252px;flex:none;background:var(--bg-panel);
  box-shadow:inset 1px 0 0 var(--line-soft);
  display:flex;flex-direction:column;min-height:0;
}
.panel{
  flex:1;min-height:0;overflow-y:auto;
  padding:0 6px 90px 12px;   /* 内容区宽 234，底部留 90 */
}
.pw{padding:12px 0;border-bottom:1px solid var(--line-04)}
.pw:last-child{border-bottom:0}
.sec-title{font-size:12px;font-weight:600;color:var(--text-1);line-height:30px}
.p-row{height:var(--row-h);display:flex;align-items:center;justify-content:space-between}
.p-row .label{font-size:12px;font-weight:600;color:var(--text-1)}
.p-row .ric{display:flex;align-items:center;gap:8px;color:var(--text-2)}
.p-row .ric .icon-btn{width:24px;height:24px}
.mini-btn{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.mini-btn:hover{color:var(--text-1);background:var(--hover)}
.mini-btn.wide{width:auto;padding:0 8px;white-space:nowrap;gap:5px}
/* P17：属性栏对齐/分布 */
.align-grid{display:flex;align-items:center;gap:4px}
.albtn{width:28px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.albtn:hover{background:var(--hover);color:var(--text-1)}
.albtn:disabled{color:var(--text-dis);cursor:default}
.albtn:disabled:hover{background:none;color:var(--text-dis)}
/* P17：四角独立圆角 */
.rad-row{display:flex;align-items:center;gap:6px}
.rad-row .fld{flex:1;min-width:0}
.rad-exp{width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:none}
.rad-exp:hover{background:var(--hover);color:var(--text-1)}
.rad-exp svg{transition:transform .12s ease}
.rad-exp.open svg{transform:rotate(180deg)}
.corner-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
/* P17：导出预设 */
.exp-list{display:flex;flex-direction:column;gap:6px}
.exp-row{display:flex;align-items:center;gap:6px}
.exp-row select{flex:1;min-width:0;height:26px}
.exp-row .mini-btn{width:24px;height:24px}
/* P18：多填充 / 描边位置 / 效果 */
.fill-list{display:flex;flex-direction:column;gap:6px}
.fill-row{display:flex;align-items:center;gap:6px;height:30px}
.fill-row input[type=color]{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.08);padding:0;background:none;cursor:pointer;flex:none}
.fill-row .fld{flex:1;min-width:0}
.fill-row .fld.op{flex:none;width:52px}
.fill-row .mini-btn{width:20px;height:20px}
/* P19：渐变/图片填充 + 效果列表 */
.fill-item{border:1px solid var(--line-06);border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:4px}
.fill-type{flex:1;width:auto;min-width:0;height:26px}
.fill-item .fld.op{width:50px}
.fill-thumb{width:26px;height:26px;border-radius:4px;object-fit:cover;background:#eee;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-3);border:1px solid rgba(0,0,0,.08)}
.fx-item{border:1px solid var(--line-06);border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:4px}
.fx-head{display:flex;align-items:center;gap:6px;height:26px}
.fx-name{font-size:11px;font-weight:600;color:var(--text-2);flex:1}
.fx-row{display:flex;align-items:center;gap:6px}

/* 封面：234×132 直角 */
.cover-thumb{
  width:234px;height:132px;position:relative;overflow:hidden;
  background:#F5F7FA;border-radius:0;
}
.cover-thumb i{position:absolute;display:block}
.cover-link{height:26px;display:flex;align-items:center;justify-content:flex-end}
.cover-link button{font-size:12px;font-weight:600;color:var(--text-2)}
.cover-link button:hover{color:var(--text-1)}

/* 标签色点：24 容器 + 14 内圆，节距 34.2 */
.dots{display:flex;flex-wrap:wrap;gap:10px;padding:3px 0}
.dot24{width:24px;height:24px;padding:5px;border-radius:50%;cursor:pointer}
.dot24:hover{background:var(--fill)}
.dot24 i{display:block;width:14px;height:14px;border-radius:50%}

/* P24：数值输入（图标区可拖拽，文本区只输入） */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{
  position:relative;height:28px;border-radius:4px;
  background:rgba(0,0,0,.04);transition:background .12s ease;
  display:flex;align-items:center;min-width:0;
}
.fld:hover{background:rgba(0,0,0,.06)}
.fld:focus-within{background:#fff;box-shadow:inset 0 0 0 1px var(--brand)}
.fld b{
  position:relative;left:auto;top:auto;flex:none;
  width:20px;height:20px;margin-left:2px;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:var(--text-3);
  cursor:ew-resize;user-select:none;-webkit-user-select:none;
}
.fld b:hover{background:rgba(0,0,0,.08);color:var(--text-1)}
.fld b.ni{cursor:default}
.fld b.ni:hover{background:none;color:var(--text-3)}
.fld input{
  flex:1;min-width:0;width:auto;height:26px;border:0;background:none;outline:0;
  text-align:left;font-size:12px;font-weight:500;padding:0 6px 0 2px;
  user-select:text;-webkit-user-select:text;
}
.fld.op b{width:16px;font-size:10px;margin-left:1px}
.fld .unit{flex:none;font-size:11px;color:var(--text-3);padding-right:6px}
/* P24：元素名称行（紧凑内联，不再占用独立输入框高度） */
.name-row{
  display:flex;align-items:center;gap:6px;
  padding:10px 0 8px;border-bottom:1px solid var(--line-04);
}
.name-row .nr-ic{
  width:24px;height:24px;border-radius:4px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);background:var(--fill);
}
.name-row input{
  flex:1;min-width:0;height:26px;border:0;background:none;outline:0;
  font-size:13px;font-weight:600;color:var(--text-strong);padding:0 6px;border-radius:4px;
}
.name-row input:hover{background:var(--fill)}
.name-row input:focus{background:#fff;box-shadow:inset 0 0 0 1px var(--brand)}
.name-row .nr-type{font-size:11px;color:var(--text-3);flex:none}
.crow{display:flex;align-items:center;gap:8px;height:30px}
.crow input[type=color]{
  width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.08);
  padding:0;background:none;cursor:pointer;flex:none;
}
.crow .fld{flex:1;min-width:0}
.crow .fld.op{flex:none;width:56px}
.hint-3{font-size:12px;color:var(--text-3);line-height:30px}
/* P22：无选中时的页面设置面板 */
.page-fld{margin-bottom:8px}
.page-fld:last-child{margin-bottom:0}
.page-fld label{display:block;font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.page-fld input[type=text]{width:100%;height:30px;border:0;border-radius:6px;background:var(--fill);padding:0 8px;font-size:12px;outline:none}
.page-fld input[type=text]:focus{box-shadow:inset 0 0 0 1px var(--brand);background:#fff}
.page-bg{display:flex;align-items:center;gap:8px}
.page-bg input[type=color]{width:30px;height:30px;border:0;border-radius:6px;background:transparent;padding:0;cursor:pointer}
.page-chk{display:flex;align-items:center;justify-content:space-between;height:30px;font-size:12px;color:var(--text-1)}
.page-chk input{accent-color:var(--brand)}
/* P23：空状态添加按钮（填充 / 描边 / 效果 / 导出预设） */
.empty-add{
  height:32px;border:1px dashed rgba(0,0,0,.16);border-radius:6px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:12px;font-weight:600;color:var(--text-2);cursor:pointer;
  transition:border-color .12s ease,color .12s ease,background .12s ease;
}
.empty-add:hover{border-color:rgba(54,112,247,.55);color:var(--brand);background:rgba(54,112,247,.04)}
/* P23：封面（可替换为画板渲染图 / 上传图） */
.cover-img{width:100%;height:100%;display:block;object-fit:cover}
.cover-actions{display:flex;gap:6px;margin-top:8px}
.cover-actions .mini-btn{flex:1;height:28px;font-size:11px;font-weight:600;background:var(--fill);border-radius:6px}
.cover-actions .mini-btn:hover{background:var(--hover)}
/* P25：封面画板选择弹窗 */
#coverDlg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center}
#coverDlg[hidden]{display:none}
.cvd-card{width:588px;max-width:calc(100vw - 48px);max-height:calc(100vh - 64px);background:#fff;border-radius:12px;box-shadow:var(--shadow-modal);display:flex;flex-direction:column;overflow:hidden}
.cvd-body{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;padding:16px;align-content:start;background:#F7F8FA}
.cvd-item{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line-06);border-radius:8px;background:#fff;cursor:pointer;text-align:left;transition:border-color .12s ease,box-shadow .12s ease}
.cvd-item:hover{border-color:rgba(54,112,247,.55);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cvd-item img{width:100%;height:104px;object-fit:contain;background:#F2F3F5;border-radius:5px;display:block}
.cvd-item b{font-size:11.5px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cvd-item span{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.cvd-empty{grid-column:1/-1;padding:48px 0;text-align:center;font-size:12px;color:var(--text-3)}
/* P23：顶栏保存按钮间距 */
#btnSave{margin-left:8px}
#btnSaveAs{margin-left:2px}
/* P23：原型交互卡片（分段式表单） */
.proto-card{border:1px solid var(--line-06);border-radius:6px;padding:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.proto-card .pc-head{display:flex;align-items:center;gap:6px}
.proto-card .pc-head b{flex:1;font-size:11px;font-weight:600;color:var(--text-2)}
.proto-lbl{display:block;font-size:11px;font-weight:600;color:var(--text-3);margin-bottom:3px}

/* 标注代码块 */
.code-box{
  background:var(--fill);border-radius:var(--r-sm);padding:8px 10px;
  font-family:Consolas,Menlo,monospace;font-size:11px;line-height:1.7;
  color:var(--text-1);white-space:pre-wrap;word-break:break-all;
  user-select:text;-webkit-user-select:text;
}
select.fld-sel{
  width:100%;height:30px;border:0;outline:0;border-radius:var(--r-sm);
  background:var(--fill);font-size:12px;font-weight:500;padding:0 8px;cursor:pointer;
}
select.fld-sel:focus{background:#fff;box-shadow:inset 0 0 0 1px var(--brand)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(8px);
  background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-modal);
  padding:10px 18px;font-size:12px;color:var(--text-1);z-index:99;
  opacity:0;transition:.2s ease;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 滚动条 8px */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   P29 视觉升级 ·「精密工作室」
   仅调整视觉层：中性微冷底色、钴蓝强调、细线分层、双层柔和投影、
   统一 150ms 缓动与焦点环；不改变任何布局尺寸与交互逻辑。
   ============================================================ */
:root{
  --brand-2:#5B84FF;
  --bg-panel:#FBFBFC;
  --bg-canvas:#EDEEF1;
  --text-1:rgba(20,22,27,.86);
  --text-strong:rgba(20,22,27,.94);
  --text-2:rgba(20,22,27,.52);
  --text-3:rgba(20,22,27,.34);
  --text-dis:rgba(20,22,27,.24);
  --fill:rgba(20,22,27,.045);
  --hover:rgba(20,22,27,.065);
  --line-04:rgba(20,22,27,.045);
  --line-06:rgba(20,22,27,.085);
  --line-soft:#E9EAEE;
  --shadow-pop:0 8px 24px rgba(16,18,24,.10),0 1px 2px rgba(16,18,24,.06);
  --shadow-modal:0 28px 70px rgba(16,18,24,.22),0 4px 14px rgba(16,18,24,.08);
  --ease:cubic-bezier(.2,.8,.2,1);
}
body{
  font-family:"Segoe UI Variable Text","Segoe UI",-apple-system,"SF Pro SC","SF Pro Text",
    "PingFang SC","MiSans","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:.004em;
}

   P31 · 组件库（资源面板卡片 / 实例徽标 / 组件区块）
   ============================================================ */
.comp-lib{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.comp-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:7px 8px;border-radius:5px;border:1px solid var(--line-06);
  background:transparent;text-align:left;min-width:0;transition:border-color .12s var(--ease),background .12s var(--ease)}
.comp-card:hover{border-color:var(--brand);background:var(--fill)}
.comp-card .cc-top{display:flex;align-items:center;gap:5px;color:var(--brand);min-width:0;width:100%}
.comp-card .cc-top span{color:var(--text-1);font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-card .cc-size{font-size:10px;color:var(--text-3);font-variant-numeric:tabular-nums;line-height:1.3}
.comp-meta{display:flex;align-items:center;gap:6px;color:var(--brand);font-size:11.5px;font-weight:600;margin-bottom:8px}
.comp-meta .cm-name{color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-meta .cm-tag{margin-left:auto;font-size:10px;font-weight:500;color:var(--text-3);
  border:1px solid var(--line-06);border-radius:3px;padding:1px 5px;white-space:nowrap}
.comp-acts{display:flex;flex-wrap:wrap;gap:6px}
.comp-acts .mini-btn{width:auto;height:26px;padding:0 9px;gap:5px;font-size:11px;font-weight:500;
  border:1px solid var(--line-06);color:var(--text-2)}
.comp-acts .mini-btn:hover{border-color:var(--brand);color:var(--brand);background:none}
.comp-acts .mini-btn.wide{width:100%}
/* P32：变体 chips / 覆盖计数 */
.var-chips{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.vchip{height:22px;padding:0 8px;border-radius:4px;font-size:11px;font-weight:500;
  color:var(--text-2);border:1px solid var(--line-06);background:none;
  transition:border-color .12s var(--ease),color .12s var(--ease)}
.vchip:hover{border-color:var(--brand);color:var(--brand)}
.vchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ov-line{display:flex;align-items:center;gap:6px;margin:0 0 8px;padding:5px 7px;
  border-radius:5px;background:var(--fill);color:var(--text-2);font-size:11px}
.ov-line .mini-btn{margin-left:auto;width:auto;height:22px;padding:0 7px;font-size:11px}
.lrow .cmark{display:flex;align-items:center;color:var(--brand);margin-left:2px;flex:none}

/* ============================================================
   P31 · 深色主题（叠加于 P30 瑞士中性；钴蓝强调不变）

<div class="app">

const svgIconOf=n=>{
  if(!n)return null;
  if(Array.isArray(n.paths)&&n.paths.length)return{v:+n.ibv||24,p:n.paths,eo:n.eo||[]};
  const e=n.icon?SVG_ICONS[n.icon]:null;
  return e?{v:e.v,p:e.p,eo:e.eo||[]}:null;
};
/* 尺寸自适应描边：小尺寸加大 viewBox 线宽，保证 9/12/14 与 16/20 的光学重量一致 */
const icon=(n,s=16)=>{
  const sw=s>=18?1.25:s>=15?1.5:s>=13?1.6:s>=10?1.75:1.9;
  return `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
};

/* ---------------- P31 主题（浅色 / 深色） ----------------
   深色只换 UI 与画布底色，画板内容（白底/业务色）保持原样；
   文档内嵌 theme 随 __doc 保存，localStorage 仅作跨文件默认值。 */
const THEME_KEY='p31.theme';
const CANVAS_SKIN={
  light:{page:'#EFEFEF',ruler:'#FCFCFD',rulerLine:'#D5D7DD',rulerText:'#A3A6AE',
    rulerSep:'#E9EAEE',rulerCorner:'#F4F5F8',label:'rgba(0,0,0,0.5)',
    labelBg:'rgba(0,0,0,0.05)',abShadow:'rgba(0,0,0,0.12)'},
  dark:{page:'#111214',ruler:'#1B1C1F',rulerLine:'#3A3C42',rulerText:'#8D929A',
    rulerSep:'#2A2C31',rulerCorner:'#212226',label:'rgba(255,255,255,0.55)',
    labelBg:'rgba(255,255,255,0.08)',abShadow:'rgba(0,0,0,0.5)'}
};
let uiTheme='light', skin=CANVAS_SKIN.light, docTheme='light';
function themeFromStore(){
  try{return localStorage.getItem(THEME_KEY)==='dark'?'dark':'light'}catch(e){return 'light'}
}
function applyTheme(t,opts){
  opts=opts||{};
  uiTheme=t==='dark'?'dark':'light';
  skin=CANVAS_SKIN[uiTheme];
  document.body.dataset.theme=uiTheme;
  try{localStorage.setItem(THEME_KEY,uiTheme)}catch(e){}
  docTheme=uiTheme;
  const tb=document.querySelector('#btnTheme');
  if(tb){
    tb.innerHTML=icon(uiTheme==='dark'?'sun':'moon',16);
    tb.title=uiTheme==='dark'?'切换浅色主题（Shift+D）':'切换深色主题（Shift+D）';
  }
  drawSoon();
  if(document.querySelector('#panel')&&typeof renderPanel==='function')renderPanel();
  if(opts.toast)toast(uiTheme==='dark'?'已切换深色主题':'已切换浅色主题');
}
function toggleTheme(){applyTheme(uiTheme==='dark'?'light':'dark',{toast:true})}
const DEFAULT_PAGE_BG='#EFEFEF';
// 页面背景：深色下仅当页面仍用默认浅灰时替换为石墨底；自定义背景色保持用户设置
function pageCanvasBg(pg){
  const bg=pg&&pg.bg;
  if(uiTheme==='dark'&&(!bg||String(bg).toUpperCase()===DEFAULT_PAGE_BG))return skin.page;
  return bg||DEFAULT_PAGE_BG;
}

/* ---------------- 文档容器（P1：文档 JSON 内嵌于 <script id="__doc">） ---------------- */
const DOC_VER=1;
let pages=[], tree=[];
function defaultDoc(){
  return {version:DOC_VER,
    pages:[{name:'大屏首页',artboards:[makePage1()]},{name:'登录页',artboards:[makePage2()]}],
    tree:[{label:'大屏首页',page:0},{label:'草稿',open:true,children:[{label:'登录页',page:1}]}]};
}
const curPage=()=>pages[state.page];
const isGroup=n=>!!n&&n.type==='group';
/* P14：递归展开组，所有节点（画板/组/叶子）都进入扁平索引 */
const allNodes=()=>{
  const out=[];
  const walk=list=>{for(const n of list||[]){out.push(n);if(n.children)walk(n.children)}};
  for(const ab of curPage().artboards){out.push(ab);walk(ab.children);}
  walk(curPage().loose); // P26：画板外自由图层
  return out;
};
const nodeById=id=>allNodes().find(n=>n.id===id);
const parentOf=n=>n.type==='artboard'?null:n.parent;
/* P14：所在画板（组不参与坐标换算，叶子/组的 x/y 一律相对画板） */
function abOf(n){
  let p=n&&n.parent;
  while(p&&p.type!=='artboard')p=p.parent;
  return p||null;
}
function worldRect(n){
  if(n.type==='artboard')return{x:n.x,y:n.y,w:n.w,h:n.h};
  const p=abOf(n);return p?{x:p.x+n.x,y:p.y+n.y,w:n.w,h:n.h}:{x:n.x,y:n.y,w:n.w,h:n.h};
}
/* P14：组包围盒 = 后代叶子（及子组）包围盒并集，坐标存画板局部 */
function syncGroupRect(g){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9,any=false;
  for(const c of g.children||[]){
    const r=worldRect(c);
    x1=Math.min(x1,r.x);y1=Math.min(y1,r.y);x2=Math.max(x2,r.x+r.w);y2=Math.max(y2,r.y+r.h);any=true;
  }
  if(!any)return;
  const ab=abOf(g),ox=ab?ab.x:0,oy=ab?ab.y:0;
  g.x=x1-ox;g.y=y1-oy;g.w=x2-x1;g.h=y2-y1;
}
function syncAllGroups(){
  const walk=list=>{for(const n of list||[]){(n.type==='group'||n.type==='bool')&&(walk(n.children),(!isInstanceContainer(n))&&syncGroupRect(n))}};
  for(const ab of curPage().artboards)walk(ab.children);
  walk(curPage().loose); // P26
}
const isAncestor=(a,n)=>{let p=n&&n.parent;while(p){if(p===a)return true;p=p.type==='artboard'?null:p.parent}return false};
const descendantCount=n=>n.children?n.children.reduce((s,c)=>s+1+descendantCount(c),0):0;
/* P32：组件实例容器的几何由母版决定，不参与组包围盒重算 */
function isInstanceContainer(n){return !!(n&&n.type==='group'&&n.cont&&n.inst)}
function flattenLeaves(list,out){
  out=out||[];
  for(const n of list||[]){
    if(n.type==='group'||n.type==='bool')flattenLeaves(n.children,out);else out.push(n);
  }
  return out;
}
/* 平移节点：组递归平移全部后代（坐标均为画板局部，增量一致） */
function translateNode(n,dx,dy){
  n.x+=dx;n.y+=dy;
  if(n.type==='group'||n.type==='bool')for(const c of n.children||[])translateNode(c,dx,dy);
}
/* 选中集合去掉"祖先也被选中"的节点，避免重复变换 */
function effectiveSel(){
  return dedupeRoots(selNodes());
}
/* P12-A：旋转角（度）与带旋转的命中测试（反旋转到局部坐标系再判 AABB） */
const DEG=Math.PI/180;
function hitNode(n,wx,wy){
  const r=worldRect(n),rot=n.rot||0;
  if(rot){
    const a=-rot*DEG,cx=r.x+r.w/2,cy=r.y+r.h/2,dx=wx-cx,dy=wy-cy;
    const ca=Math.cos(a),sa=Math.sin(a);
    wx=cx+dx*ca-dy*sa;wy=cy+dx*sa+dy*ca;
  }
  /* P22：直线/箭头按线段距离命中（细线在低缩放下也能点中、可拖动端点） */
  if(n.type==='line'||n.type==='arrow'){
    const slash=n.dir==='/';
    const x1=r.x,y1=slash?r.y+r.h:r.y,x2=r.x+r.w,y2=slash?r.y:r.y+r.h;
    const dx=x2-x1,dy=y2-y1,L2=dx*dx+dy*dy;
    let t=L2?((wx-x1)*dx+(wy-y1)*dy)/L2:0;t=Math.max(0,Math.min(1,t));
    const px=x1+dx*t,py=y1+dy*t;
    return Math.hypot(wx-px,wy-py)<=Math.max(6/cam.z,(n.strokeW||1)/2+2);
  }
  if(!rot)return wx>=r.x&&wx<=r.x+r.w&&wy>=r.y&&wy<=r.y+r.h;
  return Math.abs(wx-(r.x+r.w/2))<=r.w/2&&Math.abs(wy-(r.y+r.h/2))<=r.h/2;
}

function nextName(type){
  let i=1;const set=new Set(allNodes().map(n=>n.name));
  while(set.has(CN[type]+' '+i))i++;
  return CN[type]+' '+i;
}

const pageComments=()=>{const pg=curPage();if(!Array.isArray(pg.comments))pg.comments=[];return pg.comments};

  {const q=unrotPt(sx,sy);sx=q.x;sy=q.y} // P12-D

    const p=w2s(comments[i].x,comments[i].y);

/* P21：查找 / 替换浮层（Edit > Find） */
const findBar=$('#findBar'),findQ=$('#findQ'),findR=$('#findR'),findCount=$('#findCount');
let findHits=[],findIdx=-1;
function findMatches(q){
  q=String(q||'').trim().toLowerCase();
  if(!q)return[];
  return allNodes().filter(n=>String(n.name||'').toLowerCase().includes(q)||(n.type==='text'&&String(n.text||'').toLowerCase().includes(q)));

function findUpdateUI(){

function refreshFind(selectFirst){
  findHits=findMatches(findQ.value);
  findIdx=findHits.length?(selectFirst?0:Math.min(findIdx<0?0:findIdx,findHits.length-1)):-1;
  findUpdateUI();
  if(selectFirst&&findHits.length){state.sel=new Set([findHits[0].id]);syncSelection()}
}
function findStep(d){
  if(!findHits.length){refreshFind(false);if(!findHits.length)return}
  findIdx=(findIdx+d+findHits.length)%findHits.length;
  findUpdateUI();
  const n=findHits[findIdx];
  state.sel=new Set([n.id]);syncSelection();
}
function openFind(withReplace){
  findBar.hidden=false;
  refreshFind(true);
  (withReplace?findR:findQ).focus();
  if(withReplace)findR.select();
}
function closeFind(){findBar.hidden=true;findHits=[];findIdx=-1;findUpdateUI()}
function replaceAll(){
  const q=findQ.value.trim();if(!q)return;
  const rep=findR.value,esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(esc,'gi'),has=s=>new RegExp(esc,'i').test(String(s==null?'':s));
  let count=0;
  for(const n of allNodes()){
    if(has(n.name)){n.name=String(n.name).replace(re,rep);count++}
    if(n.type==='text'&&has(n.text)){
      n.text=String(n.text).replace(re,rep);
      const m=measureText(n);if(!n.align){n.w=m.w;n.h=m.h}
      count++;
    }
  }
  if(count){afterChange();renderPanel();toast('已替换 '+count+' 个图层')}
  else toast('没有匹配项');
  refreshFind(false);
}

function renamePageRow(item,row){
  const nm=row.querySelector('.nm');
  const inp=document.createElement('input');
  inp.value=item.page!==undefined?pages[item.page].name:item.label;
  inp.style.cssText='flex:1;min-width:0;height:22px;border:1px solid var(--brand);border-radius:4px;padding:0 4px;outline:0;font:inherit';
  nm.replaceWith(inp);inp.focus();inp.select();
  let done=false;
  const commit=()=>{
    if(done)return;done=true;
    const v=inp.value.trim();
    if(v){ if(item.page!==undefined)pages[item.page].name=v; item.label=v; snapshot() }
    renderTree();
  };
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')commit();else if(e.key==='Escape'){done=true;renderTree()}});
  inp.addEventListener('blur',commit);
}
function deletePage(i){
  if(pages.length<=1){toast('至少保留一个页面');return}
  pages.splice(i,1);
  const fix=arr=>{for(let k=arr.length-1;k>=0;k--){const t=arr[k];
    if(t.children){fix(t.children);if(!t.children.length)arr.splice(k,1)}
    else if(t.page===i)arr.splice(k,1);
    else if(t.page>i)t.page--;
  }};
  fix(tree);
  if(state.page===i){closeCommentBox(true);state.page=Math.min(i,pages.length-1);state.sel.clear();hideTextEditor();fitView(true)}
  else if(state.page>i)state.page--;
  renderTree();renderLayers();renderPanel();snapshot();
}
/* P21：复制页面（深拷贝画板树，插入到源页之后并切换） */
function duplicatePage(i){
  const src=pages[i];if(!src)return;
  const copy={name:src.name+' 副本',artboards:src.artboards.map(ab=>cloneNodeTree(ab,null)),
    comments:JSON.parse(JSON.stringify(src.comments||[]))}; // P27：复制页面时一并复制评论
  pages.splice(i+1,0,copy);
  const bump=arr=>{for(const t of arr){if(t.children)bump(t.children);else if(t.page!==undefined&&t.page>i)t.page++}};
  bump(tree);
  const insert=arr=>{
    for(let k=0;k<arr.length;k++){
      const t=arr[k];
      if(t.children){if(insert(t.children))return true}
      else if(t.page===i){arr.splice(k+1,0,{label:copy.name,page:i+1});return true}
    }
    return false;
  };
  if(!insert(tree))tree.push({label:copy.name,page:i+1});
  if(state.page>i)state.page++;
  snapshot();
  switchPage(i+1);
  toast('已复制页面');
}

/* ---------------- 图层面板 ---------------- */
let layerOpen=new Set(),layerKnown=new Set(); // 展开的画板/组 / 已见过的容器
function ensureOpen(){
  for(const ab of curPage().artboards){
    if(layerKnown.has(ab.id))continue;
    layerKnown.add(ab.id);layerOpen.add(ab.id);
  }
}
function subtreeMatch(n,kw){
  if(!kw)return true;
  if(String(n.name||'').toLowerCase().includes(kw))return true;
  return (n.children||[]).some(c=>subtreeMatch(c,kw));
}
let layerAnchor=null;
function renderLayers(){
  ensureOpen();
  const el=$('#layerList');el.innerHTML='';
  const kw=($('#layerSearch').value||'').trim().toLowerCase();
  // P14：组递归渲染（折叠 / 缩进 / 组图标）
  const walk=(list,depth)=>{
    for(const n of [...(list||[])].reverse()){
      if(!subtreeMatch(n,kw))continue;
      if(n.type==='group'||n.type==='bool'){
        const open=layerOpen.has(n.id)||!!kw; // 搜索时自动展开以便看到命中子层

function layerRow(n,depth,hasKids,open,onToggle){

/* ---------------- P12-B：图层拖拽排序 / 换画板（指针事件 + 三段落点） ---------------- */
let layerDrag=null, suppressLayerClick=false;
function clearDropMarks(){$$('#layerList .lrow').forEach(r=>r.classList.remove('drop-before','drop-after','drop-inside'))}
window.addEventListener('pointermove',e=>{
  if(!layerDrag)return;
  if(!layerDrag.moved){
    if(Math.abs(e.clientX-layerDrag.x)<4&&Math.abs(e.clientY-layerDrag.y)<4)return;
    layerDrag.moved=true;
    document.body.classList.add('lay-drag');
    layerDrag.row.classList.add('dragging');
  }
  const row=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.lrow');
  clearDropMarks();
  layerDrag.zone=null;
  if(!row||row===layerDrag.row)return;
  const t=nodeById(row.dataset.nid);if(!t)return;
  const r=row.getBoundingClientRect(),ratio=(e.clientY-r.top)/r.height;
  // 画板整行都是"拖入"；组中间区域=拖入组，上下 1/4=插入；普通图层按上下半区分（dnd-over）
  const zone=t.type==='artboard'?'inside':
    t.type==='group'?(ratio>.25&&ratio<.75?'inside':(ratio<=.25?'before':'after')):
    (ratio<.5?'before':'after');
  layerDrag.zone={id:t.id,zone};
  row.classList.add('drop-'+zone);
});
function endLayerDrag(drop){
  if(!layerDrag)return;
  const d=layerDrag;layerDrag=null;
  d.row.classList.remove('dragging');
  document.body.classList.remove('lay-drag');
  clearDropMarks();
  if(!d.moved)return;
  suppressLayerClick=true;
  setTimeout(()=>{suppressLayerClick=false},0); // click 在 pointerup 之后同步触发，延后一拍复位

/* 列表是倒序展示：列表"上方"对应 children 更大索引（更高层级） */
function moveLayerTo(id,tz){
  const m=nodeById(id),t=nodeById(tz.id);
  if(!m||!t||m.type==='artboard'||t.id===m.id)return;
  if(isAncestor(m,t))return; // P14：不能拖进自己的后代（避免环）
  const abOld=abOf(m);if(!abOld)return;
  const w=worldRect(m);
  const targetParent=t.type==='artboard'?t:(t.type==='group'&&tz.zone==='inside')?t:t.parent;
  const fromList=m.parent.children,fi=fromList.indexOf(m);if(fi<0)return;
  fromList.splice(fi,1);
  m.parent=targetParent;
  let idx;
  if(t.type==='artboard'||(t.type==='group'&&tz.zone==='inside'))idx=targetParent.children.length; // 拖入容器 = 置顶
  else{const ti=targetParent.children.indexOf(t);idx=tz.zone==='before'?ti+1:ti;if(idx<0)idx=targetParent.children.length}
  targetParent.children.splice(idx,0,m);
  const abNew=abOf(m)||abOld;
  translateNode(m,(w.x-abNew.x)-m.x,(w.y-abNew.y)-m.y); // 跨画板时保持世界位置（组递归）
  if(targetParent.type==='group')layerOpen.add(targetParent.id);
  syncAllGroups();snapshot();renderLayers();renderPanel();drawSoon();
}

/* ---------------- 撤销 / 重做（快照式历史） ---------------- */
const history={stack:[],idx:-1,lock:false};
function snapshot(){
  if(history.lock)return;
  syncAllGroups(); // P14：序列化前同步组包围盒
  syncInstances(); // P5：母版变更时同步实例（先于快照序列化）
  // parent 指回画板构成循环引用，序列化时跳过（restore 时重建）
  const data=JSON.stringify(pages,(k,v)=>k==='parent'?undefined:v);
  persistDoc();
  if(history.stack[history.idx]===data)return;
  history.stack=history.stack.slice(0,history.idx+1);
  history.stack.push(data);
  if(history.stack.length>60)history.stack.shift();
  history.idx=history.stack.length-1;
  refreshHistoryUI();
  scheduleAutosave(); // P33：内容变更后排队自动保存
}
function refreshHistoryUI(){
  const u=$('#btnUndo'),r=$('#btnRedo');
  if(u)u.disabled=history.idx<=0;
  if(r)r.disabled=history.idx>=history.stack.length-1;
}
function restore(i){
  history.lock=true;
  const restored=JSON.parse(history.stack[i]);
  pages.length=0;restored.forEach(p=>pages.push(p));
  // P14：递归重建 parent 引用（组嵌套）
  const fix=(list,parent)=>{for(const n of list||[]){n.parent=parent;if(n.children)fix(n.children,n)}};
  pages.forEach(p=>p.artboards.forEach(ab=>fix(ab.children,ab)));
  syncInstances(); // P5：撤销/重做后按新母版状态重建实例
  history.idx=i;
  refreshHistoryUI();
  if(state.page>=pages.length)state.page=0;
  cmtOpen=null;$('#commentBox').style.display='none'; // P27：撤销后关闭旧评论气泡，避免指向失效对象
  state.sel=new Set([...state.sel].filter(id=>nodeById(id)));
  state.enterGroup=(state.enterGroup||[]).filter(id=>!!nodeById(id));
  hideTextEditor(true);
  renderTree();renderLayers();renderPanel();drawSoon();
  persistDoc();
  scheduleAutosave(); // P33：撤销/重做同样触发自动保存
  history.lock=false;
}
function undo(){if(history.idx>0)restore(history.idx-1)}
function redo(){if(history.idx<history.stack.length-1)restore(history.idx+1)}

/* ---------------- P33：自动保存 + 刷新前二次确认 ---------------- */
const AUTOSAVE_KEY='p33.autosave:'+(location.protocol==='file:'?location.pathname:'doc');
const AUTOSAVE_DELAY=800; // 停止操作 0.8s 后落盘，避免高频写入
let autosaveTimer=null,autoReady=false,autoSavedAt=0,docDirty=false,diskSig=0;
/* 当前磁盘内嵌文档的指纹：若文件后来被外部保存过，则丢弃旧自动存档，避免覆盖新内容 */
function docSigOf(txt){let h=0;txt=txt||'';for(let i=0;i<txt.length;i++)h=(h*31+txt.charCodeAt(i))>>>0;return h}
function updateAutoTip(msg,err){
  const el=$('#autoTip');if(!el)return;
  if(msg)el.textContent=msg;
  else if(autoSavedAt){const d=new Date(autoSavedAt);el.textContent='已自动保存 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  else el.textContent='';
  el.classList.toggle('err',!!err);
}
function writeAutosave(){
  if(!docEl||!docEl.textContent.trim())return;
  try{
    localStorage.setItem(AUTOSAVE_KEY,JSON.stringify({t:Date.now(),page:state.page,title:docTitle,sig:diskSig,doc:docEl.textContent}));
    autoSavedAt=Date.now();
    updateAutoTip('');
  }catch(e){updateAutoTip('自动保存失败（本地存储空间不足）',true)}
}
function scheduleAutosave(){
  if(!autoReady)return; // 启动阶段的基线快照不触发自动保存
  docDirty=true;
  clearTimeout(autosaveTimer);
  autosaveTimer=setTimeout(writeAutosave,AUTOSAVE_DELAY);
}
function markSaved(fileUpdated){
  docDirty=false;
  clearTimeout(autosaveTimer);autosaveTimer=null;
  // 只有真正写回同一个文件时，磁盘内嵌文档才与当前内容一致，指纹才需要更新；
  // “下载副本”不影响原文件，保留旧指纹以便刷新时仍能恢复未写盘的编辑。
  if(fileUpdated)diskSig=docSigOf(docEl.textContent.trim());
  writeAutosave(); // 手动保存后同步更新自动存档，刷新时恢复最新内容
}
function clearAutosave(){
  try{localStorage.removeItem(AUTOSAVE_KEY)}catch(e){}
  clearTimeout(autosaveTimer);autosaveTimer=null;
  autoSavedAt=0;docDirty=false;updateAutoTip('');
}
function readAutosave(){
  try{
    const raw=localStorage.getItem(AUTOSAVE_KEY);
    if(!raw)return null;
    const o=JSON.parse(raw);
    if(!o||!o.doc)return null;
    const doc=JSON.parse(o.doc);
    if(!Array.isArray(doc.pages)||!doc.pages.length)return null;
    if(doc.version!==DOC_VER)return null; // 旧版本格式不恢复，避免脏数据
    if(diskSig&&Number(o.sig)!==diskSig)return null; // 磁盘文件已被更新，旧存档作废
    return {doc,page:Number(o.page)||0,t:Number(o.t)||0}; // 注意：不能用 |0，时间戳会溢出成负数
  }catch(e){return null}
}

  if(!docDirty||!autoReady)return;

        `<div class="grid2" style="margin-top:8px">${fld('letterSpacing',icon('ls',14),nodes[0].letterSpacing||0,false,lsMixed?'Mixed':'')}<select class="fld-sel" data-k="textCase"><option value="none">大小写</option><option value="upper">全大写</option><option value="lower">全小写</option><option value="title">首字母大写</option></select></div>`):'')+

  /* P18：填充层（文本保持单色）+ 效果（投影/图层模糊） */
  const fillHtml=isText?sec('填充',colorRow('fill',fillVal,1)+opRow):(noFill?'':fillSectionHtml(n,opRow));
  const effectHtml=sec('效果',effectBody(n));
  p.innerHTML=
    nameRow(n)+
    compSectionHtml(n)+
    alignPanelHtml()+
    sec('位置尺寸',`<div class="grid2">${fld('x','X',Math.round(worldRect(n).x))}${fld('y','Y',Math.round(worldRect(n).y))}${fld('w','W',Math.round(n.w))}${fld('h','H',Math.round(n.h))}</div>`+

  bindPanelInputs(n);bindFillInputs(n);bindStrokeInputs(n);bindEffectInputs(n);

/* P17：属性面板委托（导出预设/对齐分布/圆角展开）——面板重建，委托挂 document 稳定 */
document.addEventListener('click',e=>{
  const run=e.target.closest('#panel .exp-run');
  if(run){const p=expPresets[+run.dataset.ei];if(p)openExportDlg({scale:p.s,fmt:p.f,scope:state.sel.size?'selection':'board'});return}
  const del=e.target.closest('#panel .exp-del');
  if(del){expPresets.splice(+del.dataset.ei,1);renderPanel();return}
  if(e.target.closest('#expAdd')){expPresets.push({s:1,f:'png'});renderPanel();return}
  const al=e.target.closest('#panel [data-al]');
  if(al){if(!al.disabled)alignSel(al.dataset.al);return}
  if(e.target.closest('#fxAdd')){
    const n=single();if(!n)return;
    ensureEffects(n).push(defaultEffect('drop'));syncLegacyEffects(n);snapshot();renderPanel();drawSoon();return;
  }
  if(e.target.closest('#radExp')){rOpen=!rOpen;renderPanel();return}
  /* P31：组件库 / 组件区块 */
  const ci=e.target.closest('#panel [data-comp-insert]');
  if(ci){placeComp(ci.dataset.compInsert);return}
  const cc=e.target.closest('#panel [data-comp-create]');
  if(cc){createComponent(single());return}
  const cg=e.target.closest('#panel [data-comp-go]');
  if(cg){gotoMaster(cg.dataset.compGo);return}
  const cu=e.target.closest('#panel [data-comp-update]');
  if(cu){updateInstances(cu.dataset.compUpdate);return}
  const cd=e.target.closest('#panel [data-comp-detach]');
  if(cd){detachInstance(single());return}
  const bs=e.target.closest('#panel [data-bool-set]');
  if(bs){const n=single();if(n&&n.type==='bool'){n.op=bs.dataset.boolSet;n.name=BOOL_NAMES[n.op]||n.name;snapshot();renderPanel();drawSoon()}return}
  const cv=e.target.closest('#panel [data-comp-variant]');
  if(cv){switchVariant(instOwner(single()),cv.dataset.compVariant);return}
  const cr=e.target.closest('#panel [data-comp-reset]');
  if(cr){resetOverrides(instOwner(single()));return}
  const cn=e.target.closest('#panel [data-comp-newvariant]');
  if(cn){createVariant(cn.dataset.compNewvariant);return}
  const cs=e.target.closest('#panel [data-comp-selectmaster]');
  if(cs){gotoMaster(cs.dataset.compSelectmaster);return}
});

function bindPageInputs(){
  const nm=$('#pageName');
  nm&&nm.addEventListener('change',()=>{
    const pg=curPage();const v=nm.value.trim()||pg.name;pg.name=v;
    (function walk(list){list.forEach(t=>{if(t.page===state.page)t.label=v;if(t.children)walk(t.children)})})(tree);
    renderTree();snapshot();
  });
  const bg=$('#pageBg'),hex=$('#pageBgHex');
  const setBg=v=>{const pg=curPage();pg.bg=v;if(bg)bg.value=v;if(hex)hex.value=v;drawSoon()};
  bg&&bg.addEventListener('input',()=>setBg(bg.value));
  bg&&bg.addEventListener('change',()=>snapshot());
  hex&&hex.addEventListener('change',()=>{
    let v=hex.value.trim();if(!/^#[0-9a-fA-F]{6}$/.test(v))v='#EFEFEF';
    setBg(v);snapshot();
  });
  const g=$('#pageGrid');g&&g.addEventListener('change',e=>{
    state.pixelGrid=e.target.checked;
    if(!state.pixelGrid)state.snapGrid=false; // 关网格 = 同时关吸附
    drawSoon();renderPanel();snapshot();
  });
  const ns=$('#pageSnap');ns&&ns.addEventListener('change',e=>{state.snapGrid=e.target.checked;drawSoon();snapshot()});
  const gd=$('#pageGuides');gd&&gd.addEventListener('change',e=>{state.showGuides=e.target.checked;drawSoon();snapshot()});
  const ex=$('#pageExport');ex&&ex.addEventListener('click',()=>openExportDlg({scope:'all',scale:1}));
  /* P25：封面替换——点击按钮弹窗选择画板，选择后立即生成封面 */
  const set=$('#coverSet');
  set&&set.addEventListener('click',openCoverDlg);
  const up=$('#coverUpload'),cf=$('#coverFile');
  up&&cf&&up.addEventListener('click',()=>{cf.value='';cf.click()});
  cf&&cf.addEventListener('change',()=>{
    const f=cf.files&&cf.files[0];if(!f)return;

function genCss(n){
  const r=worldRect(n);
  const lines=[
    `position: absolute;`,
    `left: ${Math.round(r.x)}px; top: ${Math.round(r.y)}px;`,
    `width: ${Math.round(n.w)}px; height: ${Math.round(n.h)}px;`,
  ];
  if(n.type==='rect'){
    const rs=radiiOf(n);
    lines.push(rs.every(v=>v===rs[0])?`border-radius: ${rs[0]}px;`:`border-radius: ${rs.map(v=>v+'px').join(' ')};`);
  }
  /* P19：填充输出（纯色 / 渐变 / 图片） */
  const visFills=fillsOf(n).filter(f=>f.on!==false);
  const topFill=visFills[visFills.length-1];
  const fillCss=topFill?fillToCss(topFill):null;
  if(fillCss)lines.push(`background: ${fillCss};`);
  /* P21：多描边只输出最上层一条到简写 border，虚线用 dashed/dotted */
  const topStroke=strokesOf(n).filter(s=>s.on!==false&&s.color).pop();
  if(topStroke){
    const st=topStroke.style==='dashed'?'dashed':topStroke.style==='dotted'?'dotted':'solid';
    lines.push(`border: ${topStroke.width??1}px ${st} ${topStroke.color};`);
  }else if(n.stroke)lines.push(`border: ${n.strokeW||1}px solid ${n.stroke};`);
  /* P19：效果列表 → CSS（投影/内阴影合并为 box-shadow，模糊/背景模糊单独输出） */
  const fx=effectsOf(n).filter(e=>e.on!==false);
  const shadows=fx.filter(e=>e.type==='drop'||e.type==='inner').map(e=>
    `${e.type==='inner'?'inset ':''}${Math.round(e.x||0)}px ${Math.round(e.y||0)}px ${Math.round(e.blur||0)}px ${hexA(e.color,e.opacity??.25)}`);
  if(shadows.length)lines.push(`box-shadow: ${shadows.join(', ')};`);
  const lb=fx.find(e=>e.type==='blur'&&(parseFloat(e.value)||0)>0);
  if(lb)lines.push(`filter: blur(${Math.round(parseFloat(lb.value))}px);`);
  const bgf=fx.find(e=>e.type==='bgblur'&&(parseFloat(e.value)||0)>0);
  if(bgf)lines.push(`backdrop-filter: blur(${Math.round(parseFloat(bgf.value))}px);`);
  if(n.type==='text'){
    lines.push(`font-size: ${n.fontSize}px; font-weight: ${n.fontWeight}; color: ${n.color};`);
    lines.push(`line-height: ${(n.lineHeight||1.4)}; letter-spacing: ${n.letterSpacing||0}px;`);

function fillToCss(f){

  const st=gradientStopsOf(f).map(s=>`${s.color||'#000'} ${Math.round((s.pos??0)*100)}%`).join(', ');
  if(t==='linear')return `linear-gradient(${Math.round((90+(parseFloat(f.angle)||0))%360)}deg, ${st})`;
  if(t==='radial')return `radial-gradient(circle, ${st})`;

    const size=f.fit==='fill'?'100% 100%':(f.fit==='contain'?'contain':'cover');

const SCRUB_KEYS=new Set(['x','y','w','h','rot','r','rtl','rtr','rbr','rbl','opacity','strokeW','fontSize','sides','points','shadowX','shadowY','shadowBlur','shadowOp','blur']);
/* 通用：给 .fld > b（图标/标签）绑定横向拖拽；4px = 1 单位，Shift ×10 */
function attachScrub(inp,apply,opts={}){
  const fldEl=inp.closest('.fld'),h=fldEl&&fldEl.querySelector('b');
  if(!h||h.classList.contains('ni'))return;
  const unit=opts.unit||4;
  h.title=opts.title||'拖动调整数值（Shift 加速）';
  h.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    e.preventDefault();e.stopPropagation();
    const raw=parseFloat(inp.value);
    if(isNaN(raw)&&!inp.getAttribute('placeholder'))return;
    const base=isNaN(raw)?0:raw,sx=e.clientX;
    let active=false,last=base;
    const onMove=ev=>{
      const dx=ev.clientX-sx;
      if(!active&&Math.abs(dx)<2)return;
      if(!active){active=true;inp.blur();document.body.style.userSelect='none';document.body.style.cursor='ew-resize'}
      let v=base+dx/unit*(ev.shiftKey?10:1);
      if(opts.min!=null)v=Math.max(opts.min,v);
      if(opts.max!=null)v=Math.min(opts.max,v);
      v=Math.round(v*100)/100;last=v;
      inp.value=v;apply(v,true);drawSoon();
    };
    const onUp=()=>{
      window.removeEventListener('pointermove',onMove);
      window.removeEventListener('pointerup',onUp);
      document.body.style.cursor='';document.body.style.userSelect='';
      if(active)apply(last,false);else inp.focus();
    };
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
  });
}
function bindScrub(inp,k,n,nodes){
  if(!SCRUB_KEYS.has(k))return;
  attachScrub(inp,(v,live)=>{
    applyField(k,v,n,nodes);
    if(!live){snapshot();renderPanel()}
  });
}
function applyField(k,v,n,nodes){
  /* P20：数值表达式（的 + - * / 与括号） */
  const raw=String(v==null?'':v).trim();
  let num=parseFloat(raw);
  if(/^[\d+\-*/().\s]+$/.test(raw)&&/[+\-*/]/.test(raw)){
    try{const r=Function('"use strict";return ('+raw+')')();if(isFinite(r))num=r}catch(err){}
  }
  const applyOne=(t)=>{
    const p=parentOf(t);
    switch(k){
      case 'name':if(v.trim())t.name=v.trim();break;
      case 'x':if(!isNaN(num)){const pp=abOf(t);if(pp)t.x=num-pp.x;else t.x=num}break;
      case 'y':if(!isNaN(num)){const pp=abOf(t);if(pp)t.y=num-pp.y;else t.y=num}break;
      case 'w':if(!isNaN(num))t.w=Math.max(1,num);break;
      case 'h':if(!isNaN(num))t.h=Math.max(1,num);break;
      case 'rot':if(!isNaN(num)&&t.type!=='artboard')t.rot=((num%360)+360)%360;break;
      case 'r':if(!isNaN(num)){const v0=Math.max(0,num);t.radius=v0;t.rc=null}break;
      case 'rtl':case 'rtr':case 'rbr':case 'rbl':if(!isNaN(num)){
        const idx={rtl:0,rtr:1,rbr:2,rbl:3}[k],cur=radiiOf(t).slice();
        cur[idx]=Math.max(0,num);t.rc=cur;
      }break;
      case 'color':case 'colorHex':if(t.type==='svg'||t.type==='text')t.color=v;break;
      case 'fill':if(t.type!=='text'){t.fill=v;if(t.type==='artboard')t.bg=v;}else t.color=v;break;
      case 'fillHex':if(t.type!=='text'){t.fill=v;if(t.type==='artboard')t.bg=v;}else t.color=v;break;
      case 'opacity':if(!isNaN(num))t.opacity=Math.min(100,Math.max(0,num))/100;break;
      case 'stroke':case 'strokeHex':{
        const s=primaryStroke(t);if(s)s.color=v;t.stroke=v;break;
      }
      case 'strokeW':if(!isNaN(num)){const s=primaryStroke(t);if(s)s.width=Math.max(0,num);t.strokeW=Math.max(0,num)}break;
      case 'strokeOn':{
        const s=primaryStroke(t);
        if(s)s.on=(v===true||v==='true');
        t.stroke=(v===true||v==='true')?(t.stroke||'#3670F7'):null;break;
      }
      /* P18/P19：描边位置 / 投影 / 图层模糊（投影与模糊写入效果列表，并回写旧字段） */
      case 'strokeAlign':{const s=primaryStroke(t);if(s)s.align=v;t.strokeAlign=v;break}
      case 'shadowOn':case 'shadowX':case 'shadowY':case 'shadowBlur':case 'shadowOp':case 'shadowColor':case 'shadowColorHex':{
        const s=dropEffect(t);
        if(k==='shadowOn')s.on=(v===true||v==='true');
        else if(k==='shadowColor'||k==='shadowColorHex')s.color=v;
        else if(!isNaN(num)){
          if(k==='shadowOp')s.opacity=Math.min(1,Math.max(0,num/100));
          else s[k==='shadowX'?'x':k==='shadowY'?'y':'blur']=num;
        }

        break;
      }
      case 'blur':{
        if(!isNaN(num)){const b=blurEffect(t);b.value=Math.max(0,num);syncLegacyEffects(t)}
        break;
      }
      /* P10：类型专属字段 */
      case 'dir':t.dir=v==='/'?'/':'\\';break;
      case 'sides':if(!isNaN(num))t.sides=Math.min(12,Math.max(3,Math.round(num)));break;
      case 'points':if(!isNaN(num))t.points=Math.min(20,Math.max(5,Math.round(num)));break;
      /* 文本：字号/字重/对齐 */
      case 'fontSize':if(!isNaN(num)&&t.type==='text'){t.fontSize=Math.max(2,num);if(!t.align){const m=measureText(t);t.w=m.w;t.h=m.h}}break;
      case 'fontWeight':if(!isNaN(num)&&t.type==='text'){t.fontWeight=num;if(!t.align){const m=measureText(t);t.w=m.w;t.h=m.h}}break;
      case 'lineHeight':if(!isNaN(num)&&num>0&&t.type==='text'){t.lineHeight=Math.min(4,Math.max(.5,num));if(!t.align){const m=measureText(t);t.w=m.w;t.h=m.h}}break;
      case 'letterSpacing':if(!isNaN(num)&&t.type==='text'){t.letterSpacing=Math.max(-10,Math.min(80,num));if(!t.align){const m=measureText(t);t.w=m.w;t.h=m.h}}break;
      case 'valign':if(t.type==='text'){t.valign=v;if(!t.align){const m=measureText(t);t.w=m.w;t.h=m.h}}break;
      case 'textCase':if(t.type==='text'){t.textCase=v;if(!t.align){const m=measureText(t);t.w=m.w;t.h=m.h}}break;
      case 'align':if(t.type==='text'){t.align=v||null;const m=measureText(t);if(!t.align||!(t.w>0)){t.w=m.w;t.h=m.h}}break;
    }
  };

    if(k==='x'||k==='y'){

    }

      if(isFinite(f)&&f>0){
        const nb={x:b.x,y:b.y,w:b.w*f,h:b.h*f};
        dedupeRoots(nodes).forEach(t=>scaleNodeInBox(t,b,nb));
        syncAllGroups();
      }
      snapshot();renderPanel();
    }
    /* P16：多选共同属性——不透明度 / 圆角（Mixed 后统一写入） */
    if(k==='opacity'&&!isNaN(num))nodes.forEach(t=>{t.opacity=Math.min(100,Math.max(0,num))/100});
    if(k==='r'&&!isNaN(num))nodes.forEach(t=>{if(t.type==='rect'){const v0=Math.max(0,num);t.radius=v0;t.rc=null}});
    /* P21：多选填充 / 描边 / 文本排版——Mixed 后覆盖写入 */

    if(k==='color'||k==='colorHex')nodes.forEach(t=>{if(t.type==='svg'||t.type==='text')t.color=v});
    if(k==='stroke'||k==='strokeHex')nodes.forEach(t=>{const s=primaryStroke(t);if(s)s.color=v;t.stroke=v});
    if(k==='strokeW'&&!isNaN(num))nodes.forEach(t=>{const s=primaryStroke(t);if(s)s.width=Math.max(0,num);t.strokeW=Math.max(0,num)});
    if(k==='fontSize'&&!isNaN(num))nodes.forEach(t=>{if(t.type==='text'){t.fontSize=Math.max(2,num);if(!t.align){const m=measureText(t);t.w=m.w;t.h=m.h}}});
    if(k==='lineHeight'&&!isNaN(num))nodes.forEach(t=>{if(t.type==='text'){t.lineHeight=Math.min(4,Math.max(.5,num));if(!t.align){const m=measureText(t);t.w=m.w;t.h=m.h}}});
    if(k==='letterSpacing'&&!isNaN(num))nodes.forEach(t=>{if(t.type==='text'){t.letterSpacing=Math.max(-10,Math.min(80,num));if(!t.align){const m=measureText(t);t.w=m.w;t.h=m.h}}});
    if(k==='textCase')nodes.forEach(t=>{if(t.type==='text'){t.textCase=v;if(!t.align){const m=measureText(t);t.w=m.w;t.h=m.h}}});
    syncAllGroups();

  }
  if(!n)return;

/* P12-D：相机 = 平移 cam.{x,y} + 缩放 cam.z + 视图旋转 viewRot（角度制，绕视口中心）

const w2s=(x,y)=>({x:x*cam.z+cam.x,y:y*cam.z+cam.y});

  const c=vc(),a=rotRad(),co=Math.cos(a),si=Math.sin(a),dx=x-c.x,dy=y-c.y;
  return{x:c.x+dx*co-dy*si,y:c.y+dx*si+dy*co};

  return{x:c.x+dx*co-dy*si,y:c.y+dx*si+dy*co};

  return{x0:Math.min(...cs.map(p=>p.x)),y0:Math.min(...cs.map(p=>p.y)),

  const cs=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]].map(([x,y])=>{const p=unrotPt(x,y);return s2wBase(p.x,p.y)});
  const xs=cs.map(p=>p.x),ys=cs.map(p=>p.y);

const clampZ=z=>Math.min(200,Math.max(0.01,z));

function zoomAt(mx,my,z){
  z=clampZ(z);

  cam.x=q.x-wpt.x*z;cam.y=q.y-wpt.y*z;cam.z=z;drawSoon();

/* 平滑缩放动画（键盘/菜单用，滚轮保持即时） */
let zoomAnimId=0;
function zoomTo(z,mx,my,dur){
  z=clampZ(z);
  const z0=cam.z,d=dur===undefined?160:dur;
  const id=++zoomAnimId;
  if(Math.abs(z-z0)<1e-4||d<=0){zoomAt(mx,my,z);return}
  const t0=performance.now();
  const step=t=>{
    if(id!==zoomAnimId)return;
    const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);
    zoomAt(mx,my,z0*Math.pow(z/z0,e));

function rulerStep(){

function drawRulers(w,h){
  if(viewRot)return; // P12-D：视图旋转后标尺与屏幕轴失配，隐藏（旋转角由角标提示）
  const S=rulerStep(),minor=S/10;

  // 选区在标尺上的范围带
  const ns=selNodes();
  if(ns.length){
    const b=unionRect(ns);
    const x0=b.x*cam.z+cam.x,x1=(b.x+b.w)*cam.z+cam.x;
    const y0=b.y*cam.z+cam.y,y1=(b.y+b.h)*cam.z+cam.y;
    ctx.fillStyle='rgba(54,112,247,0.18)';
    ctx.fillRect(Math.max(RULER,x0),RULER-4,Math.max(0,Math.min(x1,w)-Math.max(x0,RULER)),4);
    ctx.fillRect(RULER-4,Math.max(RULER,y0),4,Math.max(0,Math.min(y1,h)-Math.max(y0,RULER)));
  }
  const wx0=s2w(RULER,0).x,wx1=s2w(w,0).x,wy0=s2w(0,RULER).y,wy1=s2w(0,h).y;
  const startX=Math.floor(wx0/minor)*minor,startY=Math.floor(wy0/minor)*minor;

  ctx.font=`400 10px ${FONT}`;ctx.fillStyle=skin.rulerText;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  for(let v=startX;v<=wx1;v+=minor){
    const sx=Math.round(v*cam.z+cam.x)+.5,major=Math.abs(v/S-Math.round(v/S))<1e-6;
    ctx.moveTo(sx,RULER-(major?7:4));ctx.lineTo(sx,RULER-1);
    if(major)ctx.fillText(String(Math.round(v)),sx+3,12);
  }
  for(let v=startY;v<=wy1;v+=minor){
    const sy=Math.round(v*cam.z+cam.y)+.5,major=Math.abs(v/S-Math.round(v/S))<1e-6;
    ctx.moveTo(RULER-(major?7:4),sy);ctx.lineTo(RULER-1,sy);

  ctx.fillStyle=skin.rulerCorner;ctx.fillRect(0,0,RULER,RULER);ctx.strokeRect(.5,.5,RULER,RULER);

}
function hitGuide(sx,sy){
  if(!state.showGuides)return null;
  const q=unrotPt(sx,sy); // P12-D：反旋到基线空间后按屏幕距离比较
  const gs=pageGuides();
  for(let i=gs.length-1;i>=0;i--){
    const g=gs[i],p=g.axis==='x'?g.pos*cam.z+cam.x:g.pos*cam.z+cam.y;
    const inRuler=viewRot?false:(g.axis==='x'?q.y<RULER:q.x<RULER);

/* 参考线吸附：画板左/中/右、上/中/下（6px 屏幕阈值） */
function snapGuide(v,axis){

  for(const ab of curPage().artboards){
    const arr=axis==='x'?[ab.x,ab.x+ab.w/2,ab.x+ab.w]:[ab.y,ab.y+ab.h/2,ab.y+ab.h];
    for(const c of arr){const d=Math.abs(v-c);if(d<bd){bd=d;best=c}}

/* 像素网格：1 世界像素一条线，只画在画板内。

   未手动开启时仅在 z≥GRID_Z 自动出现 */
const GRID_STEPS=[1,2,5,10,20,50,100,200,500,1000];
function gridStep(){

  ctx.save();

    const y0=Math.max(ab.y,Math.ceil(vr.y0/step)*step),y1=Math.min(ab.y+ab.h,vr.y1);

/* P17：对齐参照——多选=并集包围盒；单选=父画板（画板本身不参与单对象对齐） */
function alignBox(ns){
  if(ns.length>1)return unionRect(ns);
  const n=ns[0],ab=abOf(n);

function alignSel(mode){
  const ns=selNodes();
  if(!ns.length)return;
  if(mode==='dh'||mode==='dv'){
    if(ns.length<3)return;
    const key=mode==='dh'?'x':'y',size=mode==='dh'?'w':'h';
    const arr=ns.slice().sort((a,b)=>worldRect(a)[key]-worldRect(b)[key]);
    const rs=arr.map(worldRect);
    const span=rs[rs.length-1][key]+rs[rs.length-1][size]-rs[0][key];
    const sum=rs.reduce((s,r)=>s+r[size],0);
    const gap=(span-sum)/(arr.length-1);

      else if(mode==='cv')dy=(b.y+(b.h-r.h)/2)-r.y;
      else if(mode==='b')dy=(b.y+b.h-r.h)-r.y;

function radiiOf(n){

/* 旋转光标：角外 20px 热区（rotation-handler-size） */
const ROT_CURSOR=`url("data:image/svg+xml;charset=utf8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="5.5" fill="none" stroke="#fff" stroke-width="3.2"/><circle cx="10" cy="10" r="5.5" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="7.5 4"/><path d="M16.2 6.4l-1.9 1.1 2 1.4" fill="#1a1a1a"/></svg>')}") 10 10, crosshair`;

const ZOOM_CURSOR=`url("data:image/svg+xml;charset=utf8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="rgba(255,255,255,.85)" stroke="#1a1a1a" stroke-width="1.6"/><path d="M15 15l5 5" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/><path d="M7 10h6M10 7v6" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/></svg>')}") 10 10, crosshair`;

function rotWorld(x,y,cx,cy,deg){
