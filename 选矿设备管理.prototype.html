const compPage=()=>pages.find(p=>p.comp);
const masterList=()=>{const p=compPage();return p?p.artboards.filter(a=>a.master):[]};
/* 自举：组件库页缺失则补建（旧文档 / 新文档统一入口），母版按 COMPS 索引网格排布 */
function ensureCompPage(){
  let p=pages.find(x=>x.comp);
  if(!p){
    p={name:'组件库',comp:true,artboards:[]};
    pages.push(p);
    tree.push({label:'组件库',page:pages.length-1});
  }
  COMPS.forEach((c,i)=>{
    if(p.artboards.some(a=>a.master===c.id))return;
    const ab=AB({id:uid(),name:c.name,master:c.id,x:(i%3)*560,y:Math.floor(i/3)*320,w:c.w,h:c.h});
    c.build().forEach(n=>{n.id=uid();n.parent=ab;ab.children.push(n)});
    try{renderBoard(ab,1)}catch(e){} // 离屏渲染触发文本测量
    p.artboards.push(ab);
  });
}
/* 实例克隆核心：母版 → 目标画板，(wx,wy) 为组件原点（世界坐标）
   P32：实例改为单一容器（type=group, cont=1），子图层相对容器定位；
   容器 ov 记录实例级覆盖，重建时保留。旧文档的扁平实例仍兼容。 */
function makeInstance(mAB,ab,wx,wy){
  const iid='i'+uid();
  const g={id:uid(),type:'group',cont:1,name:mAB.name||'组件',inst:mAB.master,iid,
    x:wx-ab.x,y:wy-ab.y,w:mAB.w,h:mAB.h,ov:{},children:[]};
  mAB.children.forEach((c,k)=>{
    const n=JSON.parse(JSON.stringify(c,(kk,v)=>kk==='parent'?undefined:v));
    reidTree(n,g);
    n.kp=k;n.mc=c.id;
    n.x=c.x;n.y=c.y;
    translateNode(n,g.x,g.y); // 画板局部坐标：整体平移到容器位置
    g.children.push(n);
  });
  ab.children.push(g);
  return g;
}
/* 实例覆盖：只记录可视化属性；几何仍由母版与容器位置决定 */
const OV_KEYS=['fill','fillType','grad','gradAngle','gradStops','stroke','strokeW','sw','opacity',
  'radius','r','visible','hidden','locked','text','fontSize','fontWeight','color','letterSpacing','lh','ls','align'];
function ovDiff(oldN,c){
  if(!oldN)return {};
  const o={};
  for(const k of OV_KEYS){
    const a=oldN[k],b=c[k];
    if(JSON.stringify(a)===JSON.stringify(b))continue;
    if(a===undefined&&b===undefined)continue;
    o[k]=a===undefined?null:a;
  }
  if('text' in o){o.w=oldN.w;o.h=oldN.h}
  return o;
}
function applyOv(n,ov){
  for(const k in ov){const v=ov[k];if(v===null)delete n[k];else n[k]=v}
}
function instOwner(n){
  let x=n;
  while(x){
    if(x.cont&&x.inst)return x;
    if(x.inst&&!x.cont)return x; // 旧扁平实例
    x=x.parent;
  }
  return null;
}
function overrideCount(g){
  if(!g||!g.inst)return 0;
  if(g.ov)return Object.keys(g.ov).reduce((a,k)=>a+Object.keys(g.ov[k]||{}).length,0);
  return 0;
}
function placeComp(id,wpt){
  const mAB=masterList().find(a=>a.master===id);
  if(!mAB){toast('组件不存在');return}
  let wx,wy;
  if(wpt){wx=wpt.x;wy=wpt.y}
  else{
    // P31：未指定落点时优先放入选中图层所在画板，否则当前页第一个画板
    const sn=single();
    const ab0=(sn&&abOf(sn))||curPage().artboards.find(a=>!a.hidden);
    if(!ab0){toast('请先创建画板');return}
    wx=ab0.x+Math.max(16,(ab0.w-mAB.w)/2);wy=ab0.y+Math.max(16,(ab0.h-mAB.h)/2);
  }
  const ab=containingAb(wx,wy);
  if(!ab){toast('请放置到画板内');return}
  const g=makeInstance(mAB,ab,wx,wy);
  state.sel=new Set([g.id]);
  syncSelection();snapshot();
}

const COMP_SIG={};
function syncInstances(){
  const cp=compPage();if(!cp)return;
  cp.artboards.forEach(mAB=>{
    if(!mAB.master)return;
    const sig=JSON.stringify(mAB.children,(k,v)=>k==='parent'?undefined:v);
    if(COMP_SIG[mAB.master]===undefined){COMP_SIG[mAB.master]=sig;return}
    if(COMP_SIG[mAB.master]!==sig){
      COMP_SIG[mAB.master]=sig;
      rebuildInstances(mAB);
    }
  });
}
function rebuildInstances(mAB){
  const mid=mAB.master;
  pages.forEach(p=>{
    if(p.comp)return;
    p.artboards.forEach(ab=>{
      /* A. 容器实例：重建容器子层，合并 ov（已有覆盖 + 当前相对母版的差异） */
      ab.children.forEach(g=>{
        if(!g.cont||g.inst!==mid)return;
        rebuildContainer(g,mAB);
      });
      /* B. 旧扁平实例（P31 之前插入的实例）：保持原有重建逻辑 */
      const groups={};
      ab.children.forEach(n=>{if(!n.cont&&n.inst===mid)(groups[n.iid]=groups[n.iid]||[]).push(n)});
      const gids=Object.keys(groups);if(!gids.length)return;
      const drop=new Set();gids.forEach(g=>groups[g].forEach(n=>drop.add(n)));
      ab.children=ab.children.filter(n=>!drop.has(n));
      gids.forEach(g=>{
        const old=groups[g].slice().sort((a,b)=>(a.kp||0)-(b.kp||0));
        const anchor=old[0];
        const mc=mAB.children[anchor.kp]||mAB.children[0];
        const dx=anchor.x-mc.x-anchor.ix,dy=anchor.y-mc.y-anchor.iy; // 用户位移
        const oldBy={};
        old.forEach(o=>{oldBy[o.mc||('k'+o.kp)]=o});
        mAB.children.forEach((c,k)=>{
          const n=JSON.parse(JSON.stringify(c,(kk,v)=>kk==='parent'?undefined:v));
          reidTree(n,ab);
          n.inst=mid;n.iid=anchor.iid;n.ix=anchor.ix;n.iy=anchor.iy;n.kp=k;n.mc=c.id;
          n.x=c.x+anchor.ix+dx;n.y=c.y+anchor.iy+dy;
          const prev=oldBy[c.id]||oldBy['k'+k];
          if(prev&&prev.proto)n.proto=JSON.parse(JSON.stringify(prev.proto));
          ab.children.push(n);
        });
      });
    });
  });
  state.sel=new Set([...state.sel].filter(id=>{const n=nodeById(id);return n&&!n.inst}));
}

function rebuildContainer(g,mAB){
  const oldBy={};(g.children||[]).forEach(c=>{oldBy[c.mc||('k'+c.kp)]=c});
  g.ov=g.ov||{};
  const nch=[];
  mAB.children.forEach((c,k)=>{
    const n=JSON.parse(JSON.stringify(c,(kk,v)=>kk==='parent'?undefined:v));
    reidTree(n,g);
    n.kp=k;n.mc=c.id;n.x=c.x;n.y=c.y;
    translateNode(n,g.x,g.y); // 与容器位置对齐（画板局部坐标）
    const prev=oldBy[c.id]||oldBy['k'+k];
    const ov=ovDiff(prev,c);
    applyOv(n,ov);
    if(Object.keys(ov).length)g.ov[c.id]=ov;else delete g.ov[c.id];
    if(prev&&prev.proto)n.proto=JSON.parse(JSON.stringify(prev.proto));
    nch.push(n);
  });
  g.children=nch;
  g.inst=mAB.master;
  g.name=mAB.name||g.name;
  g.w=mAB.w;g.h=mAB.h;
}
/* ================================================================
 * P31 组件封装闭环：选中图层 → 创建组件（母版入组件库页 / 源图层变实例）
 * 实例 → 跳转主组件 / 更新所有实例 / 解除关联；面板卡片可直接插入实例
 * ================================================================ */
const masterByComp=id=>masterList().find(a=>a.master===id);
/* P32：组件变体（同一 setId 的多个母版；instance.inst 指向当前变体母版） */
const variantSet=mid=>{
  const m=masterByComp(mid);if(!m)return [];
  const key=m.setId||m.master;
  return masterList().filter(a=>(a.setId||a.master)===key);
};
const variantLabel=m=>m&&(m.variant||'默认');
function createVariant(mid){
  const src=masterByComp(mid);
  if(!src){toast('主组件不存在');return}
  const set=variantSet(mid);
  const key=src.setId||src.master;
  set.forEach(m=>{if(!m.setId)m.setId=key;if(!m.variant)m.variant='默认'});
  const nm='变体 '+(set.length+1);
  const x=Math.max(...set.map(m=>m.x+m.w))+80;
  const base=String(src.name).replace(/\s*[·/]\s*(默认|变体.*)$/,'');
  const ab=AB({id:uid(),name:base+' · '+nm,setId:key,variant:nm,master:'c'+uid(),
    x,y:src.y,w:src.w,h:src.h});
  src.children.forEach(c=>{const cp=cloneNodeTree(c,ab);ab.children.push(cp)});
  compPage().artboards.push(ab);
  try{renderBoard(ab,1)}catch(e){}
  COMP_SIG[ab.master]=JSON.stringify(ab.children,(k,v)=>k==='parent'?undefined:v);
  state.sel=new Set([ab.id]);syncSelection();snapshot();renderTree();drawSoon();
  toast('已创建变体「'+nm+'」');
}
function switchVariant(g,mid,opts){
  opts=opts||{};
  const mAB=masterByComp(mid);
  if(!g||!g.cont||!mAB){toast('无法切换变体');return}
  g.ov={};
  rebuildContainer(g,mAB);
  COMP_SIG[mid]=COMP_SIG[mid]||JSON.stringify(mAB.children,(k,v)=>k==='parent'?undefined:v);
  syncSelection();renderPanel();renderLayers();drawSoon();
  if(!opts.silent){snapshot();toast('已切换为「'+variantLabel(mAB)+'」')}
}
function resetOverrides(g){
  if(!g||!g.cont)return;
  const mAB=masterByComp(g.inst);
  if(!mAB)return;
  g.ov={};rebuildContainer(g,mAB);
  syncSelection();snapshot();renderLayers();drawSoon();
  toast('已重置实例覆盖');
}
function createComponent(n){
  if(!n||n.type==='artboard'){toast('请选择画板内的图层（画板请先编组）');return}
  if(instOwner(n)){toast('该图层属于组件实例');return}
  const ab=abOf(n);
  if(!ab){toast('自由图层暂不支持组件，请先移入画板');return}
  const cp=compPage();
  if(!cp){toast('组件库页缺失');return}
  const wr=worldRect(n);
  const mid='c'+uid();
  const y0=cp.artboards.reduce((m,a)=>Math.max(m,a.y+a.h),0)+(cp.artboards.length?80:0);
  const mAB=AB({id:uid(),name:(n.name||'组件'),master:mid,x:0,y:y0,
    w:Math.max(1,Math.round(wr.w)),h:Math.max(1,Math.round(wr.h))});
  const cl=cloneNodeTree(n,mAB);
  translateNode(cl,-(wr.x-ab.x),-(wr.y-ab.y)); // 母版局部坐标：包围盒左上归零
  cl.name=n.name||'组件';
  if(n.proto)cl.proto=JSON.parse(JSON.stringify(n.proto));
  mAB.children.push(cl);
  cp.artboards.push(mAB);
  try{renderBoard(mAB,1)}catch(e){}
  const par=n.parent;
  if(par&&par.children){
    const idx=par.children.indexOf(n);
    if(idx>=0)par.children.splice(idx,1);
  }
  const inst=makeInstance(mAB,ab,wr.x,wr.y);
  if(n.proto&&inst)inst.proto=JSON.parse(JSON.stringify(n.proto));
  COMP_SIG[mid]=JSON.stringify(mAB.children,(k,v)=>k==='parent'?undefined:v);
  state.sel=new Set([inst.id]);
  syncSelection();snapshot();drawSoon();renderLayers();renderTree();
  toast('已创建组件，可在「组件库」插入实例');
}
function updateInstances(mid){
  const mAB=masterByComp(mid);
  if(!mAB){toast('主组件不存在');return}
  rebuildInstances(mAB);
  COMP_SIG[mid]=JSON.stringify(mAB.children,(k,v)=>k==='parent'?undefined:v);
  state.sel=new Set([...state.sel].filter(id=>{const n=nodeById(id);return !!n}));
  syncSelection();snapshot();drawSoon();renderLayers();
  toast('已更新该组件的所有实例');
}
function detachInstance(n){
  const owner=instOwner(n);
  if(!owner){toast('不是组件实例');return}
  if(owner.cont){
    delete owner.inst;delete owner.iid;delete owner.ov;delete owner.cont;
    state.sel=new Set([owner.id]);
  }else{
    const ab=abOf(owner),iid=owner.iid;
    const strip=x=>{
      delete x.inst;delete x.iid;delete x.ix;delete x.iy;delete x.kp;delete x.mc;
      for(const c of x.children||[])strip(c);
    };
    if(iid&&ab)(ab.children||[]).forEach(c=>{if(c.iid===iid)strip(c)});
    else strip(owner);
    state.sel=new Set([owner.id]);
  }
  syncSelection();snapshot();drawSoon();
  toast('已解除组件关联，图层保留为普通组');
}
function gotoMaster(mid){
  const pi=pages.findIndex(p=>p.comp&&p.artboards.some(a=>a.master===mid));
  const mAB=pi>=0?pages[pi].artboards.find(a=>a.master===mid):null;
  if(!mAB){toast('主组件不存在');return}
  if(pi!==state.page)switchPage(pi);

}

/* ================================================================
 * P4 AI 桥接层：window.ProtoAPI
 * 面向 agent 的同步 JSON 接口 —— 全部方法可直接序列化；
 * __schema 自描述（签名/类型/示例），agent 一次 introspect 即可学会；
 * 所有变更经 snapshot() 进撤销历史并回写 __doc，人类可 Ctrl+Z 精调。
 * ================================================================ */
const ProtoAPI=(()=>{
  const REPL=(k,v)=>k==='parent'?undefined:v;
  const err=m=>({ok:false,error:m});
  const PICK=['name','x','y','w','h','fill','stroke','strokeW','radius','text','fontSize','fontWeight','color','align','opacity','bg','dir','sides','points','src','hidden','locked'];

  function findAnywhere(ref){
    if(ref==null||ref==='')return null;
    const all=[];
    const walk=(list,pi,ab)=>{
      for(const c of list||[]){all.push({n:c,pi,ab});if(c.children)walk(c.children,pi,ab)}
    };
    pages.forEach((p,pi)=>p.artboards.forEach(ab=>{
      all.push({n:ab,pi,ab});
      walk(ab.children,pi,ab);
    }));
    let hit=all.filter(e=>e.n.id===ref);

    if(n.type==='artboard')s.childrenCount=(n.children||[]).length;

    c2.width=Math.max(1,Math.round(r.w*scale));
    c2.height=Math.max(1,Math.round(r.h*scale));

    return c2;
  }
  const TRIGGERS=['单击','悬停','按下','拖拽','滚动'],ANIMS=['无','淡入','左滑','右滑','上滑','下滑'];

  const api={
    version:'1.0',
    __schema:{
      api:'ProtoAPI',
      desc:'.prototype.html 内嵌原型编辑器的 AI 桥接层。所有方法同步调用、返回 JSON（含 ok 标志）。用于生成原型初稿，随后人类在编辑器中精调。',
      nodeTypes:{rect:'矩形（卡片/按钮/色块）',text:'文本（text 必填，w/h 自动测量）',ellipse:'圆形/椭圆',artboard:'画板（手机建议 375x812，大屏 1440x1024）'},
      props:{x:'数字',y:'数字',w:'数字',h:'数字',fill:'颜色 #RRGGBB 或 rgba()',stroke:'颜色|null',strokeW:'数字',radius:'圆角数字',text:'文本内容',fontSize:'数字',fontWeight:'数字(300-800)',color:'文字颜色',align:'null|left|center|right',opacity:'0-1',bg:'画板背景色',name:'语义名，供 findNode 引用（建议唯一）'},

          opacity:spec.opacity==null?1:+spec.opacity};
        if(type==='rect')n=R({...base,w:+spec.w||100,h:+spec.h||40,
          fill:spec.fill||'#3670F7',stroke:spec.stroke||null,strokeW:+spec.strokeW||0,radius:+spec.radius||0});
        else if(type==='ellipse')n=E({...base,w:+spec.w||80,h:+spec.h||80,
          fill:spec.fill||'#3670F7',stroke:spec.stroke||null,strokeW:+spec.strokeW||0});
        else if(type==='line'||type==='arrow')n=LN({...base,w:+spec.w||100,h:+spec.h||2,
          stroke:spec.stroke||'#000000',strokeW:+spec.strokeW||1.5,dir:spec.dir||'\\'},type);
        else if(type==='polygon')n=PG({...base,w:+spec.w||80,h:+spec.h||80,
          sides:Math.max(3,+spec.sides||3),fill:spec.fill||'#3670F7',stroke:spec.stroke||null,strokeW:+spec.strokeW||0});
        else if(type==='star')n=ST({...base,w:+spec.w||80,h:+spec.h||80,
          points:Math.max(5,+spec.points||5),fill:spec.fill||'#3670F7',stroke:spec.stroke||null,strokeW:+spec.strokeW||0});
        else if(type==='image')n=IM({...base,w:+spec.w||160,h:+spec.h||120,src:String(spec.src||'')});
        else n=T({...base,text:String(spec.text==null?'文本':spec.text),
          fontSize:+spec.fontSize||14,fontWeight:+spec.fontWeight||500,
          color:spec.color||'#000000',align:spec.align||null,w:0,h:0});
        n.parent=ab; // P6 修复：API 建节点缺 parent 会导致 hitTest/worldRect 崩溃
        ab.children.push(n);
        measure(ab);
      }
      afterChange();
      return {ok:true,node:snapOf(n)};
    }catch(e){return err(e.message)}},
    updateNode(ref,props){try{
      const e=findAnywhere(ref);
      if(!e)return err('未找到：'+ref);
      const n=e.n;
      const KEYS=['name','x','y','w','h','fill','stroke','strokeW','radius','text','fontSize','fontWeight','color','align','opacity','bg','dir','sides','points','src'];
      const NUM=['x','y','w','h','strokeW','radius','fontSize','fontWeight','opacity','sides','points'];
      const touchedText=['text','fontSize','fontWeight'].some(k=>k in (props||{})); // P6 修复：align 不再触发重测
      Object.keys(props||{}).forEach(k=>{
        if(!KEYS.includes(k))return;
        if(k==='bg'&&n.type!=='artboard')return;
        if(k==='name'){n.name=String(props[k]);return}
        n[k]=NUM.includes(k)?(+props[k]||0):props[k];
      });
      if(touchedText&&n.type==='text'){
        if(!n.align){n.w=0;n.h=0;measure(e.ab)} // 自动宽度：重测；align 非空=固定框，保持 w/h
      }
      afterChange();
      return {ok:true,node:snapOf(n)};
    }catch(e){return err(e.message)}},
    deleteNode(ref){try{
      const e=findAnywhere(ref);
      if(!e)return err('未找到：'+ref);
      if(e.n.type==='artboard'){
        const arr=pages[e.pi].artboards,i=arr.indexOf(e.n);
        if(i>=0)arr.splice(i,1);
      }else{
        const arr=e.n.parent?e.n.parent.children:e.ab.children,i=arr.indexOf(e.n);
        if(i>=0)arr.splice(i,1);
      }
      state.sel.delete(e.n.id);
      afterChange();
      return {ok:true};
    }catch(e){return err(e.message)}},
    duplicateNode(ref){try{
      const e=findAnywhere(ref);
      if(!e)return err('未找到：'+ref);
      const src=e.n;
      const clone=JSON.parse(JSON.stringify(src,REPL));
      const reid=o=>{o.id=uid();if(o.name)o.name=o.name+' 副本';(o.children||[]).forEach(reid)};
      reid(clone);
      (function strip(o){['inst','iid','ix','iy','kp','mc'].forEach(k=>delete o[k]);(o.children||[]).forEach(strip)})(clone); // P5：副本脱离实例联动
      clone.x=+src.x+16;clone.y=+src.y+16;
      if(src.type==='artboard'){
        pages[e.pi].artboards.push(clone);
        clone.children.forEach(c=>c.parent=clone);
      }else{
        const dest=e.n.parent||e.ab;
        clone.parent=dest;dest.children.push(clone);
        const fix=(o,p)=>{o.parent=p;if(o.children)o.children.forEach(c=>fix(c,o))};
        fix(clone,dest);
        measure(e.ab);
      }
      afterChange();
      return {ok:true,node:snapOf(clone)};
    }catch(e){return err(e.message)}},
    setProto(ref,list){try{
      const e=findAnywhere(ref);
      if(!e)return err('未找到：'+ref);
      const arr=Array.isArray(list)?list:[];
      for(const it of arr){
        if(!TRIGGERS.includes(it.trigger))return err('trigger 须为 '+TRIGGERS.join('|'));
        if(!ANIMS.includes(it.anim||'无'))return err('anim 须为 '+ANIMS.join('|'));
        if(!ACTIONS.includes(it.action||'打开画板'))return err('action 须为 '+ACTIONS.join('|'));
        if((it.action==='打开画板'||it.action==='打开弹层')&&!demoSeq().some(a=>a.id===it.target)&&!nodeById(it.target))return err('target 画板不存在：'+it.target);
        if(it.opos&&!OV_POS.includes(it.opos))return err('opos 须为 '+OV_POS.join('|'));
      }
      e.n.proto=arr.map(it=>({
        trigger:it.trigger,anim:it.anim||'无',action:it.action||'打开画板',target:it.target||null,
        dir:it.dir||null,opos:it.opos||null,ox:it.ox||0,oy:it.oy||0,
        dim:it.dim==null?null:it.dim,bdclose:it.bdclose==null?null:it.bdclose
      }));
      afterChange();
      return {ok:true,count:arr.length};
    }catch(e){return err(e.message)}},
    exportPNG(ref,scale,download){try{
      const e=findAnywhere(ref);
      if(!e)return err('未找到：'+ref);
      const s=+scale||2,cv=nodeCanvas(e.n,s);
      if(download){
        const nm=(cleanName(e.n.name||'导出'))+'.png';
        cv.toBlob(b=>{if(b)downloadBlob(b,nm)});
        return {ok:true,downloaded:nm,w:cv.width,h:cv.height};
      }
      return {ok:true,dataUrl:cv.toDataURL('image/png'),w:cv.width,h:cv.height};
    }catch(e){return err(e.message)}},
    listComps(){try{
      return {ok:true,comps:masterList().map(a=>({id:a.master,name:a.name,w:a.w,h:a.h}))};
    }catch(e){return err(e.message)}},
    insertComp(id,pageIdx,abRef,x,y){try{
      const mAB=masterList().find(a=>a.master===id||a.name===id);
      if(!mAB)return err('组件不存在：'+id);
      const pi=(pageIdx==null?state.page:pageIdx);
      const page=pages[pi];if(!page)return err('页索引不存在：'+pi);
      const ab=abRef?page.artboards.find(a=>a.id===abRef||a.name===abRef):page.artboards[0];
      if(!ab)return err('目标画板不存在：'+abRef);
      const wx=(x==null?ab.x+(ab.w-mAB.w)/2:x),wy=(y==null?ab.y+(ab.h-mAB.h)/2:y);
      const nodes=makeInstance(mAB,ab,wx,wy);
      afterChange();
      return {ok:true,nodes:nodes.map(snapOf)};
    }catch(e){return err(e.message)}},
    getSelection(){return {ok:true,ids:[...state.sel]}},
    undo(){try{undo();return {ok:true}}catch(e){return err(e.message)}},
    redo(){try{redo();return {ok:true}}catch(e){return err(e.message)}}
  };
  return api;
})();
window.ProtoAPI=ProtoAPI;

bootDoc();
applyTheme(docTheme);
setFileName(fileName);
applySplitRatio(); // 页面区:图层区默认 1:2
renderTree();renderLayers();renderPanel();
snapshot(); // 基线快照：此后所有变更可撤销（含文档回写）
// 初始相机 18%：延迟到首帧适配（tick 内 pendingFit）
window.addEventListener('resize',()=>{if(demo.on)demoFit();applySplitRatio();drawSoon()});
drawSoon();
/* P21-C：分享链接直接进入演示（#demo?a=画板 id） */
(function demoFromHash(){
  const h=location.hash||'';
  if(!/^#demo/.test(h))return;
  const m=/a=([^&]+)/.exec(h.split('?')[1]||'');
  demoStart(m?decodeURIComponent(m[1]):null);
})();
</script>
