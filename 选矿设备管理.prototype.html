function draw(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=pageCanvasBg(curPage());ctx.fillRect(0,0,w,h); // P22：页面背景色（P31 深浅主题）
  ctx.textBaseline='alphabetic';
  if(demo.on){demoFrame(w,h);return} // P2：演示模式接管整帧
  syncAllGroups(); // P14：绘制前同步组包围盒（移动/缩放/旋转后一致）
  const page=curPage();
  // P12-D：内容层整体绕视口中心旋转（标尺/旋转角标为屏幕界面，保持水平）
  const rc=vc();
  if(viewRot){ctx.save();ctx.translate(rc.x,rc.y);ctx.rotate(rotRad());ctx.translate(-rc.x,-rc.y)}
  const cullM=viewRot?Math.hypot(w,h):40;
  for(const ab of page.artboards){
    if(ab.hidden)continue; // 隐藏画板整块不绘制（含名称标签）
    const s=w2s(ab.x,ab.y),sw=ab.w*cam.z,sh=ab.h*cam.z;
    if(s.x>w+cullM||s.y>h+cullM||s.x+sw<-cullM||s.y+sh<-cullM)continue;
    // 画板标签：上方 6px，12px；选中/悬停淡蓝 chip 底（对齐 MasterGo）
    ctx.font=`500 12px ${FONT}`;
    const lblSel=state.sel.has(ab.id),lblHov=hoverLabelId===ab.id;
    if(lblSel||lblHov){
      const tw=ctx.measureText(ab.name).width;
      ctx.fillStyle=lblSel?'rgba(54,112,247,0.10)':skin.labelBg;
      ctx.beginPath();ctx.roundRect(s.x-5,s.y-19,tw+10,18,4);ctx.fill();
    }
    ctx.fillStyle=(lblSel||lblHov)?BRAND:skin.label;
    ctx.fillText(ab.name,s.x,s.y-6);
    // 画板白底 + 阴影
    ctx.save();
    ctx.shadowColor=skin.abShadow;ctx.shadowBlur=10;ctx.shadowOffsetY=2;
    ctx.fillStyle=ab.bg||'#FFFFFF';

    ctx.restore();
    // 子图层（裁剪到画板）——P14：组递归绘制，组本身无独立填充
    ctx.save();ctx.beginPath();ctx.rect(s.x,s.y,sw,sh);ctx.clip();
    drawList(ab.children,ab);
    ctx.restore();
    // 画板选中描边
    if(state.sel.has(ab.id)){
      ctx.strokeStyle=BRAND;ctx.lineWidth=2;ctx.strokeRect(s.x,s.y,sw,sh);
    }
  }
  /* P26：画板外的自由图层（不属于任何画板，不裁剪） */
  const loose=page.loose||[];
  if(loose.length)drawList(loose,{x:0,y:0});
  // P12-C：像素网格 + 参考线（在内容之上、选区之下）
  drawPixelGrid(w,h);
  drawGuides(w,h);
  // 选中框
  const nodes=selNodes();
  if(nodes.length===1){
    const n=nodes[0];
    if(n.type!=='artboard'){
      const pts=screenHandlePts(n); // P12-A：旋转后按 OBB 绘制
      ctx.strokeStyle=BRAND;ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(pts.nw.x,pts.nw.y);ctx.lineTo(pts.ne.x,pts.ne.y);
      ctx.lineTo(pts.se.x,pts.se.y);ctx.lineTo(pts.sw.x,pts.sw.y);

      const lnSel=(n.type==='line'||n.type==='arrow')&&!n.rot;
      if(!lnSel){drawHandles(n);drawGradHandles(n)} // P24：渐变色标手柄

    ctx.strokeRect(p.x,p.y,b.w*cam.z,b.h*cam.z);
    drawHandlesRect(b,0); // P14：多选同样给出手柄（整体缩放）
  }

  if(hoverId&&!state.sel.has(hoverId)){
    const hn=nodeById(hoverId);
    if(hn&&!hn.hidden&&!hiddenByAncestor(hn)){
      if(hn.type==='artboard'){
        const r=worldRect(hn),p=w2s(r.x,r.y);
        ctx.strokeStyle='rgba(54,112,247,0.55)';ctx.lineWidth=1.5;
        ctx.strokeRect(p.x,p.y,r.w*cam.z,r.h*cam.z);
      }else{ // 旋转后的 hover 也按 OBB 描边
        const pts=screenHandlePts(hn);
        ctx.strokeStyle='rgba(54,112,247,0.55)';ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(pts.nw.x,pts.nw.y);ctx.lineTo(pts.ne.x,pts.ne.y);
        ctx.lineTo(pts.se.x,pts.se.y);ctx.lineTo(pts.sw.x,pts.sw.y);
        ctx.closePath();ctx.stroke();
      }
    }
  }
  // 原型热点（虚线框 + 左上角三角标）——隐藏图层/隐藏画板不显示热区
  if(protoShow){

      if(o.type==='artboard'||!o.proto||!o.proto.length||o.hidden||hiddenByAncestor(o))continue;
      const r=worldRect(o),p=w2s(r.x,r.y);

    }

  if(mode==='move'&&nodes.length===1&&!(nodes[0].rot||0))drawMoveDistances(nodes[0]);
  if(mode==='rotate'&&start&&start.n)drawAngleBadge(start.n);

  if(marquee){
    const x=Math.min(marquee.x0,marquee.x1),y=Math.min(marquee.y0,marquee.y1);

  drawRulers(w,h);

  // 缩放读数

  if(zl.textContent!==txt)zl.textContent=txt;
}
/* ---------------- P12-A：画布徽标 / 移动间距（对齐 Penpot measurements / snap-distances） ---------------- */
function drawBadge(cx,cy,text,bg){

/* 选中尺寸徽标：框上边中点外 8px，16px 高 */
function drawSizeBadge(n){

/* 拖拽时显示到同级元素/画板边的最近间距（最多 4 条） */
function drawMoveDistances(n){
  const r=worldRect(n),ab=abOf(n);
  if(!ab)return;
  const TOL=480,out=[];
  const push=(axis,from,to,line)=>{
    const gap=Math.round(Math.abs(to-from));
    if(gap<1||gap>TOL)return;
    out.push({axis,from,to,line,gap});
  };
  for(const c of ab.children){
    if(c.id===n.id||c.hidden)continue;
    const q=worldRect(c);
    const vO=Math.min(r.y+r.h,q.y+q.h)-Math.max(r.y,q.y);
    const hO=Math.min(r.x+r.w,q.x+q.w)-Math.max(r.x,q.x);
    if(vO>0){
      const line=Math.max(r.y,q.y)+vO/2;
      if(q.x>=r.x+r.w)push('x',r.x+r.w,q.x,line);
      else if(r.x>=q.x+q.w)push('x',q.x+q.w,r.x,line);
    }
    if(hO>0){
      const line=Math.max(r.x,q.x)+hO/2;
      if(q.y>=r.y+r.h)push('y',r.y+r.h,q.y,line);
      else if(r.y>=q.y+q.h)push('y',q.y+q.h,r.y,line);
    }
  }
  const cy=r.y+r.h/2,cx=r.x+r.w/2;
  push('x',ab.x,r.x,cy);push('x',r.x+r.w,ab.x+ab.w,cy);
  push('y',ab.y,r.y,cx);push('y',r.y+r.h,ab.y+ab.h,cx);
  out.sort((a,b)=>a.gap-b.gap);
  ctx.strokeStyle=PINK;ctx.lineWidth=1;
  for(const d of out.slice(0,4)){
    const a=d.axis==='x'?w2s(d.from,d.line):w2s(d.line,d.from);
    const b=d.axis==='x'?w2s(d.to,d.line):w2s(d.line,d.to);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    const t=4;
    if(d.axis==='x'){ctx.moveTo(a.x,a.y-t);ctx.lineTo(a.x,a.y+t);ctx.moveTo(b.x,b.y-t);ctx.lineTo(b.x,b.y+t);}
    else{ctx.moveTo(a.x-t,a.y);ctx.lineTo(a.x+t,a.y);ctx.moveTo(b.x-t,b.y);ctx.lineTo(b.x+t,b.y);}
    ctx.stroke();
    drawBadge((a.x+b.x)/2,(a.y+b.y)/2,String(d.gap),PINK);
  }
}
function drawList(list,ab){

/* P18：形状路径统一构造（noBegin 供外侧描边的 evenodd 裁剪拼接子路径） */
function shapePath(n,p,sw,sh,noBegin){
  if(n.type==='rect'){
    roundRectPath4(p.x,p.y,sw,sh,radiiOf(n).map(v=>v*cam.z),noBegin);return true;
  }
  if(n.type==='ellipse'){
    if(!noBegin)ctx.beginPath();
    ctx.ellipse(p.x+sw/2,p.y+sh/2,Math.max(.1,sw/2),Math.max(.1,sh/2),0,0,Math.PI*2);
    return true;
  }
  if(n.type==='polygon'||n.type==='star'){
    const cx=p.x+sw/2,cy=p.y+sh/2;
    if(!noBegin)ctx.beginPath();
    if(n.type==='polygon'){
      const s=Math.max(3,n.sides||3);
      for(let i=0;i<s;i++){
        const a=-Math.PI/2+i*2*Math.PI/s;
        const px=cx+sw/2*Math.cos(a),py=cy+sh/2*Math.sin(a);
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
    }else{
      const pts=Math.max(5,n.points||5);
      for(let i=0;i<pts*2;i++){

/* P19：渐变 / 图片填充绘制 */
function fillGradient(f,p,sw,sh,type){

function paintImageFill(n,f,p,sw,sh){

/* ---------------- P12-A：手柄 / 旋转热区（屏幕空间，尺寸与缩放无关） ---------------- */

/* 旋转光标：角外 20px 热区（对齐 Penpot rotation-handler-size） */

  const L=Math.max(1,(Math.abs(Math.cos(la))*sw+Math.abs(Math.sin(la))*sh)/2)*(f.len??1);
  const ea=((parseFloat(f.angle)||0)+rot)*DEG,dx=Math.cos(ea),dy=Math.sin(ea);
  return{kind:'linear',p0:w2s(cx-dx*L,cy-dy*L),p1:w2s(cx+dx*L,cy+dy*L),cx,cy,rot,L};
}
function gradStopPt(g,t){
  t=Math.min(1,Math.max(0,t));
  if(g.kind==='linear')return{x:g.p0.x+(g.p1.x-g.p0.x)*t,y:g.p0.y+(g.p1.y-g.p0.y)*t};
  const lc={x:g.lc.x+(g.rad*t),y:g.lc.y};
  const p=rotWorld(lc.x,lc.y,g.cx,g.cy,g.rot);
  return w2s(p.x,p.y);
}
function gradHit(sx,sy){
  const q0=unrotPt(sx,sy);sx=q0.x;sy=q0.y;
  const n=single();
  if(!n||n.hidden||n.locked)return null;
  const f=activeGradFill(n);if(!f)return null;
  const g=gradGeom(n,f);
  const st=Array.isArray(f.stops)?f.stops:gradStops(f);
  for(let j=0;j<st.length;j++){
    const p=gradStopPt(g,st[j].pos??0);
    if(Math.hypot(sx-p.x,sy-p.y)>8)continue;
    /* 端点色标与方向手柄重叠时，优先作为方向手柄（更符合直觉） */
    const t=st[j].pos??0,end=(t<.002?'a':t>.998?'b':'');
    if(end==='a')return{n,f,kind:g.kind==='linear'?'p0':'center'};
    if(end==='b')return{n,f,kind:g.kind==='linear'?'p1':'radius'};
    return{n,f,kind:'stop',j};
  }
  if(g.kind==='linear'){
    if(Math.hypot(sx-g.p0.x,sy-g.p0.y)<=9)return{n,f,kind:'p0'};
    if(Math.hypot(sx-g.p1.x,sy-g.p1.y)<=9)return{n,f,kind:'p1'};
  }else{
    if(Math.hypot(sx-g.c.x,sy-g.c.y)<=9)return{n,f,kind:'center'};
    if(Math.hypot(sx-(g.c.x+g.r),sy-g.c.y)<=9)return{n,f,kind:'radius'};
  }
  return null;
}
function drawGradHandles(n){
  const f=activeGradFill(n);if(!f)return;
  const g=gradGeom(n,f);
  ctx.save();
  /* P25：手柄重绘——白色衬底 + 1px 细线，深/浅背景下都清晰 */
  const guide=(lw,col,dash)=>{
    ctx.save();ctx.setLineDash(dash||[]);
    ctx.strokeStyle=col;ctx.lineWidth=lw;
    ctx.beginPath();
    if(g.kind==='linear'){ctx.moveTo(g.p0.x,g.p0.y);ctx.lineTo(g.p1.x,g.p1.y)}
    else ctx.arc(g.c.x,g.c.y,g.r,0,Math.PI*2);
    ctx.stroke();ctx.restore();
  };
  guide(3.5,'rgba(255,255,255,.92)');
  guide(1,'rgba(0,0,0,.38)',g.kind==='radial'?[4,3]:null);
  /* 中间色标：单层圆点（白环 + 颜色芯），去掉原来粗糙的双层黑圈 */
  const st=Array.isArray(f.stops)?f.stops:gradStops(f);
  st.forEach(s=>{
    const t=s.pos??0;
    if(t<.002||t>.998)return; // 端点由下方方向手柄表示
    const p=gradStopPt(g,t);
    ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,4.2,0,Math.PI*2);ctx.fillStyle=hexA(s.color||'#000',s.opacity??1);ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.strokeStyle='rgba(0,0,0,.16)';ctx.lineWidth=1;ctx.stroke();
  });
  /* 方向手柄：小菱形，和色标圆点在视觉上区分开 */
  const dia=p=>{
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.PI/4);
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(-4.5,-4.5,9,9,1.7);else ctx.rect(-4.5,-4.5,9,9);
    ctx.fillStyle='#fff';ctx.fill();
    ctx.strokeStyle=BRAND;ctx.lineWidth=1.4;ctx.stroke();
    ctx.restore();
  };
  if(g.kind==='linear'){dia(g.p0);dia(g.p1)}
  else{dia(g.c);dia({x:g.c.x+g.r,y:g.c.y})}
  ctx.restore();
}

/* ---------------- 指针交互状态机（idle→pressing→dragging→selected） ---------------- */
let mode=null;        // pan|press|move|handle|rotate|marquee|create|createAb
let start=null;       // 起始信息
let marquee=null;
let guides=[];
let hoverId=null;     // 画布/图层行 hover 联动
let protoShow=true;   // 原型热点显示
const HANDLE_CUR={nw:'nwse-resize',se:'nwse-resize',ne:'nesw-resize',sw:'nesw-resize',n:'ns-resize',s:'ns-resize',e:'ew-resize',w:'ew-resize',move:'move'};

function hitHandle(sx,sy){
  {const q=unrotPt(sx,sy);sx=q.x;sy=q.y} // P12-D
  const ns=selNodes();
  if(!ns.length)return null;
  if(ns.some(n=>n.type==='artboard'||n.hidden||n.locked))return null;
  // P14：单选按自身 OBB；多选按联合包围盒（不旋转）
  const r=ns.length===1?worldRect(ns[0]):unionRect(ns);
  const rot=ns.length===1?(ns[0].rot||0):0;
  const pts=rectHandlePts(r,rot);
  for(const [d] of HANDLES){
    if(Math.abs(sx-pts[d].x)<=10&&Math.abs(sy-pts[d].y)<=10)return d;
  }
  return null;
}
/* P22：直线/箭头端点（世界坐标），对齐 Penpot 两端可拖拽调整长度与角度 */
function lineEndsWorld(n){
  const r=worldRect(n),slash=n.dir==='/';
  return slash
    ?[{x:r.x,y:r.y+r.h},{x:r.x+r.w,y:r.y}]
    :[{x:r.x,y:r.y},{x:r.x+r.w,y:r.y+r.h}];
}
function hitLineEnd(sx,sy){
  const n=single();
  if(!n||(n.type!=='line'&&n.type!=='arrow')||n.rot||n.hidden||n.locked)return 0;
  const es=lineEndsWorld(n);
  for(let i=0;i<2;i++){
    const p=w2s(es[i].x,es[i].y);
    if(Math.hypot(p.x-sx,p.y-sy)<=11)return i+1;
  }
  return 0;
}
/* P22：当前是否单选了一条未旋转的直线/箭头（这类节点用端点圆代替包围盒手柄） */
function lineSelNode(){
  const n=single();
  return n&&(n.type==='line'||n.type==='arrow')&&!n.rot&&!n.hidden&&!n.locked?n:null;
}
/* P14：祖先组是否隐藏（隐藏组内的成员不可见/不可交互） */
function hiddenByAncestor(n){
  let p=n.parent;
  while(p&&p.type!=='artboard'){if(p.hidden)return true;p=p.parent}
  return false;
}
const groupEntered=g=>state.enterGroup.includes(g.id);
/* P14：当前命中对象是否仍在已进入的组内 */
function insideEntered(n){
  if(!state.enterGroup.length)return true;
  let p=n.parent;
  while(p&&p.type!=='artboard'){
    if(state.enterGroup.includes(p.id))return true;
    p=p.parent;
  }
  return false;
}
/* P14：进入组，记录从根到该组的路径 */
function enterGroupNode(g){
  const path=[];let p=g;
  while(p&&p.type==='group'){path.unshift(p.id);p=p.parent}
  state.enterGroup=path;
}
/* P14：命中递归——未进组时命中成员即选中整组；进组后按层级粒度选择 */
function hitList(list,wx,wy,entered){
  for(let i=(list||[]).length-1;i>=0;i--){
    const n=list[i];
    if(n.hidden||n.locked)continue;
    if(n.type==='group'){
      if(entered){
        if(groupEntered(n)){const sub=hitList(n.children,wx,wy,true);if(sub)return sub}
        else{const sub=hitList(n.children,wx,wy,false);if(sub)return n}
      }else{
        const sub=hitList(n.children,wx,wy,false);if(sub)return n;
      }
    }else if(hitNode(n,wx,wy))return n;
  }
  return null;
}
function hitTest(wx,wy){
  const page=curPage();
  for(let i=page.artboards.length-1;i>=0;i--){
    const ab=page.artboards[i];
    if(ab.hidden||ab.locked)continue; // 隐藏画板不可见不可选；锁定画板整体不可选中
    if(wx<ab.x||wy<ab.y||wx>ab.x+ab.w||wy>ab.y+ab.h)continue;
    const entered=state.enterGroup.length>0;
    const n=hitList(ab.children,wx,wy,entered);
    if(n)return n;
    return ab;
  }
  /* P26：画板外的自由图层优先于空白画布被命中 */
  const nl=hitList(page.loose,wx,wy,state.enterGroup.length>0);
  if(nl)return nl;
  return null;
}
function setTool(k){
  state.tool=k;
  $$('#tools .tool-btn').forEach(b=>b.classList.toggle('active',b.dataset.tool===k));
  updateCursor();
}
function updateCursor(force){
  canvas.style.cursor=force??(state.space||state.tool==='hand'?'grab'
    :state.tool==='zoom'?ZOOM_CURSOR
    :(state.tool==='select'?'default':'crosshair'));
}

canvas.addEventListener('mousedown',e=>{
  // BUG-2 修复：阻止 mousedown 默认夺焦，保证文本工具单击创建后编辑气泡不被 blur 关闭（与 MasterGo/Figma 一致）
  e.preventDefault();
});
canvas.addEventListener('pointerdown',e=>{
  if(demo.on){demoDown(e);return} // P2
  if(e.button===2)return;
  hideTextEditor(true);
  const rect=canvas.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  zoomAnimId++; // 打断进行中的缩放动画
  // P12-D：Space+Shift 拖动 = 旋转视图
  if(state.space&&e.shiftKey){
    const c=vc();
    mode='vrotate';
    start={sx,sy,rot:viewRot,ang:Math.atan2(sy-c.y,sx-c.x)/DEG};
    updateCursor(ROT_CURSOR);return;
  }
  if(e.button===1||state.space||state.tool==='hand'){mode='pan';start={sx,sy,cx:cam.x,cy:cam.y};updateCursor('grabbing');return}
  // P12-D：缩放工具（单击放大/Alt 单击缩小，拖拽框选缩放）
  if(state.tool==='zoom'&&e.button===0){
    mode='zoomDrag';start={sx,sy,alt:e.altKey};
    marquee={x0:sx,y0:sy,x1:sx,y1:sy};drawSoon();return;
  }
  // P12-C：标尺拖出参考线 / 拖动已有参考线（拖回标尺即删除）——视图旋转时标尺隐藏，仅画布内可拖
  if(!viewRot&&(sy<RULER||sx<RULER)){
    const g=hitGuide(sx,sy);
    if(g){mode='guide';start={g,from:'line'};updateCursor(g.axis==='x'?'col-resize':'row-resize');return}
    if(sx<RULER&&sy<RULER)return; // 左上角块不响应
    /* P22 修复：顶部水平标尺拖出水平参考线（axis=y），左侧垂直标尺拖出垂直参考线（axis=x） */
    const axis=sx<RULER?'x':'y',w0=s2w(sx,sy),gg={axis,pos:axis==='x'?w0.x:w0.y};
    pageGuides().push(gg);state.showGuides=true;
    mode='guide';start={g:gg,from:'ruler'};drawSoon();return;
  }
  /* P22：直线/箭头端点手柄优先于参考线拖动（端点圆比参考线 4px 判定更明确） */
  if(state.tool==='select'&&!state.space){
    const le=hitLineEnd(sx,sy);
    if(le){
      const n=single(),par=n.parent?worldRect(n.parent):{x:0,y:0};
      mode='lineEnd';
      start={sx,sy,n,which:le,moved:false,parts:lineEndsWorld(n).map(p=>({x:p.x-par.x,y:p.y-par.y}))};
      updateCursor('crosshair');return;
    }
  }
  /* P24：渐变色标/端点手柄（选中元素后可直接在画布上拖拽） */
  if(state.tool==='select'&&!state.space){
    const gh2=gradHit(sx,sy);
    if(gh2){
      const f=gh2.f,st=Array.isArray(f.stops)?f.stops:gradStops(f);
      mode='grad';
      start={...gh2,moved:false,sx0:sx,sy0:sy,f,stops:st};
      updateCursor(gh2.kind==='stop'?'move':'crosshair');return;
    }
  }
  // P12-C：选择工具下可直接在画布上按住参考线拖动（优先于图层命中）
  if(state.tool==='select'){
    const gh=hitGuide(sx,sy);
    if(gh){mode='guide';start={g:gh,from:'line'};updateCursor(gh.axis==='x'?'col-resize':'row-resize');return}
  }
  if(cmtOpen)closeCommentBox(true); // P11：切换评论目标前先保存/关闭旧气泡

  if(state.tool==='comment'){
    const wpt=s2w(sx,sy);
    const pin=hitComment(sx,sy);
    if(!pin){const c={id:uid(),x:wpt.x,y:wpt.y,text:''};pageComments().push(c);openCommentBox(c)}
    else openCommentBox(pin);
    drawSoon();return;
  }

  if(state.tool!=='select'){
    const wpt=s2w(sx,sy);
    if(state.tool==='text'){
      // 点击即建文本并进入编辑；画板外同样可用（P26：自由图层）
      const ab=containingAb(wpt.x,wpt.y);
      const n=T({id:uid(),name:nextName('text'),text:'文本',
        x:ab?wpt.x-ab.x:wpt.x,y:ab?wpt.y-ab.y:wpt.y,fontSize:16,fontWeight:400,color:'#16233F'});
      if(ab){n.parent=ab;ab.children.push(n)}
      else{const pg=curPage();pg.loose=pg.loose||[];pg.loose.push(n);n.parent=null}
      state.sel.clear();state.sel.add(n.id);
      setTool('select');syncSelection();snapshot();startTextEdit(n,true);
      return;
    }
    if(state.tool==='frame'){mode='createAb';start={sx,sy,wx:wpt.x,wy:wpt.y,ab:containingAb(wpt.x,wpt.y)||null,alt:e.altKey};return}
    mode='create';start={sx,sy,wx:wpt.x,wy:wpt.y,ab:containingAb(wpt.x,wpt.y),alt:e.altKey};
    return;
  }

  // 选择工具
  const pinHit=hitComment(sx,sy);
  if(pinHit){openCommentBox(pinHit);return} // P11：选择工具下点击评论 pin 打开气泡
  const lbl=hitAbLabel(sx,sy); // 画板名称标签：拖动移动整块画板（对齐 MasterGo）
  if(lbl){
    state.sel.clear();state.sel.add(lbl.id);syncSelection();
    mode='moveAb';
    start={sx,sy,ab:lbl,ox:lbl.x,oy:lbl.y};
    return;
  }
  const hd=lineSelNode()?0:hitHandle(sx,sy);
  if(hd){
    const ns=selNodes();
    if(ns.length>1){ // P14：多选整体缩放
      const r=unionRect(ns);
      mode='handle';
      start={sx,sy,rect:r,h:hd,ns,p0:{x:r.x,y:r.y,w:r.w,h:r.h},fs:0,cands:collectGuides(ns),
        orig:dedupeRoots(ns).reduce((a,t)=>captureGeom(t,a),[])};
    }else{
      const n=ns[0],r=worldRect(n);
      mode='handle';
      start={sx,sy,rect:r,h:hd,n,p0:{x:r.x,y:r.y,w:r.w,h:r.h},fs:n.type==='text'?n.fontSize:0,cands:collectGuides(n),
        orig:n.type==='group'?captureGeom(n):null};
    }
    return;
  }
  // P12-A：角外旋转热区（手柄优先，避免抢占角点缩放）
  if(hitRotate(sx,sy)){
    const n=single(),r=worldRect(n),wpt=s2w(sx,sy);
    mode='rotate';
    start={n,cx:r.x+r.w/2,cy:r.y+r.h/2,rot:n.rot||0,ang:Math.atan2(wpt.y-(r.y+r.h/2),wpt.x-(r.x+r.w/2))/DEG};
    if(n.type==='group'){ // P14：组旋转 = 每个后代绕组中心旋转
      start.leafState=flattenLeaves(n.children).map(m=>{
        const w=worldRect(m);return{n:m,mx:w.x+w.w/2,my:w.y+w.h/2,rot:m.rot||0,ab:abOf(m),ox:m.x,oy:m.y};
      });
    }
    updateCursor(ROT_CURSOR);
    return;
  }
  const wpt=s2w(sx,sy);
  const hit=hitTest(wpt.x,wpt.y);
  /* P14：已选中的对象/组/多选，其包围盒内部（含组空白区）可直接拖动 */
  if(!hit||hit.type==='artboard'){
    const cur=selNodes();
    if(cur.length&&cur.every(n=>n.type!=='artboard')){
      const b=unionRect(cur);
      if(wpt.x>=b.x&&wpt.y>=b.y&&wpt.x<=b.x+b.w&&wpt.y<=b.y+b.h){
        mode='press';
        start={sx,sy,moved:false,pos:new Map(cur.map(n=>{const r=worldRect(n);return[n.id,{x:r.x,y:r.y}]}))};
        return;
      }
    }
  }
  if(hit){
    // P14：点到已进入组之外的对象时自动退出组
    if(state.enterGroup.length&&(hit.type==='artboard'||!insideEntered(hit)))state.enterGroup=[];
    if(e.shiftKey){state.sel.has(hit.id)?state.sel.delete(hit.id):state.sel.add(hit.id)}
    else if(!state.sel.has(hit.id)){state.sel.clear();state.sel.add(hit.id)}
    syncSelection();
    if(e.altKey&&hit.type!=='artboard'){snapshot();duplicateSel(0)} // P13：Alt 拖拽复制
    mode='press';
    start={sx,sy,moved:false,pos:new Map(selNodes().map(n=>{const r=worldRect(n);return[n.id,{x:r.x,y:r.y}]}))};
  }else{
    mode='marquee';
    start={sx,sy}; // BUG-1 修复：marquee 分支同样初始化拖拽起点，避免 pointermove 读取 start.sx 抛空指针
    marquee={x0:sx,y0:sy,x1:sx,y1:sy};
    state.enterGroup=[]; // P14：点空白退出组
    if(!e.shiftKey){state.sel.clear();syncSelection()}
  }
});
canvas.addEventListener('pointermove',e=>{
  if(demo.on){demoMove(e);return} // P2
  const rect=canvas.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  if(!mode){ // 悬停光标 + hover 高亮
    if(state.tool==='select'&&!state.space){
      if(!viewRot&&(sx<RULER||sy<RULER)){ // P12-C：标尺/参考线光标
        const g=hitGuide(sx,sy);
        updateCursor(g?(g.axis==='x'?'col-resize':'row-resize'):(sx<RULER&&sy<RULER?'default':(sy<RULER?'row-resize':'col-resize')));
        if(hoverId||hoverLabelId){hoverId=null;hoverLabelId=null;drawSoon()}
        return;
      }
      const lab=hitAbLabel(sx,sy);
      const hd=lab||lineSelNode()?null:hitHandle(sx,sy);
      const le=lab?0:hitLineEnd(sx,sy);
      // P12-A：角外悬停显示旋转光标
      updateCursor(lab?'move':(le?'crosshair':(hd?HANDLE_CUR[hd]:(hitRotate(sx,sy)?ROT_CURSOR:null))));
      const lid=lab?lab.id:null;
      if(lid!==hoverLabelId){hoverLabelId=lid;drawSoon()}
      if(lab)return;
      const wpt=s2w(sx,sy);
      const hit=hitTest(wpt.x,wpt.y);
      const hid=hit&&!state.sel.has(hit.id)?hit.id:null;
      if(hid!==hoverId){hoverId=hid;drawSoon()}
    }else if(hoverLabelId){hoverLabelId=null;drawSoon()}
    return;
  }
  if(mode==='lineEnd'){ // P22：拖动端点改长度/角度，另一端点固定
    const n=start.n,w0=s2w(sx,sy),par=n.parent?worldRect(n.parent):{x:0,y:0};
    const px=w0.x-par.x,py=w0.y-par.y,fixed=start.parts[start.which===1?1:0];
    n.x=Math.min(px,fixed.x);n.y=Math.min(py,fixed.y);
    n.w=Math.max(1,Math.abs(px-fixed.x));n.h=Math.max(1,Math.abs(py-fixed.y));
    n.dir=((px<=fixed.x)===(py<=fixed.y))?'\\':'/';
    start.moved=true;drawSoon();return;
  }
  if(mode==='guide'){ // P12-C：跟随指针，吸附画板边/中线
    const g=start.g,w0=s2w(sx,sy);
    g.pos=snapGuide(g.axis==='x'?w0.x:w0.y,g.axis);
    drawSoon();return;
  }
  if(mode==='vrotate'){ // P12-D：绕视口中心旋转视图
    const c=vc(),ang=Math.atan2(sy-c.y,sx-c.x)/DEG;
    setViewRot(start.rot+(ang-start.ang));
    return;
  }
  if(mode==='pan'){
    cam.x=start.cx+(sx-start.sx);cam.y=start.cy+(sy-start.sy);drawSoon();return;
  }
  const dx=sx-start.sx,dy=sy-start.sy;
  // P12-D：屏幕位移先反旋（视图旋转后拖拽方向仍与内容一致）
  const q0=unrotPt(start.sx,start.sy),q1=unrotPt(sx,sy);
  const dxu=q1.x-q0.x,dyu=q1.y-q0.y;
  if(mode==='press'){
    if(Math.abs(dx)>3||Math.abs(dy)>3){mode='move';guides=[];}
    else return;
  }
  if(mode==='move'){
    let dwx=dxu/cam.z,dwy=dyu/cam.z;
    const nodes=selNodes();
    /* P15：Shift 约束拖拽方向（锁定水平/垂直，对齐 Penpot） */
    const lock=e.shiftKey;
    if(lock){
      if(Math.abs(dwx)>=Math.abs(dwy))dwy=0;else dwx=0;
    }
    // 对齐吸附（仅单选、未旋转、无 Shift 约束时）
    let snapX=0,snapY=0;guides=[];
    let gxObj=false,gyObj=false;
    if(!lock&&nodes.length===1&&!(nodes[0].rot||0)){
      const n=nodes[0],p0=start.pos.get(n.id);
      // P23：拖动画板本体时，吸附其他画板边/中线（与拖动画板标题一致）
      const cand=n.type==='artboard'?abGuides(n):collectGuides(n);
      const bb={x:p0.x+dwx,y:p0.y+dwy,w:n.w,h:n.h};
      const res=snap(bb,cand);
      if(res.vx!=null){snapX=res.vx;gxObj=true;guides.push({v:true,x:res.gx*cam.z+cam.x})}
      if(res.hy!=null){snapY=res.hy;gyObj=true;guides.push({v:false,y:res.gy*cam.z+cam.y})}
    }
    // P14：以"累计位移"驱动，组递归平移后代（避免重复变换）
    let tx=dwx+snapX,ty=dwy+snapY,ap=start.applied||{x:0,y:0};
    /* P24：像素网格吸附（无对象吸附的轴才对齐网格，避免打断辅助线吸附） */
    if(state.snapGrid&&!lock&&nodes.length===1&&!(nodes[0].rot||0)){
      const p0=start.pos.get(nodes[0].id),gs=gridStep();
      if(p0){ // 有对象吸附的轴优先保留辅助线结果
        if(!gxObj)tx=Math.round((p0.x+tx)/gs)*gs-p0.x;
        if(!gyObj)ty=Math.round((p0.y+ty)/gs)*gs-p0.y;
      }
    }
    for(const n of effectiveSel())translateNode(n,tx-ap.x,ty-ap.y);
    start.applied={x:tx,y:ty};
    syncAllGroups();
    refreshPanelXY();drawSoon();return;
  }
  if(mode==='moveAb'){
    const ab=start.ab;
    let mx=dxu/cam.z,my=dyu/cam.z;
    if(e.shiftKey){if(Math.abs(mx)>=Math.abs(my))my=0;else mx=0;} // P15：Shift 约束方向
    let x=start.ox+mx,y=start.oy+my;
    /* P23：画板移动吸附其他画板的左/中/右、上/中/下，并显示吸附辅助线（对齐 Penpot） */
    let snapX=0,snapY=0,gt=[];guides=[];
    if(!e.altKey&&!e.shiftKey){
      const cand=abGuides(ab);
      const res=snap({x,y,w:ab.w,h:ab.h},cand);
      if(res.vx!=null){snapX=res.vx;gt.push({v:true,x:res.gx*cam.z+cam.x})}
      if(res.hy!=null){snapY=res.hy;gt.push({v:false,y:res.gy*cam.z+cam.y})}
    }
    const gs=state.snapGrid?gridStep():1; // P24：网格吸附
    ab.x=Math.round((x+snapX)/gs)*gs;ab.y=Math.round((y+snapY)/gs)*gs;
    guides=gt;
    refreshPanelXY();drawSoon();return;
  }
  /* P24：拖拽渐变色标 / 端点 */
  if(mode==='grad'){
    const q=unrotPt(sx,sy);
    const g=gradGeom(start.n,start.f);
    const wpt=s2w(sx,sy);
    const r=worldRect(start.n),cx=r.x+r.w/2,cy=r.y+r.h/2,rot=start.n.rot||0;
    const inv=(x,y)=>rotWorld(x,y,cx,cy,-rot);
    if(start.kind==='stop'){
      let t;
      if(g.kind==='linear'){
        const vx=g.p1.x-g.p0.x,vy=g.p1.y-g.p0.y,w2=vx*vx+vy*vy;
        t=w2?((q.x-g.p0.x)*vx+(q.y-g.p0.y)*vy)/w2:0;
      }else{
        t=g.r?Math.hypot(q.x-g.c.x,q.y-g.c.y)/g.r:0;
      }
      if(start.stops[start.j])start.stops[start.j].pos=Math.min(1,Math.max(0,t));
    }else if(start.kind==='p0'||start.kind==='p1'){
      const l=inv(wpt.x,wpt.y);
      let ang=Math.atan2(l.y-cy,l.x-cx)/DEG-rot;
      if(e.shiftKey)ang=Math.round(ang/15)*15;
      start.f.angle=((ang%360)+360)%360;
      const la=start.f.angle*DEG;
      const baseL=Math.max(1,(Math.abs(Math.cos(la))*r.w+Math.abs(Math.sin(la))*r.h)/2);
      start.f.len=Math.min(4,Math.max(.1,Math.hypot(l.x-cx,l.y-cy)/baseL));
    }else if(start.kind==='center'){
      const l=inv(wpt.x,wpt.y);
      start.f.rcx=Math.min(1,Math.max(-1,(l.x-cx)/Math.max(1,r.w/2)));
      start.f.rcy=Math.min(1,Math.max(-1,(l.y-cy)/Math.max(1,r.h/2)));
    }else if(start.kind==='radius'){
      start.f.rrad=Math.min(4,Math.max(.05,Math.hypot(wpt.x-cx,wpt.y-cy)/Math.max(1,Math.hypot(r.w,r.h)/2)));
    }
    start.moved=true;drawSoon();refreshPanelXY();return;
  }
  if(mode==='handle'){
    if(start.ns){ // P14：多选整体缩放
      resizeMultiByHandle(dxu/cam.z,dyu/cam.z,e);
    }else{
      const rot=start.n.rot||0;
      if(rot){ // 旋转后把手柄位移转回局部坐标系，缩放方向才与手柄一致
        const a=-rot*DEG,c=Math.cos(a),s=Math.sin(a),X=dxu/cam.z,Y=dyu/cam.z;
        resizeByHandle(X*c-Y*s,X*s+Y*c,e);
      }else resizeByHandle(dxu/cam.z,dyu/cam.z,e);
    }
    drawSoon();return;
  }
  if(mode==='rotate'){ // P12-A：绕中心旋转；P13：Shift 15° / Alt 45° 吸附
    const n=start.n,wpt=s2w(sx,sy);
    const ang=Math.atan2(wpt.y-start.cy,wpt.x-start.cx)/DEG;
    let r=start.rot+(ang-start.ang);
    if(e.altKey)r=Math.round(r/45)*45;
    else if(e.shiftKey)r=Math.round(r/15)*15;
    if(n.type==='group'&&start.leafState){ // P14：组旋转作用于全部后代
      applyGroupRotate(start,r-start.rot);
      syncAllGroups();
    }else n.rot=((r%360)+360)%360;
    refreshPanelXY();drawSoon();return;
  }
  if(mode==='marquee'||mode==='zoomDrag'){
    marquee.x1=sx;marquee.y1=sy;drawSoon();return;
  }
  if(mode==='create'||mode==='createAb'){
    let x1=start.sx+dx,y1=start.sy+dy;
    if(e.shiftKey){ // P15：Shift = 正方形/正圆；直线/箭头吸附 45°
      if(mode==='create'&&(state.tool==='line'||state.tool==='arrow')){
        const adx=Math.abs(dx),ady=Math.abs(dy);
        if(adx>ady*2)y1=start.sy;
        else if(ady>adx*2)x1=start.sx;
        else{const m=(adx+ady)/2;x1=start.sx+(dx<0?-m:m);y1=start.sy+(dy<0?-m:m)}
      }else{
        const m=Math.max(Math.abs(dx),Math.abs(dy));
        x1=start.sx+(dx<0?-m:m);y1=start.sy+(dy<0?-m:m);
      }
    }
    start.x1=x1;start.y1=y1;start.alt=e.altKey;start.shift=e.shiftKey;
    previewCreate();drawSoon();return;
  }
});
canvas.addEventListener('pointerup',e=>{
  if(demo.on){demoUp(e);return} // P2
  if(mode==='vrotate'){mode=null;updateCursor();drawSoon();return}
  if(mode==='zoomDrag'){ // P12-D：单击放大/Alt 单击缩小；拖拽则框选缩放
    const rc=canvas.getBoundingClientRect(),sx=e.clientX-rc.left,sy=e.clientY-rc.top;
    const x0=Math.min(marquee.x0,marquee.x1),x1=Math.max(marquee.x0,marquee.x1);
    const y0=Math.min(marquee.y0,marquee.y1),y1=Math.max(marquee.y0,marquee.y1);
    marquee=null;mode=null;updateCursor();
    if(x1-x0<6&&y1-y0<6){
      zoomTo(cam.z*(start.alt?1/1.6:1.6),sx,sy);
    }else{
      const wb=screenRectToWorld(x0,y0,x1,y1),w=wrap.clientWidth,h=wrap.clientHeight;
      const bw=Math.max(1,wb.x1-wb.x),bh=Math.max(1,wb.y1-wb.y);
      const z=clampZ(Math.min((w-40)/bw,(h-40)/bh));
      cam.z=z;cam.x=w/2-(wb.x+bw/2)*z;cam.y=h/2-(wb.y+bh/2)*z;drawSoon();
    }
    return;
  }
  if(mode==='lineEnd'){
    const moved=start.moved;mode=null;updateCursor();
    if(moved){snapshot();renderPanel()}
    drawSoon();return;
  }
  if(mode==='guide'){ // P12-C：松手落位；落在标尺内则删除该参考线
    mode=null;updateCursor();
    const rc=canvas.getBoundingClientRect(),sx=e.clientX-rc.left,sy=e.clientY-rc.top;
    if(!viewRot&&(sx<RULER||sy<RULER)){
      const gs=pageGuides(),i=gs.indexOf(start.g);if(i>=0)gs.splice(i,1);
    }
    snapshot();drawSoon();return;
  }
  if(mode==='pan'){mode=null;updateCursor();return}
  if(mode==='press'){mode=null;return} // 点击已选中：保持
  if(mode==='moveAb'){
    mode=null;guides=[]; // P23：清掉吸附辅助线
    const ab=start.ab;
    if(ab.x!==start.ox||ab.y!==start.oy){snapshot();renderPanel()} // 仅实际移动时入历史
    drawSoon();return;
  }
  if(mode==='move'){mode=null;guides=[];snapshot();renderPanel();drawSoon();return}
  if(mode==='grad'){mode=null;updateCursor();if(start&&start.moved){snapshot();renderPanel()}drawSoon();return}
  if(mode==='handle'){mode=null;guides=[];snapshot();renderPanel();drawSoon();return}
  if(mode==='rotate'){mode=null;updateCursor();snapshot();renderPanel();drawSoon();return}
  if(mode==='marquee'){
    const x0=Math.min(marquee.x0,marquee.x1),x1=Math.max(marquee.x0,marquee.x1);
    const y0=Math.min(marquee.y0,marquee.y1),y1=Math.max(marquee.y0,marquee.y1);
    if(x1-x0>2||y1-y0>2){
      const wb=screenRectToWorld(x0,y0,x1,y1); // P12-D：4 角反算，兼容视图旋转
      const walk=list=>{ // P14：递归框选——整组在框内则选组，否则下探成员
        for(const c of list||[]){
          if(c.hidden||c.locked)continue;
          const r=worldRect(c);
          if(c.type==='group'){
            const inside=r.x>=wb.x&&r.y>=wb.y&&r.x+r.w<=wb.x1&&r.y+r.h<=wb.y1;
            if(inside)state.sel.add(c.id);else walk(c.children);
          }else if(r.x<wb.x1&&r.y<wb.y1&&r.x+r.w>wb.x&&r.y+r.h>wb.y){
            state.sel.add(c.id);
          }
        }
      };
      for(const n of curPage().artboards){
        if(n.hidden||n.locked)continue; // 框选跳过隐藏/锁定画板
        walk(n.children);
      }
      walk(curPage().loose); // P26：画板外自由图层也参与框选
    }
    marquee=null;mode=null;syncSelection();return;
  }
  if(mode==='create'||mode==='createAb'){finishCreate();mode=null;return}
  mode=null;
});
canvas.addEventListener('dblclick',e=>{
  if(demo.on)return; // P2
  const rect=canvas.getBoundingClientRect();
  const wpt=s2w(e.clientX-rect.left,e.clientY-rect.top);
  let hit=hitTest(wpt.x,wpt.y);
  if(hit&&hit.type==='group'){ // P14：双击进组（逐层下探到叶子）
    let guard=0;
    while(hit&&hit.type==='group'&&guard++<8){
      enterGroupNode(hit);
      hit=hitTest(wpt.x,wpt.y);
    }
    let t=hit&&hit.type!=='artboard'?hit:null;
    if(!t){const gid=state.enterGroup[state.enterGroup.length-1];t=gid?nodeById(gid):null}
    if(t){
      state.sel.clear();state.sel.add(t.id);syncSelection();
      if(t.type==='text')startTextEdit(t,false);
    }
    return;
  }
  if(hit&&hit.type==='text'){
    state.sel.clear();state.sel.add(hit.id);syncSelection();
    startTextEdit(hit,false);
  }
});

function containingAb(wx,wy){
  for(let i=curPage().artboards.length-1;i>=0;i--){
    const ab=curPage().artboards[i];
    if(wx>=ab.x&&wy>=ab.y&&wx<=ab.x+ab.w&&wy<=ab.y+ab.h)return ab;
  }
  return null;
}
let preview=null; // {kind,ab,x,y,w,h,dxs,dys}
function previewCreate(){
  const x1=start.x1??start.sx,y1=start.y1??start.sy;
  const isLine=mode==='create'&&(state.tool==='line'||state.tool==='arrow');
  let sx0=start.sx,sy0=start.sy;
  if(start.alt&&!isLine){sx0=2*start.sx-x1;sy0=2*start.sy-y1} // P15：Alt 以按下点为创建中心
  const a=s2w(Math.min(sx0,x1),Math.min(sy0,y1));
  const b=s2w(Math.max(sx0,x1),Math.max(sy0,y1));
  /* P24：绘制时对齐像素网格 */
  let ax=a.x,ay=a.y,bx=b.x,by=b.y;
  if(state.snapGrid){
    const gs=gridStep();
    ax=Math.round(ax/gs)*gs;ay=Math.round(ay/gs)*gs;
    bx=Math.round(bx/gs)*gs;by=Math.round(by/gs)*gs;
  }
  preview={kind:mode==='createAb'?'artboard':state.tool,x:ax,y:ay,w:bx-ax,h:by-ay,ab:start.ab,
    dxs:x1-start.sx,dys:y1-start.sy};
}
// 预览叠加到 draw：简单方式——在 draw 后追加；为省事用覆盖绘制
const _draw=draw;
draw=function(){
  _draw();
  if(!preview)return;
  const p=w2s(preview.x,preview.y);
  if(preview.kind==='line'||preview.kind==='arrow'){
    if(Math.abs(preview.dxs)<2&&Math.abs(preview.dys)<2)return;
    const slash=preview.dxs*preview.dys<0;
    ctx.strokeStyle=BRAND;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();
    ctx.moveTo(slash?p.x+preview.w*cam.z:p.x,slash?p.y+preview.h*cam.z:p.y);
    ctx.lineTo(slash?p.x:p.x+preview.w*cam.z,slash?p.y:p.y+preview.h*cam.z);
    ctx.stroke();ctx.setLineDash([]);
  }else if(preview.w>2&&preview.h>2){
    ctx.strokeStyle=BRAND;ctx.setLineDash([4,3]);
    ctx.strokeRect(p.x,p.y,preview.w*cam.z,preview.h*cam.z);
    ctx.fillStyle='rgba(54,112,247,0.06)';ctx.fillRect(p.x,p.y,preview.w*cam.z,preview.h*cam.z);
    ctx.setLineDash([]);
  }
};
function finishCreate(){
  const pv=preview;preview=null;
  if(!pv)return;
  const w=Math.max(pv.w,0),h=Math.max(pv.h,0);
  if(pv.kind==='artboard'){
    const W=w>60?w:800,H=h>60?h:600;
    const ab=AB({id:uid(),name:nextName('artboard'),x:pv.x,y:pv.y,w:W,h:H});
    curPage().artboards.push(ab);layerOpen.add(ab.id);
    state.sel.clear();state.sel.add(ab.id);
    setTool('select');renderTree();syncSelection();snapshot();return;
  }
  const W=w>3?w:120,H=h>3?h:80;
  /* P26：没有画板时创建为画板外的自由图层（世界坐标、不属于任何画板） */
  const ab=pv.ab,ox=ab?ab.x:0,oy=ab?ab.y:0;
  let n;
  if(pv.kind==='rect')n=R({name:nextName('rect'),x:pv.x-ox,y:pv.y-oy,w:W,h:H});
  else if(pv.kind==='ellipse')n=E({name:nextName('ellipse'),x:pv.x-ox,y:pv.y-oy,w:W,h:H});
  else if(pv.kind==='para')n=T({name:nextName('text'),text:'段落文本',x:pv.x-ox,y:pv.y-oy,fontSize:14,w:W,align:null});
  else if(pv.kind==='line'||pv.kind==='arrow'){
    const dw=Math.abs(pv.dxs)>2?w:100,dh=Math.abs(pv.dxs)>2?Math.max(h,2):2;
    n=LN({name:nextName(pv.kind),x:pv.x-ox,y:pv.y-oy,w:dw,h:dh,
      dir:(pv.dxs*pv.dys<0?'/':'\\')},pv.kind);
  }
  else if(pv.kind==='polygon')n=PG({name:nextName('polygon'),x:pv.x-ox,y:pv.y-oy,w:W,h:H});
  else if(pv.kind==='star')n=ST({name:nextName('star'),x:pv.x-ox,y:pv.y-oy,w:W,h:H});
  else n=R({name:nextName('rect'),x:pv.x-ox,y:pv.y-oy,w:W,h:H});
  n.id=uid();n.parent=ab||null;
  if(ab)ab.children.push(n);
  else{const pg=curPage();pg.loose=pg.loose||[];pg.loose.push(n)}
  state.sel.clear();state.sel.add(n.id);
  setTool('select');syncSelection();snapshot();
}
function resizeByHandle(dwx,dwy,ev){
  const n=start.n,p=start.p0,h=start.h;
  const shift=!!(ev&&ev.shiftKey),alt=!!(ev&&ev.altKey);
  // 缩放吸附：移动边贴齐参考线（TOL=4px 屏幕）；P13：Shift/Alt 修饰键时关闭
  const TOL=4/cam.z;
  const adj=(v,list)=>{let best=v,bd=TOL;for(const c of list){const d=Math.abs(v-c);if(d<bd){bd=d;best=c}}return best};
  guides=[];
  const rot=n.rot||0;
  if(!rot&&!shift&&!alt){ // 旋转后轴向参考线不再成立，跳过缩放吸附
    if(h.includes('e')){const e=adj(p.x+p.w+dwx,start.cands.xs);if(e!==p.x+p.w+dwx)guides.push({v:true,x:e*cam.z+cam.x});dwx=e-(p.x+p.w)}
    if(h.includes('s')){const e=adj(p.y+p.h+dwy,start.cands.ys);if(e!==p.y+p.h+dwy)guides.push({v:false,y:e*cam.z+cam.y});dwy=e-(p.y+p.h)}
    if(h.includes('w')){const e=adj(p.x+dwx,start.cands.xs);if(e!==p.x+dwx)guides.push({v:true,x:e*cam.z+cam.x});dwx=e-p.x}
    if(h.includes('n')){const e=adj(p.y+dwy,start.cands.ys);if(e!==p.y+dwy)guides.push({v:false,y:e*cam.z+cam.y});dwy=e-p.y}
  }
  let x=p.x,y=p.y,w=p.w,hh=p.h;
  const cx=p.x+p.w/2,cy=p.y+p.h/2;
  if(alt){ // P13：Alt = 以中心为基准缩放
    if(h.includes('e'))w=p.w+2*dwx;
    if(h.includes('w'))w=p.w-2*dwx;
    if(h.includes('s'))hh=p.h+2*dwy;
    if(h.includes('n'))hh=p.h-2*dwy;
    x=cx-w/2;y=cy-hh/2;
  }else{
    if(h.includes('e'))w=p.w+dwx;
    if(h.includes('s'))hh=p.h+dwy;
    if(h.includes('w')){x=p.x+dwx;w=p.w-dwx}
    if(h.includes('n')){y=p.y+dwy;hh=p.h-dwy}
  }
  if(shift&&h.length===2&&p.w>0&&p.h>0){ // P13：Shift = 等比缩放（保持起始宽高比）
    const f=Math.max(w/p.w,hh/p.h);
    w=p.w*f;hh=p.h*f;
    if(alt){x=cx-w/2;y=cy-hh/2}
    else{
      if(h.includes('w'))x=p.x+p.w-w;
      if(h.includes('n'))y=p.y+p.h-hh;
    }
  }
  if(w<1){if(h.includes('w')&&!alt)x=p.x+p.w-1;else if(alt)x=cx-.5;w=1}
  if(hh<1){if(h.includes('n')&&!alt)y=p.y+p.h-1;else if(alt)y=cy-.5;hh=1}
  if(rot){ // 旋转态：让对角锚点在世界上保持不动（中心位移按旋转角旋转）
    const p0c={x:p.x+p.w/2,y:p.y+p.h/2};
    const dcx=(x+w/2)-p0c.x,dcy=(y+hh/2)-p0c.y;
    const ca=Math.cos(rot*DEG),sa=Math.sin(rot*DEG);
    const wc={x:p0c.x+dcx*ca-dcy*sa,y:p0c.y+dcx*sa+dcy*ca};
    x=wc.x-w/2;y=wc.y-hh/2;
  }
  if(n.type==='group'){ // P14：组缩放 = 后代按包围盒比例缩放
    restoreGeom(start.orig);
    scaleNodeInBox(n,{x:p.x,y:p.y,w:p.w,h:p.h},{x,y,w,h:hh});
    syncAllGroups();refreshPanelXY();return;
  }
  const p2=abOf(n);
  if(p2){n.x=x-p2.x;n.y=y-p2.y}else{n.x=x;n.y=y}
  n.w=w;n.h=hh;
  if(n.type==='text'&&start.fs){
    if(h.length===2)n.fontSize=Math.max(4,start.fs*(w/start.p0.w));
    n.w=measureText(n).w;n.h=measureText(n).h;
  }
  refreshPanelXY();
}
/* P14：拖拽开始时记录几何快照，缩放每帧从原始值重算（避免连续叠加） */
function captureGeom(n,out){
  out=out||[];
  out.push({n,x:n.x,y:n.y,w:n.w,h:n.h,rot:n.rot,fs:n.fontSize,rad:n.radius,rc:n.rc?n.rc.slice():null});
  for(const c of n.children||[])captureGeom(c,out);
  return out;
}
function restoreGeom(arr){
  for(const s of arr||[]){
    s.n.x=s.x;s.n.y=s.y;s.n.w=s.w;s.n.h=s.h;s.n.rot=s.rot;
    if(s.fs!=null)s.n.fontSize=s.fs;
    if(s.rad!=null)s.n.radius=s.rad;
    if(s.rc)s.n.rc=s.rc.slice();else delete s.n.rc;
  }
}
/* P14：把节点（含组后代）从旧包围盒 ob 映射到新包围盒 nb（世界坐标） */
function scaleNodeInBox(n,ob,nb){
  const ab=abOf(n),ox=ab?ab.x:0,oy=ab?ab.y:0;
  const sx=ob.w?nb.w/ob.w:1,sy=ob.h?nb.h/ob.h:1;
  const ox0=ob.x-ox,oy0=ob.y-oy,nx0=nb.x-ox,ny0=nb.y-oy;
  const one=m=>{
    m.x=nx0+(m.x-ox0)*sx;m.y=ny0+(m.y-oy0)*sy;
    if(m.type==='group'){m.w*=sx;m.h*=sy;for(const c of m.children||[])one(c);return}
    m.w=Math.max(1,m.w*sx);m.h=Math.max(1,m.h*sy);
    if(m.type==='text')m.fontSize=Math.max(4,m.fontSize*Math.min(sx,sy));
    if(m.type==='rect'){
      const f=Math.min(sx,sy);
      if(m.radius)m.radius*=f;
      if(m.rc)m.rc=m.rc.map(v=>v*f);
    }
  };
  one(n);
}
/* P14：多选整体缩放（同一套手柄数学，无吸附/无旋转） */
function resizeMultiByHandle(dwx,dwy,ev){
  const p=start.p0,h=start.h;
  const shift=!!(ev&&ev.shiftKey),alt=!!(ev&&ev.altKey);
  let x=p.x,y=p.y,w=p.w,hh=p.h;
  const cx=p.x+p.w/2,cy=p.y+p.h/2;
  if(alt){
    if(h.includes('e'))w=p.w+2*dwx;
    if(h.includes('w'))w=p.w-2*dwx;
    if(h.includes('s'))hh=p.h+2*dwy;
    if(h.includes('n'))hh=p.h-2*dwy;
    x=cx-w/2;y=cy-hh/2;
  }else{
    if(h.includes('e'))w=p.w+dwx;
    if(h.includes('s'))hh=p.h+dwy;
    if(h.includes('w')){x=p.x+dwx;w=p.w-dwx}
    if(h.includes('n')){y=p.y+dwy;hh=p.h-dwy}
  }
  if(shift&&h.length===2&&p.w>0&&p.h>0){
    const f=Math.max(w/p.w,hh/p.h);
    w=p.w*f;hh=p.h*f;
    if(alt){x=cx-w/2;y=cy-hh/2}
    else{if(h.includes('w'))x=p.x+p.w-w;if(h.includes('n'))y=p.y+p.h-hh}
  }
  w=Math.max(1,w);hh=Math.max(1,hh);
  guides=[];
  restoreGeom(start.orig);
  for(const n of dedupeRoots(start.ns))scaleNodeInBox(n,p,{x,y,w,h:hh});
  syncAllGroups();refreshPanelXY();
}
/* P14：组旋转——每个后代绕组中心整体旋转 */
function applyGroupRotate(st,delta){
  const a=delta*DEG,ca=Math.cos(a),sa=Math.sin(a);
  for(const s of st.leafState||[]){
    const dx=s.mx-st.cx,dy=s.my-st.cy;
    const mx=st.cx+dx*ca-dy*sa,my=st.cy+dx*sa+dy*ca;
    const ax=s.ab?s.ab.x:0,ay=s.ab?s.ab.y:0;
    s.n.x=mx-s.n.w/2-ax;s.n.y=my-s.n.h/2-ay;
    s.n.rot=((s.rot+delta)%360+360)%360;
  }
}
function dedupeRoots(ns){
  const ids=new Set(ns.map(n=>n.id));
  return ns.filter(n=>{let p=n.parent;while(p&&p.type!=='artboard'){if(ids.has(p.id))return false;p=p.parent}return true});
}
/* P14：把当前选区编组（同画板内） */
function groupSelection(){
  const ns=dedupeRoots(selNodes()).filter(n=>n.type!=='artboard');
  if(ns.length<2){toast('请选择至少两个图层');return}
  const ab=abOf(ns[0]);
  if(!ab||ns.some(n=>abOf(n)!==ab)){toast('暂支持同画板内编组');return}
  const sameParent=ns.every(n=>n.parent===ns[0].parent);
  const container=sameParent?ns[0].parent:ab;
  const list=container.children;
  const zIndex=new Map(allNodes().map((n,i)=>[n.id,i]));
  const ordered=[...ns].sort((a,b)=>(zIndex.get(a.id)||0)-(zIndex.get(b.id)||0));
  const idxs=ns.map(n=>list.indexOf(n)).filter(i=>i>=0);
  const insertAt=sameParent&&idxs.length===ns.length?Math.max(...idxs)-(ns.length-1):list.length;
  for(const n of ordered){const pl=n.parent.children,i=pl.indexOf(n);if(i>=0)pl.splice(i,1)}
  const g={id:uid(),type:'group',name:nextName('group'),x:0,y:0,w:0,h:0,parent:container,children:[]};
  for(const n of ordered){n.parent=g;g.children.push(n)}
  list.splice(Math.max(0,Math.min(list.length,insertAt)),0,g);
  syncGroupRect(g);
  layerKnown.add(g.id);layerOpen.add(g.id); // 新组默认展开
  state.sel=new Set([g.id]);
  snapshot();syncSelection();toast('已编组');
}
/* P14：解组——子节点回到组所在层级并整体选中 */
function ungroupSelection(){
  const gs=selNodes().filter(n=>n.type==='group');
  if(!gs.length){toast('请先选中组');return}
  const newSel=[];
  for(const g of gs){
    const pl=g.parent.children,i=pl.indexOf(g);if(i<0)continue;
    const kids=g.children||[];
    for(const k of kids){k.parent=g.parent;newSel.push(k.id)}
    pl.splice(i,1,...kids);
  }
  state.enterGroup=state.enterGroup.filter(id=>!!nodeById(id));
  if(newSel.length)state.sel=new Set(newSel);
  snapshot();syncSelection();toast('已解组');
}
/* P23：画板移动吸附候选线（其他画板的左/中/右、上/中/下） */
function abGuides(except){
  const xs=[],ys=[];
  for(const ab of curPage().artboards){
    if(ab===except||ab.hidden)continue;
    xs.push(ab.x,ab.x+ab.w/2,ab.x+ab.w);
    ys.push(ab.y,ab.y+ab.h/2,ab.y+ab.h);
  }
  return{xs,ys};
}
function collectGuides(sel){
  const ns=Array.isArray(sel)?sel:[sel];
  const ex=new Set();
  const mark=n=>{ex.add(n.id);for(const c of n.children||[])mark(c)};
  ns.forEach(mark); // 排除自身与组内后代，避免吸附到自己的成员
  const xs=[],ys=[];
  for(const o of allNodes()){
    if(ex.has(o.id)||o.type==='artboard')continue;
    const ro=worldRect(o);
    xs.push(ro.x,ro.x+ro.w/2,ro.x+ro.w);
    ys.push(ro.y,ro.y+ro.h/2,ro.y+ro.h);
  }
  for(const ab of curPage().artboards){xs.push(ab.x,ab.x+ab.w/2,ab.x+ab.w);ys.push(ab.y,ab.y+ab.h/2,ab.y+ab.h)}
  return{xs,ys};
}
function snap(bb,cand){
  const TOL=4/cam.z;let vx=null,hy=null,gx=null,gy=null,bd=TOL;
  const sx=[bb.x,bb.x+bb.w/2,bb.x+bb.w];
  for(const s of sx)for(const c of cand.xs){const d=Math.abs(s-c);if(d<bd){bd=d;vx=c-s;gx=c}}
  bd=TOL;const sy=[bb.y,bb.y+bb.h/2,bb.y+bb.h];
  const ys=cand.ys||[];
  for(const s of sy)for(const c of ys){const d=Math.abs(s-c);if(d<bd){bd=d;hy=c-s;gy=c}}
  return{vx,hy,gx,gy};
}
function refreshPanelXY(){
  const n=single();if(!n)return;
  const r=worldRect(n);
  const map={x:r.x,y:r.y,w:n.w,h:n.h,rot:n.rot||0};
  for(const k of['x','y','w','h','rot']){
    const inp=$(`#panel [data-k="${k}"]`);
    if(inp&&document.activeElement!==inp)inp.value=Math.round(map[k]);
  }
}

/* ---------------- 滚轮：平移 / Ctrl 缩放（指针锚点，旋转感知） / Shift 横移 ---------------- */
canvas.addEventListener('wheel',e=>{

/* ---------------- 文本编辑覆盖层 ---------------- */
const tEd=$('#textEditor');let editing=null;
function startTextEdit(n,selectAll){
  if(editing)commitTextEdit();
  editing=n;
  const r=worldRect(n),p0=w2s(r.x,r.y),p=rotPt(p0.x,p0.y); // P12-D：文本框跟随视图旋转
  tEd.style.display='block';
  tEd.style.left=p.x+'px';tEd.style.top=p.y+'px';
  tEd.style.width=Math.max(60,n.w*cam.z)+'px';
  tEd.style.height=Math.max(24,n.h*cam.z+4)+'px';
  tEd.style.fontSize=n.fontSize*cam.z+'px';
  tEd.style.lineHeight=(n.fontSize*1.4*cam.z)+'px';
  tEd.style.fontWeight=n.fontWeight;
  tEd.style.textAlign=n.align==='center'?'center':n.align==='right'?'right':'left';
  tEd.style.color=n.color;
  const rotSum=viewRot+(n.rot||0);
  if(viewRot){
    const c0=vc();
    tEd.style.transformOrigin=`${c0.x-p.x}px ${c0.y-p.y}px`;
    tEd.style.transform=rotSum?`rotate(${rotSum}deg)`:'none';
  }else{
    tEd.style.transformOrigin='';
    tEd.style.transform=n.rot?`rotate(${n.rot}deg)`:'none';
  }
  tEd.value=n.text;
  tEd.focus();
  if(selectAll)tEd.select();
}
function commitTextEdit(){
  if(!editing)return;
  if(tEd.value!==editing.text){
    editing.text=tEd.value;
    const m=measureText(editing);
    if(!editing.align){editing.w=m.w;editing.h=m.h}
    snapshot();
  }
  editing=null;tEd.style.display='none';
  drawSoon();renderPanel();
}
function hideTextEditor(silent){
  if(editing){
    if(silent&&tEd.value!==editing.text){editing.text=tEd.value;const m=measureText(editing);if(!editing.align){editing.w=m.w;editing.h=m.h}snapshot()}
    editing=null;tEd.style.display='none';drawSoon();
  }
}
tEd.addEventListener('blur',()=>commitTextEdit());
tEd.addEventListener('keydown',e=>{
  e.stopPropagation();
  if(e.key==='Escape'){editing=null;tEd.style.display='none';drawSoon()}
});

/* ---------------- 键盘 ---------------- */
window.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(demo.on){ // P2/P20：演示模式键盘（翻页 / 缩放 / 全屏 / 缩略图）
    if(e.key==='Escape'){
      if(demo.overlays.length){demoCloseOverlay();updateDemoIdx()}
      else demoExit();
    }
    else if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();demoBack()}
    else if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();demoForward()}
    else if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();demoStep(1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();demoStep(-1)}
    else if(e.key==='+'||e.key==='='){e.preventDefault();demoSetZoom(demo.zoom*1.2)}
    else if(e.key==='-'){e.preventDefault();demoSetZoom(demo.zoom/1.2)}
    else if(e.key==='0'){e.preventDefault();demoFit();drawSoon()}
    else if(e.key.toLowerCase()==='f'){e.preventDefault();toggleDemoFullscreen()}
    else if(e.key.toLowerCase()==='t'){e.preventDefault();toggleDemoThumbs()}
    return;
  }
  /* P21：Ctrl+F / Ctrl+H 查找替换，Tab 隐藏 UI */
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();openFind(false);return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='h'){e.preventDefault();openFind(true);return}
  if(e.key==='Tab'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();toggleHideUI();return}
  if(e.code==='Space'){state.space=true;updateCursor('grab');e.preventDefault();return}
  /* P12-D：视图旋转 Alt+Shift+←/→（每次 15°），Alt+Shift+0 复位 */
  if(e.altKey&&e.shiftKey){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
      e.preventDefault();
      setViewRot(viewRot+(e.key==='ArrowRight'?15:-15));return;
    }
    if(e.code==='Digit0'){e.preventDefault();setViewRot(0);return}
  }
  /* P10/P11：子菜单键盘导航（对齐 MasterGo：↑↓ 移动、Enter 选中、Esc 关闭），作用于当前打开的菜单 */
  if(activeMenu){
    const items=[...activeMenu.querySelectorAll('.smi')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(!items.length)return;
      let i=items.indexOf(activeMenu.querySelector('.smi.kbd'));
      i=i<0?(e.key==='ArrowDown'?0:items.length-1):(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
      items.forEach(x=>x.classList.remove('kbd'));
      items[i].classList.add('kbd');
      return;
    }
    if(e.key==='Enter'){
      const it=activeMenu.querySelector('.smi.kbd');
      if(it){e.preventDefault();(activeMenu===shapeMenu?pickShape:pickText)(it.dataset.shape)}
      return;
    }
    if(e.key==='Escape'){closeMenu();return}
  }
  if(e.key==='Escape'&&!findBar.hidden){closeFind();return}
  if(e.key==='Escape'&&!$('#exportDlg').hidden){closeExportDlg();return}
  if(e.key==='Escape'){
    /* P15：Esc 取消进行中的拖拽/创建，恢复起始几何（对齐 Penpot） */
    if(mode){
      if(mode==='create'||mode==='createAb'){preview=null;setTool('select')}
      else if(mode==='move'&&start&&start.pos){
        for(const n of selNodes()){const p=start.pos.get(n.id);if(!p)continue;const r=worldRect(n);translateNode(n,p.x-r.x,p.y-r.y)}
        syncAllGroups();
      }
      else if(mode==='moveAb'&&start&&start.ab){start.ab.x=start.ox;start.ab.y=start.oy}
      else if(mode==='handle'){
        if(start&&start.orig)restoreGeom(start.orig);
        else if(start&&start.n&&start.p0){
          const n=start.n,ab=abOf(n);
          n.x=start.p0.x-(ab?ab.x:0);n.y=start.p0.y-(ab?ab.y:0);n.w=start.p0.w;n.h=start.p0.h;
          if(n.type==='text'&&start.fs)n.fontSize=start.fs;
        }
      }
      else if(mode==='rotate'&&start&&start.n){
        if(start.leafState){for(const s of start.leafState){s.n.x=s.ox;s.n.y=s.oy;s.n.rot=s.rot}}
        else start.n.rot=start.rot;
      }
      mode=null;marquee=null;guides=[];updateCursor();refreshPanelXY();drawSoon();return;
    }
    if(cmtOpen){closeCommentBox(true);return} // P11：先收评论气泡
    if(state.tool==='comment'){setTool('select');return} // P11：Esc 退出评论模式
    if(state.enterGroup.length){ // P14：逐级退出组并选中该组
      const gid=state.enterGroup.pop(),g=nodeById(gid);
      if(g){state.sel=new Set([g.id]);syncSelection()}
      drawSoon();return;
    }
    if(marquee){marquee=null;mode=null;drawSoon()}
    else if(state.sel.size){state.sel.clear();syncSelection()}
    return;
  }
  /* P12-A：方向键微调（1px，Shift/Alt 10px）——对齐 Penpot nudge */
  if(e.key.startsWith('Arrow')){
    const ns=effectiveSel();
    if(ns.length){
      e.preventDefault();
      const step=(e.shiftKey||e.altKey)?10:1;
      const dx=e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0;
      const dy=e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0;
      ns.forEach(n=>translateNode(n,dx,dy));
      syncAllGroups();snapshot();refreshPanelXY();drawSoon();
    }
    return;
  }
  const key=e.key.toLowerCase();
  /* P12-D：缩放快捷键 Shift+0=100% / Shift+1=适配 / Shift+2=选中；Ctrl+= / Ctrl+- */
  if(!e.ctrlKey&&!e.metaKey&&e.shiftKey&&e.code==='Digit0'){e.preventDefault();zoomAnchor(1);return}
  if(!e.ctrlKey&&!e.metaKey&&e.shiftKey&&e.code==='Digit1'){e.preventDefault();fitView();return}
  if(!e.ctrlKey&&!e.metaKey&&e.shiftKey&&e.code==='Digit2'){e.preventDefault();zoomToSel();return}
  if((e.ctrlKey||e.metaKey)&&e.code==='Equal'){e.preventDefault();zoomAnchor(cam.z*1.3);return}
  if((e.ctrlKey||e.metaKey)&&e.code==='Minus'){e.preventDefault();zoomAnchor(cam.z/1.3);return}
  /* P12-C：Shift+G 像素网格 / Shift+R 参考线 */
  if(!e.ctrlKey&&!e.metaKey&&e.shiftKey&&key==='g'){state.pixelGrid=!state.pixelGrid;drawSoon();return}
  if(!e.ctrlKey&&!e.metaKey&&e.shiftKey&&key==='r'){state.showGuides=!state.showGuides;drawSoon();return}
  /* P31：Shift+D 深浅主题 / Ctrl+Alt+K 创建组件（对齐 Penpot） */
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.shiftKey&&key==='d'){e.preventDefault();toggleTheme();return}
  if((e.ctrlKey||e.metaKey)&&e.altKey&&key==='k'){e.preventDefault();createComponent(single());return}
  /* P15：字母快捷键并轨 Penpot（V/B/R/E/T/P/L/C），并保留 F/O/A/H/Z 旧别名 */
  const map={v:'select',b:'frame',f:'frame',r:'rect',e:'ellipse',o:'ellipse',t:'text',p:'para',a:'para',l:'line',h:'hand',z:'zoom',c:'comment'};
  if(map[key]&&!e.ctrlKey&&!e.metaKey){
    const k=map[key];
    // 形状/文本走子菜单入口，保证主按钮图标、提示与高亮同步
    if(k==='rect'||k==='line'||k==='ellipse')pickShape(k);
    else if(k==='text'||k==='para')pickText(k);
    else setTool(k);
    return;
  }
  /* P14：Ctrl+G 编组 / Ctrl+Shift+G 解组 / Ctrl+A 全选（顶层图层） */
  if((e.ctrlKey||e.metaKey)&&key==='g'){e.preventDefault();e.shiftKey?ungroupSelection():groupSelection();return}
  if((e.ctrlKey||e.metaKey)&&key==='a'){e.preventDefault();selectAllAll();return}
  /* P20：层级快捷键 Ctrl+] / Ctrl+[，加 Shift 直接置顶/置底（对齐 Penpot） */
  if((e.ctrlKey||e.metaKey)&&(e.key===']'||e.key==='[')){
    e.preventDefault();
    zorder(e.key===']'?(e.shiftKey?'top':'up'):(e.shiftKey?'bottom':'down'));
    return;
  }
  /* P20：剪贴板 Ctrl+C / Ctrl+X / Ctrl+V */
  if((e.ctrlKey||e.metaKey)&&key==='c'){e.preventDefault();copySel();return}
  if((e.ctrlKey||e.metaKey)&&key==='x'){e.preventDefault();copySel(true);return}
  if((e.ctrlKey||e.metaKey)&&key==='v'){e.preventDefault();pasteSel();return}
  if((e.ctrlKey||e.metaKey)&&key==='s'){e.preventDefault();saveDoc(e.shiftKey);return}
  if((e.ctrlKey||e.metaKey)&&key==='o'){e.preventDefault();openDoc();return}
  if((e.ctrlKey||e.metaKey)&&(key==='z'||key==='y')){
    e.preventDefault();
    if(key==='y'||e.shiftKey)redo();else undo();
    return;
  }
  if((e.key==='Delete'||e.key==='Backspace')&&state.sel.size){
    for(const id of state.sel){
      const n=nodeById(id);if(!n)continue;
      if(n.type==='artboard'){
        const arr=curPage().artboards;arr.splice(arr.indexOf(n),1);
      }else{
        const c=n.parent.children;c.splice(c.indexOf(n),1);
      }
    }
    state.sel.clear();state.enterGroup=state.enterGroup.filter(id=>!!nodeById(id));syncAllGroups();syncSelection();snapshot();toast('已删除');
    return;
  }
  if(key==='d'&&(e.ctrlKey||e.metaKey)){
    e.preventDefault();
    if(duplicateSel(16).length)snapshot();
  }
});

function setZoomCenter(z){

function fitView(keepZ){
  const ars=curPage().artboards;
  if(!ars.length)return;
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const ab of ars){x1=Math.min(x1,ab.x);y1=Math.min(y1,ab.y);x2=Math.max(x2,ab.x+ab.w);y2=Math.max(y2,ab.y+ab.h)}
  const w=wrap.clientWidth,h=wrap.clientHeight;
  const z=keepZ?cam.z:Math.min((w-160)/(x2-x1),(h-160)/(y2-y1),1);
  cam.z=keepZ?cam.z:Math.max(0.01,z);
  if(keepZ){
    cam.x=w/2-((x1+x2)/2)*cam.z;cam.y=h/2-((y1+y2)/2)*cam.z;
  }else{
    cam.x=(w-(x2-x1)*cam.z)/2-x1*cam.z;cam.y=(h-(y2-y1)*cam.z)/2-y1*cam.z;
  }
  drawSoon();
}

/* ================================================================
 * P1 文件层：.prototype.html = 编辑器 + 文档（单文件即软件）
 * 文档 JSON 内嵌于 <script type="application/json" id="__doc">，
 * 变更即回写 DOM；保存时以启动纯净模板（PRISTINE_HTML）为壳回填最新 JSON。
 * ================================================================ */
let fileHandle=null; // File System Access API 句柄（打开/另存后可原地覆盖保存）
let fileName=detectFileName();
let docTitle=''; // V6：文档内嵌名（__doc.name），面包屑显示优先于文件名
const DEFAULT_NAME='默认名称'; // 文档标题缺省值（物理文件名仅用于下载/另存，不参与显示）
function detectFileName(){
  try{
    if(location.protocol==='file:'){
      const n=decodeURIComponent(location.pathname.split('/').pop()||'');
      if(/\.html?$/i.test(n))return n;
    }
  }catch(e){}
  return '未命名原型.prototype.html';
}
function persistDoc(){
  if(!docEl)return;
  const meta=docTitle?{name:docTitle}:{}; // V6：保存时保留文档内嵌名，避免重开丢名
  docEl.textContent=JSON.stringify({version:DOC_VER,...meta,theme:uiTheme,pages,tree},(k,v)=>k==='parent'?undefined:v);
}
function bumpUidFromDoc(){
  let mx=__uid;
  const scan=n=>{const m=/^n(\d+)$/.exec(String(n.id||''));if(m)mx=Math.max(mx,+m[1])};
  const walk=list=>{for(const n of list||[]){scan(n);if(n.children)walk(n.children)}};
  pages.forEach(p=>p.artboards.forEach(ab=>{scan(ab);walk(ab.children)}));
  __uid=mx;
}
function linkParents(){
  const fix=(list,parent)=>{for(const n of list||[]){n.parent=parent;if(n.children)fix(n.children,n)}};
  pages.forEach(p=>p.artboards.forEach(ab=>fix(ab.children,ab)));
}
function bootDoc(){
  let doc=null;
  if(docEl&&docEl.textContent.trim()){
    try{doc=JSON.parse(docEl.textContent)}catch(e){console.warn('__doc 解析失败，回退默认文档',e)}
  }
  if(!doc||!Array.isArray(doc.pages)||!doc.pages.length)doc=defaultDoc();
  docTitle=doc.name||''; // V6：读取文档内嵌名
  docTheme=doc.theme==='dark'?'dark':(doc.theme==='light'?'light':themeFromStore()); // P31
  pages=doc.pages;
  tree=Array.isArray(doc.tree)&&doc.tree.length?doc.tree:pages.map((p,i)=>({label:p.name,page:i}));
  linkParents();bumpUidFromDoc();
  ensureCompPage(); // P5：组件库页自举（旧文档自动补齐母版）
  state.page=Math.min(state.page,pages.length-1);
}
/* ---- 载入（打开文件 / 拖拽 / 新建共用） ---- */
function extractDoc(text){
  const m=text.match(/<script type="application\/json" id="__doc">([\s\S]*?)<\/script>/);
  if(!m)return null;
  try{return JSON.parse(m[1])}catch(e){return null}
}
function applyDoc(doc){
  history.lock=true;
  docTitle=doc.name||''; // V6：跟随所载文档，刷新面包屑
  applyTheme(doc.theme==='dark'?'dark':(doc.theme==='light'?'light':uiTheme)); // P31
  pages=doc.pages;
  tree=Array.isArray(doc.tree)&&doc.tree.length?doc.tree:pages.map((p,i)=>({label:p.name,page:i}));
  linkParents();bumpUidFromDoc();
  ensureCompPage(); // P5：打开旧文件时补齐组件库
  state.page=0;state.sel=new Set();
  cmtOpen=null;$('#commentBox').style.display='none'; // P27
  hideTextEditor(true);
  history.stack=[];history.idx=-1;
  renderTree();renderLayers();renderPanel();fitView();
  refreshDocTitle(); // V6：打开/拖入文档后同步面包屑与标题
  history.lock=false;
  snapshot(); // 新基线
}

/* ---- 保存：句柄直写覆盖 → 系统另存 → 下载兜底 ---- */
function buildFile(){
  const json=JSON.stringify({version:DOC_VER,theme:uiTheme,pages,tree},(k,v)=>k==='parent'?undefined:v).replace(/</g,'\\u003c');
  const re=/(<script type="application\/json" id="__doc">)[\s\S]*?(<\/script>)/;
  if(re.test(PRISTINE_HTML))return PRISTINE_HTML.replace(re,(m,p1,p2)=>p1+json+p2);
  return PRISTINE_HTML;
}
async function writeFile(h){

function afterChange(){snapshot();drawSoon();renderLayers();renderTree()}
/* 排列层级（z 序即 children 顺序） */
function zorder(dir){
  const ns=selNodes();if(!ns.length)return;
  for(const n of ns){
    const arr=n.parent?n.parent.children:curPage().artboards;
    const i=arr.indexOf(n);if(i<0)continue;
    arr.splice(i,1);
    if(dir==='top')arr.push(n);
    else if(dir==='bottom')arr.unshift(n);
    else if(dir==='up')arr.splice(Math.min(arr.length,i+1),0,n);
    else arr.splice(Math.max(0,i-1),0,n);
  }
  afterChange();
}

function zoomToSel(){

/* P13/P14：深拷贝节点树（组递归），parent 引用重建，避免 JSON 循环 */
function cloneNodeTree(src,parent){
  const c={};for(const k in src)if(k!=='parent'&&k!=='children')c[k]=src[k];
  c.id=uid();c.parent=parent;
  if(src.children)c.children=src.children.map(ch=>cloneNodeTree(ch,c));
  return c;
}
/* P31：为整棵子树重发 id（实例克隆必须做，否则跨实例/母版 id 冲突） */
function reidTree(n,parent){
  n.id=uid();n.parent=parent;
  for(const c of n.children||[])reidTree(c,n);
  return n;
}
function duplicateSel(offset){
  const d=offset==null?16:offset,clones=[];
  for(const id of [...state.sel]){
    const n=nodeById(id);if(!n||n.type==='artboard'||!n.parent)continue;
    const c=cloneNodeTree(n,n.parent);
    translateNode(c,d,d); // P14：组复制时同步平移全部后代
    n.parent.children.push(c);clones.push(c);
  }
  if(clones.length){state.sel=new Set(clones.map(c=>c.id));syncSelection()}
  return clones;
}

/* ================================================================

const demo={on:false,pos:0,from:null,anim:null,t0:0,hist:[],hpos:0,overlays:[],scrollT:0,preRot:0,hover:null,down:null,zoom:1,thumbs:false,dur:320,ease:'缓出'};

/* 全局画板序列：跨页交互按 pages 顺序扁平化（页内画板顺序衔接下一页） */
const demoSeq=()=>{const s=[];pages.forEach(p=>{if(p.comp)return;p.artboards.forEach(ab=>s.push(ab))});return s};
const activeAb=()=>demoSeq()[demo.pos];
function fitCam(ab,w,h){

function withCam(c,fn){

function demoStart(startId){

/* P20：演示缩放（在 fit 基础上按倍率缩放，锚定画板中心） */
function demoCamFor(ab,w,h){

  const top=52,bot=$('#demoThumbsBar').classList.contains('open')?86:8;

function applyDemoCam(w,h){

/* P28：前进/后退历史栈（浏览器式），弹层打开时后退先关弹层 */
function demoHistPush(pos){

function demoJumpTo(i,anim,dur,ease){

function demoGo(targetId,anim,dur,ease){ // proto：打开画板（支持跨页）

function demoBack(){ // 后退：优先关闭弹层，否则回历史栈

/* P28：跨页查找节点（弹层目标可能在组件库等其它页面） */
function demoNode(id){
  for(const p of pages){
    for(const ab of p.artboards){
      if(ab.id===id)return ab;
      const find=l=>{
        for(const n of l||[]){
          if(n.id===id)return n;
          if(n.children){const r=find(n.children);if(r)return r}
        }
        return null;
      };
      const r=find(ab.children);if(r)return r;
    }
  }
  return null;
}
/* P28：弹层 open/close 与几何计算（以当前画板的屏幕矩形为基准，等比缩放） */
function demoOpenOverlay(it){
  const ab=demoNode(it.target);
  if(!ab){toast('弹层目标画板不存在');return}
  demo.overlays.push({
    abId:ab.id,anim:it.anim||'淡入',dur:it.duration||DEMO_DUR,ease:it.easing||'缓出',
    pos:it.opos||'居中',ox:Math.round(it.ox||0),oy:Math.round(it.oy||0),
    dim:it.dim==null?40:Math.min(100,Math.max(0,it.dim)),bd:it.bdclose!==false,t0:performance.now()

}
function demoCloseOverlay(){
  if(!demo.overlays.length)return;
  demo.overlays.pop();drawSoon();
}
function demoBaseRect(ab,w,h){
  const c=demoCamFor(ab,w,h);

}
function demoOverlayGeos(w,h){
  const base=activeAb();
  if(!base)return [];
  const br=demoBaseRect(base,w,h),z=br.z;
  return demo.overlays.map(ov=>{
    const ab=demoNode(ov.abId);
    if(!ab)return null;
    const sw=ab.w*z,sh=ab.h*z,m=Math.min(24,br.w*.05);
    let x,y;
    if(ov.pos==='左上'){x=br.x+m;y=br.y+m}
    else if(ov.pos==='右上'){x=br.x+br.w-sw-m;y=br.y+m}
    else if(ov.pos==='底部'){x=br.x+(br.w-sw)/2;y=br.y+br.h-sh-m}
    else{x=br.x+(br.w-sw)/2;y=br.y+(br.h-sh)/2}
    x+=ov.ox*z;y+=ov.oy*z;
    return {ov,ab,rect:{x,y,w:sw,h:sh,z}};
  }).filter(Boolean);
}
function demoPaintOverlay(g,w,h,p){
  const ab=g.ab,s={x:g.rect.x,y:g.rect.y},z=g.rect.z,r=Math.min(14,g.rect.w*.06);
  const dx=g.ov.anim==='左滑'?-1:g.ov.anim==='右滑'?1:0;
  const dy=g.ov.anim==='上滑'?1:g.ov.anim==='下滑'?-1:0;
  ctx.save();
  ctx.globalAlpha=g.ov.anim==='淡入'?p:1;
  ctx.translate(dx*(1-p)*90,dy*(1-p)*70);
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.38)';ctx.shadowBlur=40;ctx.shadowOffsetY=14;
  ctx.fillStyle=ab.bg||'#FFFFFF';
  ctx.beginPath();ctx.roundRect(s.x,s.y,g.rect.w,g.rect.h,r);ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.beginPath();ctx.roundRect(s.x,s.y,g.rect.w,g.rect.h,r);ctx.clip();
  withCam({x:s.x-ab.x*z,y:s.y-ab.y*z,z},()=>{
    drawList(ab.children,ab);
    if(demo.hover){ // 弹层内热点 hover
      const hn=flattenLeaves(ab.children).find(n=>n.id===demo.hover&&!n.hidden&&!hiddenByAncestor(n));
      if(hn){const rr=worldRect(hn),hp=w2s(rr.x,rr.y);ctx.strokeStyle='rgba(54,112,247,0.9)';ctx.lineWidth=2;ctx.strokeRect(hp.x,hp.y,rr.w*cam.z,rr.h*cam.z)}
    }
  });
  ctx.restore();
  ctx.beginPath();ctx.roundRect(s.x,s.y,g.rect.w,g.rect.h,r);
  ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
}
/* 演示帧绘制：active 画板满幅适配；过渡期间 old→new 屏幕位移/淡入 */
function paintDeviceFrame(ab,s,sw,sh){
  /* P26：按画板尺寸推断设备类型，在演示里绘制手机/桌面外框（参考 Penpot viewer） */
  const phone=ab.w<=560;
  const b=phone?9:7;
  const r1=phone?Math.min(26,(sw+b*2)*.11):Math.max(6,Math.min(14,sh*.03));
  const outer={x:s.x-b,y:s.y-b,w:sw+b*2,h:sh+b*2};
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(outer.x,outer.y,outer.w,outer.h,r1);
  ctx.roundRect(s.x,s.y,sw,sh,Math.max(0,r1-b));
  ctx.fillStyle='#0B0D12';ctx.fill('evenodd');
  ctx.beginPath();ctx.roundRect(outer.x,outer.y,outer.w,outer.h,r1);
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;ctx.stroke();
  if(phone){
    const cw=Math.min(54,outer.w*.22),ch=6;
    ctx.beginPath();ctx.roundRect(outer.x+outer.w/2-cw/2,outer.y+(b-ch)/2+1,cw,ch,ch/2);
    ctx.fillStyle='#05060A';ctx.fill();
    /* 音量/电源侧键 */
    ctx.fillStyle='#05060A';
    ctx.beginPath();ctx.roundRect(outer.x-2,outer.y+outer.h*.22,2,outer.h*.08,1);ctx.fill();
    ctx.beginPath();ctx.roundRect(outer.x+outer.w,outer.y+outer.h*.3,2,outer.h*.12,1);ctx.fill();
  }else{
    const cw=5;
    ctx.beginPath();ctx.arc(outer.x+outer.w/2,outer.y+b/2,cw/2,0,Math.PI*2);
    ctx.fillStyle='#05060A';ctx.fill();
  }
  ctx.restore();
}
function demoFrame(w,h){
  ctx.fillStyle='#1C1D21';ctx.fillRect(0,0,w,h);
  ctx.textBaseline='alphabetic';
  const seq=demoSeq();
  const a=seq[demo.pos];
  if(!a){demoExit();return}
  const c0=demoCamFor(a,w,h);cam.z=c0.z;cam.x=c0.x;cam.y=c0.y; // 每帧同步 cam：保证 s2w 命中检测与视口一致
  updateDemoZoom();

    p=demoEase(Math.min(1,(performance.now()-demo.t0)/Math.max(1,demo.dur||DEMO_DUR)));
    needDraw=true;
  }
  const paint=(ab,dx,dy,alpha)=>{
    ctx.save();ctx.globalAlpha=alpha;ctx.translate(dx,dy);
    withCam(demoCamFor(ab,w,h),()=>{
      const s=w2s(ab.x,ab.y),sw=ab.w*cam.z,sh=ab.h*cam.z;
      ctx.fillStyle=ab.bg||'#FFFFFF';
      ctx.fillRect(s.x,s.y,sw,sh);
      ctx.save();ctx.beginPath();ctx.rect(s.x,s.y,sw,sh);ctx.clip();
      drawList(ab.children,ab);
      if(demo.hover){ // 热点 hover 高亮（组内成员也支持）
        const hn=flattenLeaves(ab.children).find(n=>n.id===demo.hover&&!n.hidden&&!hiddenByAncestor(n));
        if(hn){const r=worldRect(hn),hp=w2s(r.x,r.y);ctx.strokeStyle='rgba(54,112,247,0.9)';ctx.lineWidth=2;ctx.strokeRect(hp.x,hp.y,r.w*cam.z,r.h*cam.z)}
      }
      ctx.restore();

    });

  };

  if(old&&demo.anim){
    const dir=demo.anim;let ox=0,oy=0,nx=0,ny=0;
    if(dir==='左滑'){ox=-w*p;nx=w*(1-p)}
    else if(dir==='右滑'){ox=w*p;nx=-w*(1-p)}
    else if(dir==='上滑'){oy=-h*p;ny=h*(1-p)}
    else if(dir==='下滑'){oy=h*p;ny=-h*(1-p)}
    paint(old,ox,oy,1);
    paint(a,dir==='淡入'?0:nx,dir==='淡入'?0:ny,dir==='淡入'?p:1);

  }else{
    paint(a,0,0,1);

  /* P28：弹层遮罩 + 弹层画板（画在最上层） */
  const geos=demoOverlayGeos(w,h);

    geos.forEach(g=>{
      const p2=demoEase(Math.min(1,(performance.now()-g.ov.t0)/Math.max(1,g.ov.dur||DEMO_DUR)));
      if(p2<1)needDraw=true;

    });
  }
}
/* 演示交互：按下/单击/悬停 三种触发 */
/* 板内命中：px/py 为画板本地坐标 */
function demoHitInBoard(ab,px,py){
  const leaves=flattenLeaves(ab.children).filter(n=>!n.hidden&&!n.locked&&!hiddenByAncestor(n));
  for(let j=leaves.length-1;j>=0;j--){
    const n=leaves[j],r=worldRect(n);
    const x=r.x-ab.x,y=r.y-ab.y;
    if(px>=x&&px<=x+r.w&&py>=y&&py<=y+r.h)return n;
  }
  return null;
}
/* P28：命中顺序 = 顶层弹层 → 当前画板；点在弹层外返回 null（由遮罩逻辑处理） */
function demoHitNode(sx,sy){
  const ab=activeAb();if(!ab)return null;
  const w=wrap.clientWidth,h=wrap.clientHeight;
  const geos=demoOverlayGeos(w,h);
  if(geos.length){
    const g=geos[geos.length-1];
    if(sx>=g.rect.x&&sx<=g.rect.x+g.rect.w&&sy>=g.rect.y&&sy<=g.rect.y+g.rect.h){
      return demoHitInBoard(g.ab,(sx-g.rect.x)/g.rect.z,(sy-g.rect.y)/g.rect.z);
    }
    return null;
  }
  const c=demoCamFor(ab,w,h);
  return demoHitInBoard(ab,(sx-(c.x+ab.x*c.z))/c.z,(sy-(c.y+ab.y*c.z))/c.z);
}
const protoOf=(n,tr)=>n&&n.proto&&n.proto.find(it=>it.trigger===tr);
const protoOfDir=(n,tr,dir)=>n&&n.proto&&n.proto.find(it=>it.trigger===tr&&(!it.dir||it.dir==='任意'||it.dir===dir));
const demoFire=(it)=>{
  if(!it)return false;
  if(it.action==='返回上一页')demoBack();
  else if(it.action==='关闭弹层')demoCloseOverlay();
  else if(it.action==='打开弹层')demoOpenOverlay(it);
  else demoGo(it.target,it.anim,it.duration,it.easing);

};
function demoDown(e){
  const rect=canvas.getBoundingClientRect();

  let backdrop=false;
  if(geos.length){
    const g=geos[geos.length-1];
    backdrop=!(sx>=g.rect.x&&sx<=g.rect.x+g.rect.w&&sy>=g.rect.y&&sy<=g.rect.y+g.rect.h);
  }
  const n=backdrop?null:demoHitNode(sx,sy);
  demo.down={sx,sy,id:n&&n.id,backdrop};
  if(!demo.anim&&n)demoFire(protoOf(n,'按下')); // 按下触发
}
function demoUp(e){
  const d=demo.down;demo.down=null;if(!d)return;
  const rect=canvas.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  const dx=sx-d.sx,dy=sy-d.sy;
  if(Math.hypot(dx,dy)>20){ // P28：拖拽触发（按方向匹配）
    const n=d.id?demoNode(d.id):null;
    const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'向右':'向左'):(dy>0?'向下':'向上');
    const it=protoOfDir(n,'拖拽',dir);
    if(it&&!demo.anim)demoFire(it);
    return;
  }
  if(d.backdrop){ // 点击遮罩关闭
    const geos=demoOverlayGeos(wrap.clientWidth,wrap.clientHeight);
    const g=geos[geos.length-1];
    if(g&&g.ov.bd)demoCloseOverlay();
    return;
  }
  if(demo.anim)return;
  demoFire(protoOf(demoHitNode(sx,sy),'单击'));
}
function demoMove(e){
  if(demo.anim)return;
  const rect=canvas.getBoundingClientRect();
  const n=demoHitNode(e.clientX-rect.left,e.clientY-rect.top);
  const hov=n&&n.proto&&n.proto.length?n.id:null;

  canvas.style.cursor=hov?'pointer':'default';
  if(hov)demoFire(protoOf(n,'悬停'));
}

/* ================================================================
 * P3 导出 PNG / 切图：离屏 canvas 复用 drawNode 重渲染
 * ZIP 批量采用内联 store（无压缩）打包 —— 保持单文件零依赖
 * ================================================================ */
function cleanName(s){
  return String(s||'导出').replace(/[\\/:*?"<>|]/g,'_').replace(/\.(prototype\.)?html?$/i,'');
}
/* 离屏渲染整个画板（scale 倍）：drawNode 内部经 w2s() 绘制，
 * 故临时切换 cam（z=scale、画板原点归零）而非仅设 setTransform */
function renderBoard(ab,scale){
  const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(ab.w*scale));
  cv.height=Math.max(1,Math.round(ab.h*scale));
  const g=cv.getContext('2d');
  const oldCtx=ctx,oCam={x:cam.x,y:cam.y,z:cam.z};
  ctx=g;cam.z=scale;cam.x=-ab.x*scale;cam.y=-ab.y*scale;
  try{
    g.setTransform(1,0,0,1,0,0);
    /* P24：隔离画布状态，避免上一次选中透明元素时的 alpha/filter/阴影污染本次导出 */
    g.globalAlpha=1;g.globalCompositeOperation='source-over';
    g.filter='none';g.shadowColor='transparent';g.shadowBlur=0;g.shadowOffsetX=0;g.shadowOffsetY=0;
    g.fillStyle=ab.bg||'#FFFFFF';
    g.fillRect(0,0,ab.w*scale,ab.h*scale); // bg 直接按画布像素铺满（不走 w2s）
    drawList(ab.children,ab);
  }finally{
    g.globalAlpha=1;g.filter='none';
    cam.x=oCam.x;cam.y=oCam.y;cam.z=oCam.z;ctx=oldCtx;
  }
  return cv;
}
/* ---- 内联 ZIP（store 格式 + UTF-8 文件名） ---- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0}return t})();
function crc32(u8){
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipStore(files){ // files:[{name,u8:Uint8Array}]
  const enc=new TextEncoder(),chunks=[],central=[];
  let off=0;
  const u16=v=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for(const f of files){
    const name=enc.encode(f.name),data=f.u8,crc=crc32(data);
    const lh=new Uint8Array([0x50,0x4B,0x03,0x04,
      ...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),
      ...u16(name.length),...u16(0),...name]);
    chunks.push(lh,data);
    central.push(new Uint8Array([0x50,0x4B,0x01,0x02,
      ...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),
      ...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off),
      ...name]));
    off+=lh.length+data.length;
  }
  const cdStart=off;let cdLen=0;central.forEach(c=>cdLen+=c.length);
  const eocd=new Uint8Array([0x50,0x4B,0x05,0x06,
    ...u16(0),...u16(0),...u16(files.length),...u16(files.length),
    ...u32(cdLen),...u32(cdStart),...u16(0)]);
  return new Blob([...chunks,...central,eocd],{type:'application/zip'});
}
function downloadBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function cvBlob(cv,fmt){
  if(fmt==='jpg'){ // P17：JPEG 无透明通道 → 先铺白底再编码
    const c2=document.createElement('canvas');
    c2.width=cv.width;c2.height=cv.height;
    const g=c2.getContext('2d');
    g.fillStyle='#FFFFFF';g.fillRect(0,0,c2.width,c2.height);g.drawImage(cv,0,0);
    return new Promise(r=>c2.toBlob(r,'image/jpeg',0.92));
  }
  if(fmt==='webp')return new Promise(r=>cv.toBlob(r,'image/webp',0.92)); // P20
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
/* 单项离屏渲染（P21：导出 / PDF / 预览复用） */
function expCanvas(it,scale){
  const cv=renderBoard(it.ab,scale);
  if(!it.clip)return cv;
  const c2=document.createElement('canvas');
  c2.width=Math.max(1,Math.round(it.clip.w*scale));
  c2.height=Math.max(1,Math.round(it.clip.h*scale));
  c2.getContext('2d').drawImage(cv,-(it.clip.x-it.ab.x)*scale,-(it.clip.y-it.ab.y)*scale);
  return c2;
}
/* items:[{name,ab,clip?}] → 单项下载 / 多项打 ZIP；fmt='png'|'jpg'|'webp'|'svg'（P17/P20）
 * P21：opts.onProgress(done,total) 供统一导出对话框显示进度 */
async function exportItems(items,scale,fmt='png',opts={}){
  if(!items.length){toast('没有可导出的内容');return}
  const ext=fmt==='jpg'?'jpg':fmt==='webp'?'webp':fmt==='svg'?'svg':'png';
  const mime={png:'image/png',jpg:'image/jpeg',webp:'image/webp',svg:'image/svg+xml'}[ext];
  const seen={},files=[];
  for(let idx=0;idx<items.length;idx++){
    const it=items[idx];
    const out=expCanvas(it,scale);
    const base=cleanName(it.name);
    seen[base]=(seen[base]||0)+1;
    const nm=seen[base]>1?`${base}_${seen[base]}`:base;
    let u8;
    if(ext==='svg'){ // P20：SVG（位图内嵌 + title/desc 元数据）
      const escv=String(it.name||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${out.width}" height="${out.height}" viewBox="0 0 ${out.width} ${out.height}">`
        +`<title>${escv}</title><desc>自研 Canvas 编辑器 · 位图内嵌导出</desc>`
        +`<image href="${out.toDataURL('image/png')}" x="0" y="0" width="${out.width}" height="${out.height}"/></svg>`;
      u8=new TextEncoder().encode(svg);
    }else{
      const blob=await cvBlob(out,ext);
      u8=new Uint8Array(await blob.arrayBuffer());
    }
    files.push({name:nm+'.'+ext,u8,mime});
    if(opts.onProgress)opts.onProgress(idx+1,items.length);
    await new Promise(r=>setTimeout(r,0));
  }
  if(files.length===1){
    downloadBlob(new Blob([files[0].u8],{type:files[0].mime}),files[0].name);
    toast('已导出 '+files[0].name);
  }else{
    downloadBlob(zipStore(files),(docTitle||cleanName(fileName)||'切片')+'-切图.zip');
    toast('已导出 '+files.length+' 张切图（ZIP）');
  }
}
/* 选中导出：画板→整板；节点→按包围盒切图（含跨画板多选） */
function exportSelection(scale=1,fmt='png'){

  if(!nodes.length){toast('请先选中画板或图层');return}
  /* P26：画板外自由图层暂不支持整图导出（没有可裁切的画板背景） */
  if(nodes.some(n=>n.type!=='artboard'&&!abOf(n))){toast('画板外图层暂不支持导出');return}

/* ================================================================
 * P21-C：统一导出（PDF 多页 / per-object 命名 / 预览 + 进度）
 * PDF 采用内联 JPEG XObject（DCTDecode），零依赖单文件
 * ================================================================ */
function b64Bytes(b64){
  const s=atob(b64),u=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
  return u;
}
const pdfNum=v=>String(Math.round(v*100)/100);
/* pages:[{w,h,bytes(JPEG)}] → PDF Blob（每项一页） */
function pdfFromJpegs(pages){
  const enc=new TextEncoder(),parts=[];let off=0;
  const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);off+=u.length};
  const n=pages.length,total=3+3*n,ofs=new Array(total+1).fill(0);
  push('%PDF-1.4\n');
  const add=(id,body,stream)=>{
    ofs[id]=off;
    push(id+' 0 obj\n');push(body);
    if(stream!=null){push('stream\n');push(stream);push('\nendstream\n')}
    push('endobj\n');
  };
  const kids=[];
  for(let i=0;i<n;i++)kids.push((3+i*3)+' 0 R');
  add(1,'<< /Type /Catalog /Pages 2 0 R >>\n');
  add(2,`<< /Type /Pages /Count ${n} /Kids [${kids.join(' ')}] >>\n`);
  for(let i=0;i<n;i++){
    const pid=3+i*3,cid=pid+1,iid=pid+2,pg=pages[i];
    const wp=pdfNum(pg.w*0.75),hp=pdfNum(pg.h*0.75); // 96dpi → 72pt
    const content=`q ${wp} 0 0 ${hp} 0 0 cm /Im0 Do Q`;
    add(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wp} ${hp}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>\n`);
    add(cid,`<< /Length ${enc.encode(content).length} >>\n`,content);
    add(iid,`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\n`,pg.bytes);
  }
  const xref=off;
  push('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');
  for(let i=1;i<=total;i++)push(String(ofs[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function exportPdf(items,scale,onProgress,outName){
  const pages=[];
  for(let i=0;i<items.length;i++){
    const cv=expCanvas(items[i],scale);
    const url=cv.toDataURL('image/jpeg',0.92);
    pages.push({w:cv.width,h:cv.height,bytes:b64Bytes(url.slice(url.indexOf(',')+1))});
    if(onProgress)onProgress(i+1,items.length);
    await new Promise(r=>setTimeout(r,0));
  }
  if(!pages.length){toast('没有可导出的内容');return}
  const nm=(outName||cleanName(fileName)||'画板')+'.pdf';
  downloadBlob(pdfFromJpegs(pages),nm);
  toast('已导出 '+nm);
}

function openExportDlg(opt={}){
  expDlg.open=true;expDlg.running=false;
  /* P24：每次打开都从默认状态重建，不沿用上一次（尤其是透明元素）的设置 */
  expDlg.scale=opt.scale||1;
  expDlg.format=opt.fmt||opt.format||'png';
  let sc=opt.scope||(state.sel.size?'selection':'board');
  if(sc==='selection'&&!state.sel.size)sc='board';
  expDlg.scope=sc;
  expDlg.items=[];expDlg.seq++;
  $('#expDlgScale').innerHTML=EXP_SCALES.map(v=>`<option value="${v}">${v}x</option>`).join('');
  $('#expDlgScale').value=String(expDlg.scale);
  $('#expDlgScope').value=expDlg.scope;
  $('#expDlgName').value='';
  $('#expDlgSuffix').value='';
  [...$('#expDlgFmt').children].forEach(b=>b.classList.toggle('on',b.dataset.ef===expDlg.format));
  $('#expDlgRun').disabled=true;$('#expDlgRun').textContent='导出';
  $('#expDlgPrev').innerHTML='<div class="edlg-empty">正在生成预览…</div>';
  $('#exportDlg').hidden=false;
  expDlgBar(0);expDlgSay('准备就绪');
  expDlgPreview();
}
function closeExportDlg(){
  if(expDlg.running)return;
  expDlg.open=false;expDlg.seq++;expDlg.items=[];
  expDlg.scale=1;expDlg.format='png';expDlg.scope='selection';
  $('#exportDlg').hidden=true;expDlgBar(0);
}
$('#expDlgClose').innerHTML=icon('x',16);
$('#expDlgClose').addEventListener('click',closeExportDlg);
$('#expDlgCancel').addEventListener('click',closeExportDlg);
$('#exportDlg').addEventListener('mousedown',e=>{if(e.target.id==='exportDlg')closeExportDlg()});
$('#expDlgFmt').addEventListener('click',e=>{
  const b=e.target.closest('[data-ef]');if(!b||expDlg.running)return;
  expDlg.format=b.dataset.ef;
  [...$('#expDlgFmt').children].forEach(x=>x.classList.toggle('on',x===b));
});
$('#expDlgScope').addEventListener('change',()=>{
  if(expDlg.running)return;
  expDlg.scope=$('#expDlgScope').value;
  expDlgPreview();
});
$('#expDlgScale').addEventListener('change',()=>{expDlg.scale=parseFloat($('#expDlgScale').value)||1});
$('#expDlgRun').addEventListener('click',async()=>{
  if(expDlg.running)return;
  const items=expDlg.items;
  if(!items.length){toast('没有可导出的内容');return}
  const scale=expDlg.scale,fmt=expDlg.format;
  const suffix=$('#expDlgSuffix').value.trim();
  const base=$('#expDlgName').value.trim();
  const named=items.map(it=>Object.assign({},it,{
    name:(base?(items.length===1?base:base+'-'+(it.name||'导出')):(it.name||'导出'))+suffix
  }));
  expDlg.running=true;$('#expDlgRun').disabled=true;$('#expDlgRun').textContent='导出中…';
  const prog=(d,t)=>{expDlgBar(t?d/t:0);expDlgSay('正在导出 '+d+' / '+t)};
  try{
    if(fmt==='pdf')await exportPdf(named,scale,prog,base||cleanName(fileName));
    else await exportItems(named,scale,fmt,{onProgress:prog});
    expDlgSay('已完成');expDlgBar(1);
  }catch(err){console.warn(err);expDlgSay('导出失败');toast('导出失败')}
  expDlg.running=false;$('#expDlgRun').disabled=false;$('#expDlgRun').textContent='导出';
  setTimeout(()=>{if(expDlg.open)closeExportDlg()},500);
});
